# Routine manifest — source of truth for bootstrapping Claude Code scheduled
# agents ("routines") on a new owner's machine. The SKILL.md bodies live in
# scheduled-tasks/<id>/SKILL.md (templated with __REPO__ / __SLACK_MCP__ /
# __STANDUP_CHANNEL__ / __ROLLUP_CHANNEL__ / __JIRA_PROJECT__ placeholders).
#
# install-routines.sh materialises the SKILL.md files into
#   ~/.claude/scheduled-tasks/<id>/SKILL.md
# then emits the create_scheduled_task registration payloads from this manifest
# for Claude to register via the scheduled-tasks MCP (a shell script cannot call
# MCP itself). The cron expression + enabled flag below ARE the schedule —
# they are NOT stored in SKILL.md, only in the app's registry.
#
# Cron expressions are 5-field and evaluated in the machine's local timezone
# (the owner runs IST).

routines:
  - id: daily-standup
    cron: "0,30 6-23 * * 1-5"    # weekdays, every 30 min 06:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: [standup_channel]      # __STANDUP_CHANNEL__ must be set
    permissions: []

  - id: service-brief-daily
    cron: "0,30 18-23 * * *"      # daily, every 30 min 18:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []
    permissions: []

  - id: track-work-ticketize
    cron: "15,45 6-23 * * 1-5"    # weekdays, every 30 min 06:15–23:45 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []                     # channel read from config by relay_bot; no token
    permissions: [Bash]

  - id: rollup-classify
    cron: "0,30 15-23 * * 1-5"    # weekdays, every 30 min 15:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: [rollup_channel]       # __ROLLUP_CHANNEL__ must be set
    permissions: [Bash]

  - id: daily-leaves-classify
    cron: "0,30 4-23 * * *"       # daily, every 30 min 04:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []
    permissions: [Bash]

  - id: slack-ingest
    cron: "0,30 12-22 * * *"      # every 30 min, 12:00–22:30 IST
    enabled: false                # off by default — owner enables after backfill
    needs: [slack_mcp]            # __SLACK_MCP__ must be set
    permissions: [Bash]

  - id: slack-reconcile
    cron: "0 2 * * *"             # nightly 02:00 IST
    enabled: false                # off by default
    needs: [slack_mcp]
    permissions: []

  - id: doc-sync-sweep
    cron: "0,30 10-23 1-3 * *"    # monthly days 1–3, every 30 min 10:00–23:30 IST (retry until 1 success/month; SKILL.md run-once gate)
    enabled: true
    needs: []                     # preview + discovery cards post to doc-sweep channel (config doc_sync.yaml slack.channel_id, via Slack MCP); Relay bot uses ~/.secrets/relay_slack.env
    permissions: [Bash]
    # SKILL runs with --dry-run --target channel: monthly CHANNEL-PREVIEW to #doc-sweep
    # (ZERO live Confluence comments). Includes a Chrome diagram pass (attempt-with-fallback —
    # only reads ZenUML/image diagrams when a work browser is connected; headless cron fires
    # fall back to a "verify manually" note) + Relay Approve/Reject cards for newly-discovered
    # docs (Approve → monitor, Reject → excluded). Comments reach Confluence only via a human
    # Approve on a Relay finding card — the sweep never auto-posts, so --dry-run stays on.
    # Dedup gate now catches reworded re-finds (exact + fuzzy same-page identifier match).
    # NOTE: Relay app (@relaybot) must be a member of #doc-sweep for the cards to post.

  - id: doc-sync-digest
    cron: "0,30 13-23 * * 1,3,5"  # Mon/Wed/Fri, every 30 min 13:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []                     # read-only; posts pending-review list to owner DM
    permissions: [Bash]

  - id: leave-plan-reminder
    cron: "0 10 1 2,4,6,8,10,12 *"  # 1st of even months (Feb/Apr/Jun/Aug/Oct/Dec) at 10:00 IST — single fire, no retry gate
    enabled: true
    needs: [leave_plan_channel]     # __LEAVE_PLAN_CHANNEL__ + __LEAVE_PLAN_SUBTEAM__ must be set (config slack.leave_plan_*)
    permissions: []                 # posts via Slack MCP; no Bash
    # LIVE post to #cbs-transaction-internal: pings the owner's team subteam to update the leave
    # plan for the NEXT two months (computed at run time in IST). Each fire is 1 month before the
    # 2-month window starts (e.g. Apr 1 → "May and June"). One message per fire.

  - id: refresh-embeddings-weekly
    cron: "*/30 * * * 3,4"        # fires every 30 min Wed+Thu; SKILL.md STEP-0 gate runs ONLY in Wed 17:00 → Thu 23:00 IST window, idles once stamped (weekly retry-until-success / cycle)
    enabled: true
    needs: [rollup_channel]       # posts a run-summary to #rollup (__ROLLUP_CHANNEL__) on success, like rollup-classify. Embeddings use the OpenAI key from ~/.secrets (not a routine token). Overrides the skill's "do not cron" note — owner decision 2026-06-18.
    permissions: [Bash]
