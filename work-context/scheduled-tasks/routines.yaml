# Routine manifest — source of truth for bootstrapping Claude Code scheduled
# agents ("routines") on a new owner's machine. The SKILL.md bodies live in
# scheduled-tasks/<id>/SKILL.md (templated with __REPO__ / __SLACK_MCP__ /
# __STANDUP_CHANNEL__ / __ROLLUP_CHANNEL__ / __JIRA_PROJECT__ placeholders).
#
# install-routines.sh materialises the SKILL.md files into
#   ~/.claude/scheduled-tasks/<id>/SKILL.md
# then emits the create_scheduled_task registration payloads from this manifest
# for Claude to register via the scheduled-tasks MCP (a shell script cannot call
# MCP itself). The cron expression + enabled flag below ARE the schedule —
# they are NOT stored in SKILL.md, only in the app's registry.
#
# Cron expressions are 5-field and evaluated in the machine's local timezone
# (the owner runs IST).

routines:
  - id: daily-standup
    cron: "0,30 6-23 * * 1-5"    # weekdays, every 30 min 06:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: [standup_channel, team_standup_channel]  # __STANDUP_CHANNEL__ (Day update + Your queue) + __TEAM_STANDUP_CHANNEL__ (team Standup-updates) must be set
    permissions: []

  - id: service-brief-daily
    cron: "0,30 18-23 * * *"      # daily, every 30 min 18:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []
    permissions: []

  - id: track-work-ticketize
    cron: "15,45 6-23 * * 1-5"    # weekdays, every 30 min 06:15–23:45 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []                     # channel read from config by relay_bot; no token
    permissions: [Bash]

  - id: rollup-classify
    cron: "0,30 15-23 * * 1-5"    # weekdays, every 30 min 15:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: [rollup_channel]       # __ROLLUP_CHANNEL__ must be set
    permissions: [Bash]

  - id: daily-leaves-classify
    cron: "0,30 13-23 * * *"      # daily, every 30 min 13:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: []
    permissions: [Bash]
    # Starts AFTER the slack-ingest window opens (12:00 IST) — the dump reads Slack events
    # from events.db, so a pre-ingest run misses same-morning leave announcements (seen
    # 2026-07-06). SKILL.md STEP-0 additionally idles until state/last_slack_success.date
    # == today, so a late first ingest success just delays (never skips) the classify.

  - id: slack-ingest
    cron: "0,30 12-22 * * *"      # every 30 min, 12:00–22:30 IST
    enabled: false                # off by default — owner enables after backfill
    needs: [slack_mcp]            # __SLACK_MCP__ must be set
    permissions: [Bash]

  - id: slack-reconcile
    cron: "0 2 * * *"             # nightly 02:00 IST
    enabled: false                # off by default
    needs: [slack_mcp]
    permissions: []

  - id: doc-sync-sweep
    cron: "0,30 10-23 1-3 * *"    # monthly days 1–3, every 30 min 10:00–23:30 IST (retry until 1 success/month; SKILL.md run-once gate)
    enabled: true
    needs: []                     # preview + discovery cards post to doc-sweep channel (config doc_sync.yaml slack.channel_id, via Slack MCP); Relay bot uses ~/.secrets/relay_slack.env
    permissions: [Bash]
    # SKILL runs with --dry-run --target channel: monthly CHANNEL-PREVIEW to #doc-sweep
    # (ZERO live Confluence comments). Chrome diagram pass is REQUIRED/DEFAULT (not optional):
    # TWO-marker gate — POSTED (text sweep delivered once/month) vs SUCCESS (diagram pass actually
    # ran, or zero diagram docs). A headless fire posts the text preview once then retries in
    # DIAGRAM-ONLY mode until a Confluence-signed-in browser is connected and the diagrams are
    # read — diagrams are never silently skipped-as-done. Plus Relay Approve/Reject cards for
    # newly-discovered docs (Approve → monitor, Reject → excluded). Comments reach Confluence only
    # via a human Approve on a Relay finding card — the sweep never auto-posts, so --dry-run stays on.
    # Dedup gate catches reworded re-finds (exact + fuzzy same-page identifier match).
    # NOTE: Relay app (@relaybot) must be a member of #doc-sweep for the cards to post.

  - id: doc-sync-digest
    cron: "0,30 13-23 * * 1,3,5"  # Mon/Wed/Fri, every 30 min 13:00–23:30 IST (retry until 1 success/day; SKILL.md run-once gate)
    enabled: true
    needs: [dev_updates_channel]  # read-only on Confluence; posts pending-review list to __DEV_UPDATES_CHANNEL__
    permissions: [Bash]

  - id: leave-plan-reminder
    cron: "0 10 1 2,4,6,8,10,12 *"  # 1st of even months (Feb/Apr/Jun/Aug/Oct/Dec) at 10:00 IST — single fire, no retry gate
    enabled: true
    needs: [leave_plan_channel]     # __LEAVE_PLAN_CHANNEL__ + __LEAVE_PLAN_SUBTEAM__ must be set (config slack.leave_plan_*)
    permissions: []                 # posts via Slack MCP; no Bash
    # LIVE post to __LEAVE_PLAN_CHANNEL__: pings the owner's team subteam to update the leave
    # plan for the NEXT two months (computed at run time in IST). Each fire is 1 month before the
    # 2-month window starts (e.g. Apr 1 → "May and June"). One message per fire.

  - id: refresh-embeddings-weekly
    cron: "*/30 * * * 3,4"        # fires every 30 min Wed+Thu; SKILL.md STEP-0 gate runs ONLY in Wed 17:00 → Thu 23:00 IST window, idles once stamped (weekly retry-until-success / cycle)
    enabled: true
    needs: [rollup_channel]       # posts a run-summary to #rollup (__ROLLUP_CHANNEL__) on success, like rollup-classify. Embeddings use the OpenAI key from ~/.secrets (not a routine token). Overrides the skill's "do not cron" note — owner decision 2026-06-18.
    permissions: [Bash]

  - id: monthly-highs-lows
    cron: "0,30 12-23 28-31 * *"  # monthly on the 28th, every 30 min 12:00–23:30 IST (days 28–31 = retry insurance if the 28th is fully missed); SKILL.md month-stamp gate idles once succeeded that month (retry-until-success). Never bleeds into the next month.
    enabled: true
    needs: [dev_updates_channel]  # pushes the month's highs/lows to the standup-updates channel (__DEV_UPDATES_CHANNEL__) on success. Owner-only channel. Embeddings use the OpenAI key from ~/.secrets (not a routine token).
    permissions: [Bash]
    # STEP 1 runs the COMPLETE /refresh-embeddings pipeline (same as refresh-embeddings-weekly, minus the
    # #rollup run-summary); if the weekly already embedded the delta, STEP 1 reports embed_required==0 and
    # finishes instantly. STEP 2 invokes /ask "highs and lows from <month>-01 to <month>-28" → highs_lows
    # intent → delegates to /retro → writes management/retros/<since>-to-<until>.md. STEP 3 posts the
    # Highs/Lows to __DEV_UPDATES_CHANNEL__ as the owner (5000-char split at the Highs/Lows boundary).
    # NO Anthropic API anywhere (OpenAI = embeddings only; /ask + /retro synthesise in-chat).

  - id: ingest-autofix
    cron: "0 16 * * *"            # daily at 16:00 IST, best-effort (single run, no retries, no run-once gate)
    enabled: true
    needs: [rollup_channel]        # posts a run-summary to #rollup (__ROLLUP_CHANNEL__), like rollup-classify
    permissions: [Bash]
    # Resolves the github/jira/confluence validators' "unmapped actor" attribution WARNs:
    # derive/unmapped_actors.py lists every unscoped actor → chat resolves each via the Atlassian
    # lookup MCP → TIERED-AUTO write to config/people.yaml (gitignored, leak-safe). SAFE class
    # auto-applies (one org-domain human → scope:org via derive/people_autofix_apply.py append-only;
    # clear bot/service → scope:external); RISKY class (alias-merge into existing person, possible
    # teammate, ambiguous) is PARKED in state/ingest_autofix_pending.json for owner review — never
    # auto-merged, never auto-team. Re-runs the validators + refreshes cached state so cron-status
    # reflects clean. Slack drift/orphan + pipeline-coverage WARNs are REPORTED only (not auto-fixable).
    # NO Anthropic API (scripts strip auth; identity judgment happens in-chat).

  - id: housekeeping-review
    cron: "0,30 6-13 * * 1"      # Mondays, every 30 min 06:00–13:30 IST (retry until 1 success/WEEK; SKILL.md run-once gate, week-stamp)
    enabled: true
    needs: [rollup_channel]       # posts Approve/Reject cleanup cards to #rollup (__ROLLUP_CHANNEL__); Relay bot uses ~/.secrets/relay_slack.env
    permissions: [Bash]
    # OWNS the project prune now (the com.example.housekeeping launchd job is disabled): STEP 1
    # runs bin/housekeeping.sh --apply (the deterministic prune — old backups/verdicts/handoffs/
    # logs/.DS_Store + stale-MPIM + Steno audio-retention [archived .m4a >14d + orphan raw .wav;
    # starred meetings exempt, transcripts/events.db untouched], UNCHANGED otherwise). STEP 2 runs
    # --scan → state/housekeeping_candidates.json
    # (further cleanup candidates as FACTS, no deletion). STEP 3 classifies each in-chat (per
    # .claude/shared/housekeeping-classify.md) → state/housekeeping_verdicts.json → renders via
    # derive/housekeeping_render.py → posts Approve/Reject cards to #rollup. SUGGEST-ONLY: the only
    # unattended deletes are the STEP-1 prune; every further suggestion needs an owner Approve click
    # (Relay → bin/housekeeping_apply.py, git-safe — never deletes a tracked file). NO Anthropic API.
    # NOTE: Relay app (@relaybot) must be a member of #rollup for the cards to post.
