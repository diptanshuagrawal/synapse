<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Planner — Initiatives &amp; Capacity</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#f3f6fa; --surface:#ffffff; --surface2:#eef2f8; --border:#e4e9f2;
    --text:#15202e; --muted:#5b6675; --hint:#9aa6b4;
    --accent:#3a55d9; --accent-2:#2c41b8; --accent-soft:rgba(58,85,217,.07);
    --ok:#3b6b3f; --ok-bg:#e9f1e8; --warn:#866113; --warn-bg:#f6efdd; --danger:#b23a4a; --danger-bg:#f8edef;
    --shadow:0 1px 2px rgba(20,32,46,.04),0 2px 6px rgba(20,32,46,.05);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.45;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 70px;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;}
  h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0;}
  .filters{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .dd{position:relative;}
  .dd>button{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:150px;text-align:left;}
  .dd>button:hover{border-color:var(--accent);}
  .dd .menu{display:none;position:absolute;z-index:20;right:0;margin-top:4px;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:8px;min-width:230px;max-height:320px;overflow:auto;}
  .dd.open .menu{display:block;}
  .dd .menu label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  .dd .menu label:hover{background:var(--surface2);}
  .dd .menu .grp{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--hint);
    font-weight:600;padding:8px 8px 3px;}
  .dd .menu .grp:first-child{padding-top:2px;}
  button.recalc{font-family:inherit;font-size:12.5px;padding:8px 12px;border-radius:10px;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);}
  button.recalc:hover{background:var(--surface2);}
  /* capacity strip */
  .strip{margin:8px 0 20px;}
  .mcap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;}
  .mcap .mn{font-size:13px;font-weight:700;}
  .mcap .nums{display:flex;gap:16px;margin:8px 0 8px;font-family:'IBM Plex Mono',monospace;}
  .mcap .nums .lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;}
  .mcap .nums b{font-size:20px;}
  .mcap .planned b{color:var(--accent-2);}
  .bar{height:7px;border-radius:5px;background:var(--surface2);overflow:hidden;}
  .bar>i{display:block;height:100%;border-radius:5px;}
  .bar>i.cool{background:var(--ok);} .bar>i.warm{background:var(--warn);} .bar>i.hot{background:var(--danger);}
  .verdict{font-size:11.5px;font-weight:600;margin-top:6px;}
  .verdict.cool{color:var(--ok);} .verdict.warm{color:var(--warn);} .verdict.hot{color:var(--danger);}
  .cards-strip{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
  .mcap{cursor:pointer;position:relative;} .mcap:hover{border-color:var(--accent);}
  .mcap .caret{position:absolute;top:12px;right:14px;color:var(--hint);font-size:11px;}
  .cappanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:6px 18px 10px;margin-top:12px;}
  .cappanel .ph{font-size:12px;font-weight:700;padding:12px 8px 4px;}
  .capcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 14px;}
  .capcards .c{background:var(--surface2);border-radius:10px;padding:10px 12px;}
  .capcards .l{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .capcards .v{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .gridwrap{overflow-x:auto;}
  .daygrid{border-collapse:collapse;font-size:11px;} .daygrid th,.daygrid td{border:1px solid var(--border);}
  .daygrid th.gd{padding:3px 4px;text-align:center;color:var(--muted);min-width:22px;}
  .daygrid th.gd.we{background:var(--surface2);} .daygrid th.gd.hol{background:var(--accent-soft);}
  .daygrid th.gd small{display:block;font-size:8px;}
  .daygrid td.gname,.daygrid th.gname{text-align:left;padding:4px 8px;white-space:nowrap;position:sticky;left:0;background:var(--surface);}
  .daygrid td.gname .role{color:var(--muted);font-size:10px;}
  .daygrid td.gname .deduct{font-size:9.5px;color:var(--muted);margin-top:1px;}
  .daygrid td.dc{width:22px;height:22px;text-align:center;font-weight:600;font-size:10px;}
  .daygrid td.dc.lv-cell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
  /* An EM-entered day is marked so a reconstructed absence never looks like a reported one. */
  /* An override is a different kind of fact from a reported absence, and this page says
     so with the accent rather than with the shared underline. */
  .daygrid td.dc.lv-man{box-shadow:inset 0 -3px 0 var(--accent);text-decoration:none;}
  .daygrid td.dc.saving{opacity:.45;}
  .dc.c-av{background:#e9f1e8;} .dc.c-w{background:#dfeccf;color:#3b6b3f;} .dc.c-o{background:#e7eefa;color:#2b57a8;}
  .dc.c-l{background:#f6e9ec;color:#a23b4e;} .dc.c-h{background:#eceaf9;} .dc.c-we{background:var(--surface2);}
  :root[data-theme]{} /* daygrid marker colors are light-fixed; readable on both themes */
  .glegend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:8px;align-items:center;}
  .seedbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9997;
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--accent);border-radius:12px;padding:10px 14px;
    box-shadow:0 6px 24px rgba(20,32,46,.18);font-size:13px;max-width:min(760px,94vw);}
  .seedbar .btn{font:600 12.5px 'Hanken Grotesk',sans-serif;padding:7px 12px;border-radius:9px;
    border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;}
  .seedbar #planSeedGo{background:var(--accent);border-color:var(--accent);color:#fff;}
  .glegend .lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:middle;}
  /* initiative detail row */
  .summ-toggle{cursor:pointer;} .summ-toggle:hover .nm{color:var(--accent-2);}
  .caretline{color:var(--hint);font-size:10px;margin-right:5px;}
  tr.detail td{background:var(--surface2);padding:14px 16px;}
  .detail h4{margin:0 0 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .detail p{margin:0 0 12px;white-space:pre-wrap;font-size:13px;color:var(--text);}
  .detail .impact{color:var(--accent-2);font-weight:600;}
  /* table */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 16px 10px;}
  /* Enough optional columns (delivery dates, PODs, cycle) and the table outgrows the panel.
     It used to just spill out and clip the action column, putting Submit out of reach. */
  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0;}
  /* the action column stays pinned to the right edge while the rest scrolls under it */
  th.act,td.act{position:sticky;right:0;z-index:2;background:var(--surface);
    border-left:1px solid var(--border);width:1%;white-space:nowrap;text-align:right;}
  tr.row:hover td.act{background:var(--surface2);}
  th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding:12px 8px 9px;border-bottom:1px solid var(--border);}
  th.mcol,td.mcol{text-align:center;width:120px;}
  td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;background:var(--surface);}
  tr:last-child td{border-bottom:none;}
  tr.row{cursor:grab;}
  tr.row.drag{opacity:.4;}
  tr.row.over td{border-top:2px solid var(--accent);}
  .handle{color:var(--hint);cursor:grab;user-select:none;padding-right:2px;}
  .rank{color:var(--hint);font-family:'IBM Plex Mono',monospace;font-size:11px;width:20px;}
  .key a{color:var(--accent-2);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
  .key a:hover{text-decoration:underline;}
  .nm{font-weight:600;font-size:13.5px;}
  .pri{color:var(--muted);font-size:11px;}
  .dri{color:var(--hint);font-size:11px;margin-top:3px;} .dri b{color:var(--muted);font-weight:600;}
  .epic a{color:var(--muted);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .epic a:hover{color:var(--accent-2);text-decoration:underline;}
  .noepic{color:var(--danger);font-size:10.5px;}
  /* unlink stays hidden until the row is hovered — it is one click from removing a link */
  .unlinkbtn{font-family:inherit;font-size:10px;line-height:1;color:var(--hint);background:none;
    border:1px solid transparent;border-radius:5px;padding:2px 4px;margin-left:5px;cursor:pointer;
    visibility:hidden;}
  tr.row:hover .unlinkbtn{visibility:visible;}
  .unlinkbtn:hover{color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg);}
  .linkbtn{font-family:inherit;font-size:11px;color:var(--accent-2);background:var(--accent-soft);
    border:1px solid var(--border);border-radius:7px;padding:3px 8px;cursor:pointer;}
  .linkbtn:hover{border-color:var(--accent);}
  .subbtn{font-family:inherit;font-size:12px;color:var(--accent-2);background:none;border:1px solid var(--border);
    border-radius:7px;padding:2px 7px;cursor:pointer;margin-left:6px;white-space:nowrap;}
  .subbtn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .subbtn:disabled{color:var(--hint);border-color:var(--border);background:none;cursor:default;}
  .subbtn:disabled:hover{border-color:var(--border);background:none;}
  .subbtn.pending{border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .subbtn.stale:disabled{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bg);}
  button.recalc:disabled{color:var(--hint);border-color:var(--border)!important;cursor:default;}
  button.recalc:disabled:hover{background:var(--surface);}
  .pendnote{color:var(--accent-2);font-weight:600;}
.estsp{width:52px;font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;
    border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-weight:600;}
  .over{color:var(--danger);font-size:10px;margin-top:2px;}
  /* gantt */
  .gtable{width:100%;border-collapse:collapse;}
  .gtable th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;text-align:center;}
  .gtable th.gname{text-align:left;width:38%;}
  .gtable td{padding:4px 8px;border-top:1px solid var(--border);vertical-align:middle;}
  .gtable td.gname{font-size:12.5px;font-weight:600;}
  .gtable td.gname .k{color:var(--accent-2);font-family:'IBM Plex Mono',monospace;font-size:11px;margin-right:6px;}
  .gcell{height:20px;border-radius:5px;background:var(--surface2);position:relative;}
  .gcell.fill{background:var(--accent);} .gcell.fill.hot{background:var(--danger);}
  .gcell .gsp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:10.5px;font-family:'IBM Plex Mono',monospace;}
  .gspill{color:var(--danger);font-size:11px;font-weight:600;}
  .mcell{display:inline-flex;align-items:center;gap:6px;}
  .mcell input[type=number]{width:52px;font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;
    border:1px solid var(--border);border-radius:7px;padding:4px 6px;}
  .mcell input[type=number]:disabled{background:var(--surface2);color:var(--hint);}
  /* ghost = the live Jira budget for a month you have not planned */
  .mcell input[type=number]::placeholder{color:var(--hint);opacity:1;font-style:italic;}
  .mcell input[type=number]:placeholder-shown{background:var(--surface2);}
  /* a month cell whose epic total differs from what Jira holds = not yet submitted */
  .mcell input[type=number].dirty{border-color:var(--accent);background:var(--accent-soft);
    color:var(--accent-2);font-weight:600;}
  .mcell .sync{width:9px;display:inline-block;text-align:center;font-size:10px;color:var(--hint);}
  .mcell .sync.dirty{color:var(--accent);}
  .state{padding:26px;text-align:center;color:var(--muted);}
  /* dependency group header */
  tr.grp td{background:var(--surface2);padding:9px 10px;border-bottom:1px solid var(--border);
    position:sticky;top:0;}
  tr.grp .gname{font-size:12.5px;font-weight:700;letter-spacing:.01em;}
  tr.grp .gmeta{color:var(--muted);font-size:11.5px;margin-left:10px;}
  /* optional columns */
  th.xcol,td.xcol{font-size:12px;color:var(--muted);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
  td.xcol .mono{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  td.xcol:has(.podwrap){white-space:normal;max-width:230px;}
  .podwrap{display:flex;flex-wrap:wrap;gap:3px;}
  .podchip{display:inline-block;font-size:10px;font-weight:600;line-height:1.5;
    color:var(--muted);background:var(--surface2);border-radius:5px;padding:1px 5px;white-space:nowrap;}
  .podchip.own{color:var(--accent-2);background:var(--accent-soft);}
  .podchip.more{color:var(--hint);background:none;border:1px dashed var(--border);}
  input.duedate{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text);
    border:1px solid var(--border);border-radius:7px;padding:3px 6px;background:var(--surface);}
  input.duedate:hover{border-color:var(--accent);}
  input.duedate.unset{color:var(--hint);border-style:dashed;}
  input.duedate.past{color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg);}
  input.duedate.late{color:var(--warn);border-color:var(--warn-bg);background:var(--warn-bg);}
  input.duedate.saving{opacity:.5;}
  /* inline editing */
  td.xcol.editable{cursor:pointer;}
  td.xcol.editable:hover{background:var(--accent-soft);box-shadow:inset 0 -1px 0 var(--accent);}
  td.xcol.saving{opacity:.45;pointer-events:none;}
  td.xcol{position:relative;}
  .inline{font-family:inherit;font-size:12px;color:var(--text);background:var(--surface);
    border:1px solid var(--accent);border-radius:7px;padding:3px 6px;width:100%;max-width:190px;}
  select.inline[multiple]{padding:2px;}
  .usermenu{position:absolute;z-index:30;left:6px;right:6px;background:var(--surface);
    border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);max-height:190px;
    overflow:auto;margin-top:2px;}
  .usermenu:empty{display:none;}
  .uopt{padding:5px 9px;font-size:12px;cursor:pointer;}
  .uopt:hover{background:var(--accent-soft);}
  .uopt small{display:block;color:var(--hint);font-size:10px;}
  .uopt.none{color:var(--hint);cursor:default;}
  .hint{color:var(--hint);}
  /* epic picker */
  .modal-back{position:fixed;inset:0;z-index:50;background:rgba(20,32,46,.34);
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 10px 40px rgba(20,32,46,.22);padding:18px 20px 14px;width:min(560px,100%);
    max-height:80vh;overflow:auto;}
  .modal h3{margin:0 0 2px;font-size:15px;font-weight:700;}
  .modal .msub{margin:0 0 12px;color:var(--muted);font-size:12.5px;}
  .modal .msub.none{color:var(--hint);}
  .plist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  button.pick{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:inherit;
    font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px;cursor:pointer;}
  button.pick:hover,button.pick:focus{border-color:var(--accent);background:var(--accent-soft);outline:none;}
  button.pick .pk{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent-2);font-weight:600;}
  button.pick .ps{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  button.pick .pbadge{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ok);
    background:var(--ok-bg);border-radius:6px;padding:2px 6px;font-weight:600;}
  button.pick .pst{font-size:10.5px;color:var(--hint);}
  button.pick.create{border-style:dashed;color:var(--accent-2);font-weight:600;}
  .mfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:11.5px;}
  .mfoot button{font-family:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);
    border-radius:9px;padding:6px 14px;cursor:pointer;color:var(--muted);}
  .mfoot button:hover{background:var(--surface2);}
  .mfoot .mgo{color:var(--accent-2);border-color:var(--accent);font-weight:600;}
  .mfoot .mgo:hover{background:var(--accent-soft);}
  /* toasts — replace the confirm/alert round-trips */
  .toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;font-size:12.5px;max-width:400px;
    display:flex;gap:12px;align-items:center;transition:opacity .18s;animation:tin .16s ease-out;}
  .toast.ok{border-left-color:var(--ok);} .toast.bad{border-left-color:var(--danger);} .toast.warn{border-left-color:var(--warn);}
  .toast span{flex:1;}
  .toast button{font-family:inherit;font-size:12px;font-weight:600;color:var(--accent-2);background:none;
    border:1px solid var(--border);border-radius:7px;padding:3px 9px;cursor:pointer;white-space:nowrap;}
  .toast button:hover{border-color:var(--accent);background:var(--accent-soft);}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  tr.archived .nm, tr.archived .key a{opacity:.55;}
  .archtag{font-size:10px;font-weight:600;color:var(--warn);background:var(--warn-bg);
           border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  tr.detail a{color:var(--accent-2);text-decoration:underline;}
  .stranded{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:8px;
            padding:7px 10px;margin:8px 4px 4px;}
  /* Revealed off-cycle rows. Interleaved in rank order they were indistinguishable from the
     cycle's own rows, so they are banded off below a heading and tinted for the whole run. */
  tr.offsep td{font-size:11px;font-weight:650;color:var(--warn);background:var(--warn-bg);
               padding:7px 12px;border-top:2px solid var(--warn);}
  tr.offsep .sub{font-weight:400;color:var(--hint);}
  tr.row.offcycle > td{background:var(--warn-bg);}
  tr.row.offcycle > td:first-child{box-shadow:inset 3px 0 0 var(--warn);}
  .offtag{font-size:10px;font-weight:600;color:var(--warn);background:var(--bg);
          border:1px solid var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px;
          vertical-align:middle;}
  .slink{font:inherit;color:var(--accent-2);background:none;border:0;padding:0 0 0 8px;
         cursor:pointer;text-decoration:underline;}
  /* Schedule lane: the SAME day columns as the per-person team grid above, so a bar sits
     directly under the days it consumes. Deliberately not a second calendar. */
  .schhead{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;cursor:pointer;}
  .schhead .t{font-size:12px;font-weight:650;}
  .schhead .n{font-size:11.5px;color:var(--hint);}
  .schwrap{overflow-x:auto;padding:0 0 10px;}
  table.sch{border-collapse:collapse;font-size:11px;}
  table.sch th,table.sch td{border:1px solid var(--border);}
  table.sch th.gd{padding:3px 4px;text-align:center;color:var(--muted);min-width:22px;}
  table.sch th.gd small{display:block;font-size:8px;}
  table.sch th.gd.we{background:var(--surface2);}
  table.sch th.gd.hol{background:var(--accent-soft);}
  table.sch th.mo{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:4px;}
  table.sch td.sname,table.sch th.sname{text-align:left;padding:4px 8px;white-space:nowrap;
    position:sticky;left:0;background:var(--surface);z-index:2;max-width:300px;}
  table.sch td.sname .s{display:block;max-width:270px;overflow:hidden;text-overflow:ellipsis;}

<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Monthly Planner</h1>
      <div class="sub" id="sub">Filter initiatives → assign months → set budgets → stack-rank. Saved locally ·
        <span class="pendnote">●</span> = differs from Jira, not yet submitted.
        <span id="dataage"></span></div>
    </div>
    <div class="filters">
      <div class="dd" id="ddPods"><button type="button">Pods</button><div class="menu"></div></div>
      <div class="dd" id="ddMonths"><button type="button">Months</button><div class="menu"></div></div>
      <div class="dd" id="ddCols"><button type="button">＋ Columns</button><div class="menu"></div></div>
      <button class="recalc" id="dri" title="Only initiatives where you are the Tech DRI">Tech DRI: anyone</button>
      <button class="recalc" id="toggleAll">Show all</button>
      <button class="recalc" id="toggleArch" title="Archived ideas are hidden by default; their budget never counts toward capacity">Archived: hidden</button>
      <button class="recalc" id="submit" disabled style="border-color:var(--accent);color:var(--accent-2)">⤴ Submit all</button>
      <button class="recalc" id="recalc">↻ Reload from Jira</button>
    </div>
  </div>

  <div class="strip" id="strip"></div>
  <div class="panel" id="handover"></div>
  <div class="panel" id="sched"></div>
  <div class="panel" id="board"><div class="state">Loading…</div></div>
</div>
<div class="toasts" id="toasts"></div>
<script src="/leave-editor.js"></script>
<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LSKEY = 'monthlyPlanner_v1';
const monthName = ym => MONTHS[parseInt(ym.split('-')[1],10)-1];
const monthLabel = ym => new Date(+ym.split('-')[0], +ym.split('-')[1]-1, 1).toLocaleString('en-US',{month:'short',year:'numeric'});
const cycleTag = ym => `${monthName(ym)}-${ym.split('-')[0].slice(2)}`;   // "2026-09" -> "Sep-26" (Planning Cycle option format)
const monthEnd = ym => { const [y,m]=ym.split('-').map(Number);           // "2026-10" -> "2026-10-31"
  return new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10); };

let PODS = [];          // available pod option strings
let INITS = null;       // {pods, initiatives:[...]}
let CAPS = {};          // ym -> month capacity model
let DETAILS = {};       // initiative key -> {descriptionText, impact}  (in-memory only)
const LOADING = new Set();  // initiative keys with a detail fetch in flight
let ME = {};            // signed-in Jira user (for the 'Tech DRI: me' filter)
let EDITABLE = {};      // planner column id -> {target, field}  (from /api/planner-fields)
const FMETA = new Map();// "ISSUE|col" -> /editmeta answer for that cell
let REVEAL = false;     // temporarily show off-cycle rows that still carry budget/plan
let DEPS = {};          // initiative key -> counterpart-pod rows (/api/dependencies)
let applyIdentity = () => {};   // set during init; see the /api/me fetch
let OVERFLOW = {};      // initiative key -> Est. SP that didn't fit the window (from Auto-plan)
let ST = load();        // persisted state

function load(){
  try{ return JSON.parse(localStorage.getItem(LSKEY)) || {}; }catch(e){ return {}; }
}
function save(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(ST)); }catch(e){}
  pushPlan();
}

// ---- the plan lives on the server, not in one browser ------------------------------
// It used to live only in localStorage, which meant the desktop app and Chrome were two
// different planners that happened to look alike: the same board, a different stack rank,
// and no way to tell which one was real. The server copy is the plan; a browser is a view
// of it. Every save keeps the version it replaced, so nothing is lost either way.
let PLAN_SYNC = false;        // true once this browser is allowed to write
let PLAN_T = null;
let PLAN_REV = 0;             // the revision this window last saw
let PLAN_SIG = '';            // what it last published, so a view toggle publishes nothing
// What travels: everything you typed or dragged. What does not: which panels are open,
// show-all, archived, Tech DRI - those say what you are looking at, not what the plan is.
const PLAN_LISTS = ['order', 'months', 'cols'];
const PLAN_MAPS = ['plan', 'est', 'heads', 'schStart'];
function planBody(){
  const b = {pods: ST.pods || null, savedBy: location.host};
  PLAN_LISTS.forEach(k => { b[k] = ST[k] || []; });
  PLAN_MAPS.forEach(k => { b[k] = ST[k] || {}; });
  return b;
}
function pushPlan(){
  if(!PLAN_SYNC) return;
  // Opening a panel calls save(). Publishing on that would send this window's whole plan
  // for a change that is not part of the plan at all - and if the window is behind, that
  // is how a stale copy overwrites a newer one. Only publish when the plan itself moved.
  const body = planBody();
  const sig = JSON.stringify(body);
  if(sig === PLAN_SIG) return;
  clearTimeout(PLAN_T);
  PLAN_T = setTimeout(function(){
    body.rev = PLAN_REV;
    fetch('/api/monthly-plan', {method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify(body)})
      .then(r=>r.json())
      .then(r=>{
        if(r && r.ok){ PLAN_REV = r.rev; PLAN_SIG = sig; return; }
        if(r && r.conflict){ onConflict(r); return; }
        console.warn('plan not saved:', r && r.__error__);
      })
      .catch(()=>{})
      // PLAN_T doubles as "a write is in flight", and refreshPlan stands off while it is.
      // Leaving it set after the write finished stopped this window ever catching up again.
      .finally(()=>{ PLAN_T = null; });
  }, 600);
}

// Two windows, both allowed to write. Whoever is behind is refused rather than applied,
// and the choice of what to do about it is the planner's - resolving it either way on
// their behalf is how a rank disappears without anyone seeing it happen.
function onConflict(r){
  if(document.getElementById('planClash')) return;
  const theirs = (r.plan && r.plan.order || []).length;
  const mine = (ST.order || []).length;
  const bar = document.createElement('div');
  bar.id = 'planClash';
  bar.className = 'seedbar';
  bar.innerHTML = `<span>Another window saved a different plan
    (<b>${theirs}</b> ranked) while this one was showing <b>${mine}</b>.
    Nothing was overwritten.</span>
    <button class="btn" id="clashTake" type="button">Load theirs</button>
    <button class="btn" id="clashMine" type="button">Keep mine</button>`;
  document.body.appendChild(bar);
  document.getElementById('clashTake').addEventListener('click', ()=>{
    bar.remove(); adopt(r.plan); PLAN_SIG = JSON.stringify(planBody()); rerender();
    toast('Loaded the newer plan · '+theirs+' ranked', 'ok');
  });
  document.getElementById('clashMine').addEventListener('click', ()=>{
    bar.remove();
    PLAN_REV = r.rev;          // write on top of theirs, deliberately; the old one is kept
    PLAN_SIG = '';
    pushPlan();
    toast('Kept this window\'s plan. The other one is in the version history.', 'warn');
  });
}

// A named surface for the plan, so two-window behaviour can be driven by a test instead
// of only by hand. Everything here is something the UI already does.
window.synapsePlan = {
  rev: () => PLAN_REV,
  order: () => (ST.order || []).slice(),
  setOrder: v => { ST.order = v; save(); },
  touchView: () => { ST.capOpen = Object.assign({}, ST.capOpen, {_t: Date.now()}); save(); },
  refresh: () => refreshPlan(),
  clash: () => document.getElementById('planClash'),
};

// Catch up when you come back to a window that has been sitting there. Most clashes are
// just a stale tab, and this removes them before anything is typed into it.
function refreshPlan(){
  if(!PLAN_SYNC || PLAN_T) return;
  fetch('/api/monthly-plan').then(r=>r.json()).then(d=>{
    if(!d || !d.has || !d.plan) return;
    if((+d.plan.rev || 0) === PLAN_REV) return;
    adopt(d.plan);
    PLAN_SIG = JSON.stringify(planBody());
    rerender();
    toast('Plan updated in another window · '+(d.plan.order||[]).length+' ranked', 'ok');
  }).catch(()=>{});
}

// Adopt what the server holds, or offer to seed it from here. Deliberately NOT automatic:
// whichever browser opened first would otherwise win, and the one with the wrong order is
// just as likely to be first.
async function syncPlan(){
  let d = null;
  try{ d = await (await fetch('/api/monthly-plan')).json(); }catch(e){ return; }
  if(d && d.has){
    adopt(d.plan || {});
    PLAN_SYNC = true;
    PLAN_SIG = JSON.stringify(planBody());
    try{ localStorage.setItem(LSKEY, JSON.stringify(ST)); }catch(e){}
    return;
  }
  if((ST.order||[]).length) offerSeed();
}

function adopt(p){
    // A record speaks only for the fields it was actually written with. A browser running
    // yesterday's page sends just the rank; letting that record also assert "no columns"
    // would blank a view that was fine - which is the bug this whole change is about.
    const has = new Set(p.fields || ['order', 'plan', 'pods', 'months']);
    if(has.has('order')) ST.order = p.order || [];
    if(has.has('plan')) ST.plan = p.plan || {};
    if(has.has('pods')) ST.pods = p.pods;
    if(has.has('months') && (p.months||[]).length) ST.months = p.months;
    if(has.has('cols')) ST.cols = p.cols || [];
    PLAN_MAPS.forEach(k => { if(k !== 'plan' && has.has(k)) ST[k] = p[k] || {}; });
  PLAN_REV = +p.rev || 0;
  try{ localStorage.setItem(LSKEY, JSON.stringify(ST)); }catch(e){}
}

function offerSeed(){
  if(document.getElementById('planSeed')) return;
  const bar = document.createElement('div');
  bar.id = 'planSeed';
  bar.className = 'seedbar';
  bar.innerHTML = `<span>Your plan is only in this browser.
    <b>${(ST.order||[]).length}</b> ranked initiatives.
    Save it to Synapse so every browser and the desktop app show the same one.</span>
    <button class="btn" id="planSeedGo" type="button">Save this plan</button>
    <button class="btn" id="planSeedNo" type="button">Not now</button>`;
  document.body.appendChild(bar);
  document.getElementById('planSeedGo').addEventListener('click', async ()=>{
    const body = planBody();
    body.rev = PLAN_REV;
    const r = await (await fetch('/api/monthly-plan', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)})).json();
    bar.remove();
    if(r && r.ok){ PLAN_SYNC = true; PLAN_REV = r.rev; PLAN_SIG = JSON.stringify(body);
                   toast('Plan saved to Synapse · '+r.order+' ranked', 'ok'); }
    else toast('Could not save the plan: '+((r&&r.__error__)||'unknown'), 'warn');
  });
  document.getElementById('planSeedNo').addEventListener('click', ()=>bar.remove());
}
function defaults(){
  const now = new Date();
  const cur = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const nxt = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const nxtYm = `${nxt.getFullYear()}-${String(nxt.getMonth()+1).padStart(2,'0')}`;
  ST.pods = ST.pods || null;                 // null = configured default pod
  ST.months = ST.months || [cur, nxtYm];     // 2-month planning window
  ST.order = ST.order || [];
  ST.plan = ST.plan || {};                   // key -> { MonthName: {on:bool, sp:number} }
  ST.showAll = ST.showAll || false;          // false = only initiatives in the selected cycle
  ST.capOpen = ST.capOpen || {};             // ym -> expanded per-person capacity
  ST.initOpen = ST.initOpen || {};           // initiative key -> expanded detail
  ST.est = ST.est || {};                     // initiative key -> total Est. SP estimate
  ST.cols = ST.cols || [];                   // optional column ids shown in the table
  ST.driMe = ST.driMe || false;              // only rows where I am Tech DRI
  ST.heads = ST.heads || {};                 // initiative key -> devs on it, for the schedule
  ST.schStart = ST.schStart || {};           // initiative key -> dragged start DATE (not index)
}
defaults();

// ---- toasts (no confirm()/alert() round-trips: one click writes, Undo is the safety net) ----
function toast(msg, kind='ok', action=null, ms=null){
  const host = document.getElementById('toasts');
  const el = document.createElement('div'); el.className = `toast ${kind}`;
  const s = document.createElement('span'); s.textContent = msg; el.appendChild(s);
  let timer;
  if(action){
    const b = document.createElement('button'); b.textContent = action.label;
    b.addEventListener('click', ()=>{ clearTimeout(timer); el.remove(); action.fn(); });
    el.appendChild(b);
  }
  host.appendChild(el);
  timer = setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 200); },
                     ms || (action ? 12000 : 4500));
}

// ---- optional columns (the ＋ Columns picker) ----
const esc = s => String(s==null?'':s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
// Pod labels are "PREFIX - Long Name". The prefix alone is NOT unique — BOARD covers both
// "Core Payments Platform" and "Core Ledger Platform", so 30 of ~100 initiatives would
// render as "BOARD, BOARD". Disambiguate only the prefixes that actually collide on this row.
function podShortLabels(pods){
  const parts = pods.map(p=>{ const i = p.indexOf(' - ');
    return i < 0 ? [p.trim(), ''] : [p.slice(0, i).trim(), p.slice(i + 3).trim()]; });
  const seen = {};
  parts.forEach(([pre])=>{ seen[pre] = (seen[pre] || 0) + 1; });
  return parts.map(([pre, rest], i)=>{
    if(seen[pre] < 2 || !rest) return pre;
    const words = rest.replace(/\b(platform|pod|team)\b/ig, '').trim().split(/\s+/).filter(Boolean);
    return words.length ? `${pre}·${words[words.length - 1]}` : `${pre}·${i + 1}`;
  });
}
// One initiative carries up to 31 pods, so cap what is drawn and keep the rest in the title.
const POD_CHIP_CAP = 6;
function podChips(pods, mine){
  pods = (pods || []).filter(Boolean);
  if(!pods.length) return '—';
  const own = new Set(mine || []);
  const labels = podShortLabels(pods);
  const shown = pods.slice(0, POD_CHIP_CAP).map((p, i)=>
    `<span class="podchip${own.has(p) ? ' own' : ''}" title="${esc(p)}">${esc(labels[i])}</span>`).join('');
  const extra = pods.length - POD_CHIP_CAP;
  return `<span class="podwrap" title="${esc(pods.join('\n'))}">${shown}` +
    (extra > 0 ? `<span class="podchip more">+${extra}</span>` : '') + '</span>';
}
const dash = v => (v===0 || v) && String(v).length ? esc(v) : '—';
// Only ever emit an href we know is a normal web link. A description link comes from Jira,
// so `javascript:` / `data:` must never reach an anchor even though esc() would keep the
// text itself inert.
function safeUrl(u){
  const t = String(u||'').trim();
  return /^https?:\/\//i.test(t) ? t : '';
}
// descriptionRich is [[{t,h},...],...] from capacity_engine._adf_rich(): blocks of spans,
// each span optionally carrying a link. Text is escaped; only the anchor is structural.
function richHtml(blocks, fallback){
  if(!Array.isArray(blocks) || !blocks.length)
    return `<p>${esc(fallback||'—')}</p>`;
  return blocks.map(b=>'<p>' + b.map(sp=>{
    const txt = esc(sp.t||'').replace(/\n/g, '<br>');
    const href = safeUrl(sp.h);
    if(!href) return txt;
    return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${txt || esc(href)}</a>`;
  }).join('') + '</p>').join('');
}
// Initiative delivery dates (JPD stores these as a date-range blob; the server hands back
// the start as YYYY-MM-DD). Shaded like the epic due date so slippage is visible at a glance.

  const cls = d < today ? 'past' : (last && d > last ? 'late' : '');
  const why = d < today ? 'in the past' : (last && d > last ? 'lands after the selected months' : '');
  return `<span class="mono ${cls}" title="${esc(why)}">${esc(d)}</span>`;
}
// Where each editable column's display value lives on a row, so an inline edit can be

function activeCols(){ return EXTRA_COLS.filter(c=>ST.cols.includes(c.id)); }

// ---- plan helpers ----
function cell(key, mn){
  ST.plan[key] = ST.plan[key] || {};
  return (ST.plan[key][mn] = ST.plan[key][mn] || {on:false, sp:0});
}
function seedPlan(){
  // for each initiative & each selected month, seed from the epic budget if untouched
  if(!INITS || !Array.isArray(INITS.initiatives)) return;
  const selMn = ST.months.map(monthName);
  INITS.initiatives.forEach(it=>{
    selMn.forEach(mn=>{
      const c = cell(it.key, mn);
      if(c.seeded) return;
      const b = it.budgets[mn] || 0;
      c.sp = c.sp || b; c.on = c.on || b>0; c.seeded = true;
    });
  });
  // Order is GLOBAL and sticky. Never prune keys that are merely outside the current pod /
  // month filter — dropping them used to wipe your stack-rank the moment you changed a filter
  // (and rebuild it from Jira's created-DESC order). orderedInits() already skips keys that
  // aren't in the current response, so carrying them costs nothing.
  const known = new Set(ST.order);
  INITS.initiatives.forEach(i=>{ if(!known.has(i.key)){ ST.order.push(i.key); known.add(i.key); } });
  save();
}
function orderedInits(){
  if(!INITS || !Array.isArray(INITS.initiatives)) return [];
  const byKey = Object.fromEntries(INITS.initiatives.map(i=>[i.key,i]));
  return ST.order.map(k=>byKey[k]).filter(Boolean);
}
// Planning Cycle alone decides what the month filter shows. This used to also keep any
// row you had planned locally, which meant an initiative retagged in Jira (Oct -> Dec) never
// left the Oct view, because the local draft plan lives in localStorage and nothing
// re-derives it. That read as a broken filter.
function inCycle(it){
  return ST.months.some(ym=>(it.cycles||[]).includes(cycleTag(ym)));
}
// Rows the strict filter drops that still carry something real for these months: an
// un-submitted local plan, or a budget already filed on their epic in Jira. Hiding a filed
// budget silently would lose capacity from the view, so they are surfaced as a count.
function strandedInits(){
  if(ST.showAll || !ST.months.length) return [];
  const mns = ST.months.map(monthName);
  return orderedInits().filter(it=> !inCycle(it) && !isArchived(it) && mns.some(mn=>
    ST.plan[it.key]?.[mn]?.on || (+((it.budgets||{})[mn]) || 0) > 0));
}
// Keys of the off-cycle rows the reveal is currently showing — empty unless REVEAL is on.
// renderBoard needs the same set visibleInits() sorted by, so it is computed once here.
function revealedKeys(){
  return REVEAL ? new Set(strandedInits().map(i=>i.key)) : null;
}
function visibleInits(){
  const all = orderedInits();
  const stranded = revealedKeys();
  const byCycle = ST.showAll ? all : all.filter(it=>inCycle(it) || (stranded && stranded.has(it.key)));
  const mine = ST.driMe && ME.name ? byCycle.filter(it=>it.engDri === ME.name) : byCycle;
  // Revealed rows go to the BOTTOM, as one contiguous run, so the separator row rendered
  // before the first of them bands off the whole group. In rank order they landed scattered
  // through the table and there was no way to tell which ones the button had just added.
  if(!stranded) return mine;
  return mine.filter(it=>!stranded.has(it.key)).concat(mine.filter(it=>stranded.has(it.key)));
}
// Archived ideas are shown for reference only. Their budget is excluded from every
// capacity total and from submit, so turning the toggle on never moves the planned number.
const isArchived = it => !!(it && it.archived);
function plannedFor(mn){
  let sum=0;
  orderedInits().forEach(it=>{
    // Archived, and off-cycle rows the month filter hides, must not contribute: an SP figure
    // you cannot see in the table is worse than a wrong one, because nothing explains it.
    if(isArchived(it)) return;
    if(!ST.showAll && ST.months.length && !inCycle(it)) return;
    const c=ST.plan[it.key]?.[mn]; if(c&&c.on) sum += (+c.sp||0); });
  return Math.round(sum*10)/10;
}

// ---- what is still un-submitted ----
// Mirrors capacity_engine.submit_budgets() exactly: for every epic that has at least one
// assigned month in the selection, compare the SUMMED plan against the epic's live Jira
// budget for EVERY selected month (an unchecked month writes 0, so it counts as a diff).
function epicJiraBudgets(){
  const cur = {};
  orderedInits().forEach(it=>{ if(it.epic && !(it.epic.key in cur)) cur[it.epic.key] = it.budgets || {}; });
  return cur;
}
function pendingDiffs(){
  const eb = gatherEpicBudgets(), cur = epicJiraBudgets(), selMn = ST.months.map(monthName);
  const out = {};
  Object.keys(eb).forEach(ek=>{
    const ds = [];
    selMn.forEach(mn=>{
      const to  = Math.round((+eb[ek][mn] || 0) * 10) / 10;
      const frm = Math.round((+((cur[ek] || {})[mn]) || 0) * 10) / 10;
      if(to !== frm) ds.push({month:mn, from:frm, to});
    });
    if(ds.length) out[ek] = ds;
  });
  return out;
}
const diffText = ds => ds.map(d=>`${d.month} ${d.from} → ${d.to}`).join(', ');

// Re-paint the "needs submitting" affordances WITHOUT re-rendering (keeps input focus).
function refreshPending(){
  if(!INITS || !Array.isArray(INITS.initiatives)) return;
  const pend = pendingDiffs(), planned = new Set(Object.keys(gatherEpicBudgets()));
  const cur = epicJiraBudgets(), selMn = ST.months.map(monthName);
  // epic carries a budget in Jira but has no month assigned here: Submit skips it entirely
  // (submit_budgets only writes epics you assigned), so the Jira value is left stale.
  const stale = ek => !planned.has(ek) && selMn.some(mn => (+((cur[ek]||{})[mn]) || 0) > 0);
  const epicOf = {};
  orderedInits().forEach(it=>{ if(it.epic) epicOf[it.key] = it.epic.key; });

  board.querySelectorAll('.mcell').forEach(cell=>{
    const inp = cell.querySelector('input[type=number]'); if(!inp) return;
    const ek = epicOf[inp.dataset.k];
    const hit = !!(ek && (pend[ek]||[]).some(d=>d.month===inp.dataset.m));
    inp.classList.toggle('dirty', hit);
    const dot = cell.querySelector('.sync');
    if(dot){ dot.classList.toggle('dirty', hit); dot.textContent = hit ? '●' : '';
      dot.title = hit ? 'not yet submitted to Jira' : ''; }
  });

  board.querySelectorAll('.subbtn').forEach(b=>{
    const ek = epicOf[b.dataset.k], ds = ek ? pend[ek] : null;
    b.classList.toggle('pending', !!(ds && ds.length));
    b.classList.toggle('stale', !!(ek && !(ds && ds.length) && stale(ek)));
    if(ds && ds.length){
      b.disabled = false; b.textContent = `⤴ Submit (${ds.length})`;
      b.title = `Write to ${ek} — ${diffText(ds)}`;
    }else if(ek && planned.has(ek)){
      b.disabled = true;  b.textContent = '✓ in Jira';
      b.title = `${ek} already matches the plan for the selected month(s)`;
    }else if(ek && stale(ek)){
      b.disabled = true;  b.textContent = '⚠ stale in Jira';
      b.title = `${ek} still holds ${selMn.map(mn=>`${mn} ${(+((cur[ek]||{})[mn])||0)}`).join(', ')} in Jira, `
              + 'but no month is planned here. Submit does not clear it — type 0 into the month to zero it out.';
    }else{
      b.disabled = true;  b.textContent = '— not planned';
      b.title = 'No month assigned in the selected window — nothing to submit';
    }
  });

  const n = Object.values(pend).reduce((a,ds)=>a+ds.length, 0);
  const epics = Object.keys(pend).length;
  const btn = document.getElementById('submit');
  btn.disabled = n === 0;
  btn.textContent = n ? `⤴ Submit all (${n})` : '✓ All submitted';
  btn.title = n ? Object.entries(pend).map(([k,ds])=>`${k}: ${diffText(ds)}`).join('\n')
                : 'Every planned epic already matches Jira for the selected month(s)';
  const note = document.getElementById('pendnote');
  if(note) note.innerHTML = n
    ? ` · <span class="pendnote">${n} change(s) across ${epics} epic(s) not yet in Jira</span>`
    : ' · all budgets match Jira';
}

// ---- render ----
function fitClass(pct){ return pct>=100?'hot':pct>=90?'warm':'cool'; }

function deductNote(p){
  const bits = [];
  if (p.leave)  bits.push(`−${p.leave} leave`);
  if (p.oncall) bits.push(`−${p.oncall} on-call`);
  return bits.length ? `<div class="deduct">${bits.join(' · ')}</div>` : '';
}
function capHTML(m){
  // month-level capacity detail (collapsible) — sprint-style: cards + per-person daily grid
  const cards = `<div class="capcards">
    <div class="c"><div class="l">Working days</div><div class="v">${m.workingDays}</div></div>
    <div class="c"><div class="l">Team net days</div><div class="v">${m.teamNetDays}</div></div>
    <div class="c"><div class="l">Effective SP</div><div class="v">${m.teamSP}</div></div>
    <div class="c"><div class="l">Utilisation</div><div class="v">${m.utilisation||0}<small style="font-size:12px;color:var(--muted)">%</small></div></div>
  </div>`;
  const days = m.days || [];
  const clsOf = s => s==='WE'?'c-we':s==='L'?'c-l':s==='O'?'c-o':s==='W'?'c-w':s==='H'?'c-h':'c-av';
  const head = days.map(d=>`<th class="gd ${d.weekend?'we':''} ${d.holiday?'hol':''}" title="${esc(d.holiday?(d.holiday.occasion||'holiday'):'')}">${esc(d.date.slice(8))}<small>${esc(d.dow[0])}</small></th>`).join('');
  const rows = m.people.map(p=>{
    const cells = (p.statuses||[]).map((s,i)=>{
      const d = days[i] || {};
      const mk = (p.manual||[])[i] || '';
      // Weekends and public holidays are not anyone's leave to mark; LeaveEditor returns

      return `<td class="dc ${clsOf(s)} ${LeaveEditor.cls(s, mk)}"${
        LeaveEditor.attrs(p.canonical, d.date, s, mk, p.name)

    return `<tr><td class="gname"><span class="nm" title="efficiency ${esc(p.eff)}">${esc(p.name)}</span> <span class="role">${esc(p.role)}</span>${deductNote(p)}</td>${cells}<td class="num"><span class="net">${p.net}d</span></td><td class="num"><span class="sp">${p.sp}</span></td></tr>`;
  }).join('');
  return `<div class="cappanel">
    <div class="ph">${m.label} — team capacity</div>
    ${cards}
    <div class="gridwrap"><table class="daygrid"><thead><tr><th class="gname">Person</th>${head}<th class="num">Net</th><th class="num">SP</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="glegend"><span><span class="lg c-av"></span>available</span><span><span class="lg c-w"></span>WFH</span><span><span class="lg c-o"></span>on-call</span><span><span class="lg c-l"></span>leave</span><span><span class="lg c-h"></span>holiday</span><span><span class="lg c-we"></span>weekend</span>
      <span style="color:var(--hint)">· click any weekday to mark leave the team never posted
      (underlined = entered here, not reported)</span></div>
  </div>`;
}

const winLabel = m => {
  if(!m || !m.start || !m.end) return '';   // a payload without dates has no window to show
  const d = iso => { const [y,mo,da] = String(iso).split('-').map(Number);
    return `${da} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo-1]}`; };
  return `${d(m.start)} \u2192 ${d(m.end)}`;
};
function winEditor(ym, m){
  const w = (ST.win||{})[ym] || {};
  return `<div class="wined" data-ym="${esc(ym)}">
    <label>from <input type="date" class="wfrom" value="${esc(w.start || m.start)}"></label>
