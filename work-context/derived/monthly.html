// Marking leave lives in /leave-editor.js, shared with the sprint board and the sprint
// planner, so the gesture and its meaning are the same wherever a capacity calendar is
// drawn. This page is where it started, which is why its behaviour is the behaviour.
function wireLeaveCells(){
  LeaveEditor.wire(strip, {
    by: ME.name || 'em',
    toast: (msg, kind, undo)=> toast(msg, kind, undo),
    // Capacity is cached per window, so the numbers only move once it is rebuilt.
    onChange: async ()=>{ CAPS = {}; await loadCaps(); },
  });
}

function renderStrip(){
  const cards = ST.months.map(ym=>{
    const m = CAPS[ym]; const cap = m ? m.teamSP : null;
    const planned = plannedFor(monthName(ym));
    const pct = cap ? Math.round(planned/cap*100) : 0;
    const cls = fitClass(pct);
    const diff = cap!=null ? Math.round((cap-planned)*10)/10 : null;
    const verdict = cap==null ? 'capacity loading…' : (diff<0 ? `over by ${Math.abs(diff)} SP` : `${diff} SP headroom`);
    return `<div class="mcap" data-ym="${ym}">
      <span class="caret">${ST.capOpen[ym]?'▾ hide team':'▸ team'}</span>
      <div class="mn"><span class="cyc">${esc(m && m.cycle ? m.cycle : monthLabel(ym))}</span>${
        (m && m.start && m.end) ? `<button type="button" class="win ${m.customWindow?'custom':''}" data-win="${esc(ym)}"
             title="Set this cycle's start and end dates. Default is the whole calendar month."
             >📅 ${esc(winLabel(m))} <span class="wedit">${m.customWindow?'edited':'edit dates'}</span></button>` : ''}</div>
      ${ST.winOpen===ym && m ? winEditor(ym, m) : ''}
      <div class="nums">
        <span class="planned"><span class="lbl">Planned</span><b>${planned}</b></span>
        <span><span class="lbl">Capacity</span><b>${cap==null?'…':cap}</b></span>
      </div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100,pct)}%"></i></div>
      <div class="verdict ${cls}">${cap==null?verdict:`${pct}% · ${verdict}`}</div>
    </div>`;
  }).join('');
  const panels = ST.months.filter(ym=>ST.capOpen[ym] && CAPS[ym]).map(ym=>capHTML(CAPS[ym])).join('');
  strip.innerHTML = `<div class="cards-strip">${cards}</div>${panels}`;
  wireLeaveCells();
  strip.querySelectorAll('.mcap').forEach(c=>c.addEventListener('click', e=>{
    if(e.target.closest('.wined') || e.target.closest('.win')) return;   // editor owns its clicks
    const ym=c.dataset.ym; ST.capOpen[ym]=!ST.capOpen[ym]; save(); renderStrip();
  }));
  strip.querySelectorAll('.win').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const ym = el.dataset.win;
    ST.winOpen = ST.winOpen === ym ? null : ym; save(); renderStrip();
  }));
  strip.querySelectorAll('.wined').forEach(box=>{
    box.addEventListener('click', e=>e.stopPropagation());
    const ym = box.dataset.ym;
    const apply = (start, end)=>{
      ST.win = ST.win || {};
      if(start && end) ST.win[ym] = {start, end}; else delete ST.win[ym];
      ST.winOpen = null; save();
      delete CAPS[ym];                       // the window changed, so the capacity must too
      renderStrip(); loadCaps();
    };
    box.querySelector('.wapply').addEventListener('click', ()=>{
      const a = box.querySelector('.wfrom').value, b = box.querySelector('.wto').value;
      if(!a || !b){ toast('Pick both a start and an end date.', 'warn'); return; }
      if(b < a){ toast('End date is before the start date.', 'bad'); return; }
      apply(a, b);
    });
    box.querySelector('.wreset').addEventListener('click', ()=>apply(null, null));
  });
}

/* ---------------- schedule lane -------------------------------------------------
   Bars over the SAME calendar the team grid above already draws. A bar's length is
   its budgeted SP divided by (people x team SP per person-day), laid across real
   working days, so weekends and public holidays push the end date out.
   `rate` is SP per day actually worked (teamSP / teamNetDays), which already has
   leave averaged out; `avail` then models how likely a given day is worked at all. */
function schDays(){
  const out = [];
  ST.months.forEach(ym=>{
    const c = CAPS[ym];
    if(!c || !Array.isArray(c.days)) return;
    const team = (c.people||[]).length || 1;
    const rate = c.teamNetDays ? c.teamSP / c.teamNetDays : 0;
    c.days.forEach((d,i)=>{
      const present = (c.people||[]).filter(p=>{
        const st = (p.statuses||[])[i]; return st === '' || st === 'W'; }).length;
      const mand = d.holiday && d.holiday.type === 'holiday';
      out.push({ ym, date:d.date, dow:d.dow, weekend:!!d.weekend, holiday: mand?d.holiday:null,
                 working: !d.weekend && !mand, rate, avail: team?present/team:1 });
    });
  });
  out.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
const headsFor = k => Math.max(1, Math.min(9, +(ST.heads||{})[k] || 1));
function schLayout(sp, heads, days, from){
  let left = sp, start = -1, end = -1;
  for(let i=Math.max(0,from); i<days.length; i++){
    const d = days[i];
    if(!d.working) continue;
    const per = d.rate * heads * d.avail;
    if(per <= 0) continue;
    if(start < 0) start = i;
    left -= per; end = i;
    if(left <= 0.0001) break;
  }
  return {start, end, over: Math.max(0, Math.round(left*10)/10)};
}
// Where a bar begins when you have not moved it: the first day of the earliest selected
// month it carries a budget in.
function schAuto(per, days){
  const firstOf = {};
  days.forEach((d,i)=>{ if(firstOf[d.ym]===undefined) firstOf[d.ym]=i; });
  const earliest = Object.keys(per).sort()[0];
  return firstOf[earliest] ?? 0;
}
// A start day you dragged, as an index into `days`. Stored as a DATE, not an index, so it
// survives a change of months or cycle window: the same calendar day keeps its meaning
// where an index would silently point at a different date. Out of the current window it is
// kept but ignored, because the window may well come back.
function schPinned(key, days){
  const iso = (ST.schStart||{})[key];
  if(!iso) return -1;
  const i = days.findIndex(d=>d.date >= iso);
  return i;
}
function schRow(it, days, mns){
  if(isArchived(it)) return null;
  const per = {};
  mns.forEach((mn,i)=>{ const c = ST.plan[it.key]?.[mn];
    const v = c && c.on ? (+c.sp||0) : 0; if(v>0) per[ST.months[i]] = v; });
  const sp = Object.values(per).reduce((a,b)=>a+b,0);
  if(sp <= 0) return null;
  const auto = schAuto(per, days);
  const pinIso = (ST.schStart||{})[it.key] || '';
  const pin = schPinned(it.key, days);
  const lay = schLayout(sp, headsFor(it.key), days, pin >= 0 ? pin : auto);
  const endDate = lay.end >= 0 ? days[lay.end].date : '';
  const due = (it.epic && it.epic.dueDate) || '';
  // pinLost: a start day you dragged that now falls outside the window (you changed months,
  // or edited the cycle dates). The bar quietly reverts to auto, so the ⟲ has to stay
  // visible or the stored date would be unreachable and unexplained.
  return {it, sp, ...lay, auto, pinIso, pinned: pin >= 0 && !!pinIso,
          pinLost: !!pinIso && pin < 0, endDate, due,
          late: !!(due && endDate && endDate > due)};
}
function schRows(days){
  const mns = ST.months.map(monthName);
  return visibleInits().map(it=>schRow(it, days, mns))
    .filter(Boolean).sort((a,b)=>(a.start-b.start)||(b.sp-a.sp));
}

/* ---------------- handover readiness -------------------------------------------
   Source of truth is the program team's own readiness CLI, via /api/handover. This page
   deliberately does NOT recompute the score: the CLI counts rows a PODs JQL cannot see
   (the Horizontals field, and epics linked to initiatives that never declared your POD),
   and a local reimplementation read 6.5 where the real figure was 6.77.

   Rules: ~/engg-cycle-planning/handover-score-rules.md                                  */
const jiraBase = () => {
  const u = ((INITS||{}).initiatives||[]).map(i=>i.url).find(Boolean) || '';
  const m = u.match(/^https?:\/\/[^/]+/);
  return m ? m[0] : '';
};
const jiraUrl = key => { const b = jiraBase(); return b ? `${b}/browse/${key}` : ''; };

let HO = null;              // {readiness, acceptance, history}
let HOSTATE = 'idle';       // idle | loading | ready | failed
let HOLIST = null;          // which gap list is expanded, e.g. "missingEpic:Oct-26"

async function loadHandover(fresh){
  if(HOSTATE === 'loading') return;
  HOSTATE = 'loading'; renderHandover();
  try{
    const d = await (await fetch('/api/handover' + (fresh ? '?fresh=1' : ''))).json();
    if(!d || d.error) throw new Error((d && d.error) || 'no payload');
    HO = d;
    HOSTATE = (d.readiness && d.readiness.__error__) ? 'failed' : 'ready';
    if(HOSTATE === 'failed') toast('Handover score unavailable: ' + d.readiness.__error__, 'warn');
  }catch(e){ HOSTATE = 'failed'; toast('Could not load the handover score: ' + e.message, 'warn'); }
  renderHandover();
}

const hoRows = () => ((HO && HO.readiness && HO.readiness.rows) || []);
// your POD's rows only: other teams' rows never move your score
const hoMine = () => hoRows().filter(r => r.mine);
const hoProj = () => ((HO && HO.readiness && HO.readiness.rollup
                      && HO.readiness.rollup.per_project) || []);

// A row scoring 10 that is not really green: budget present but zero, or epic with no due
// date (the SOP's dependency-acceptance signal, which the score does not look at).
const hoZero   = r => r.score === 10 && !(+r.budget > 0);
const hoNoDue  = r => r.score === 10 && !r.epic_due;

function hoTrend(project, month){
  const h = ((HO && HO.history) || [])
    .filter(x => x.project === project && x.month === month)
    .sort((a,b) => (a.date < b.date ? -1 : 1));
  if(h.length < 2) return null;
  const now = h[h.length-1], prev = h[h.length-2];
  return {from: prev, to: now,
          dAvg: Math.round(((now.avg||0) - (prev.avg||0)) * 100) / 100,
          dRows: (now.rows||0) - (prev.rows||0)};
}

function renderHandover(){
  const host = document.getElementById('handover');
  if(!host) return;
  if(HOSTATE === 'idle'){ host.innerHTML = ''; host.style.display = 'none'; return; }
  host.style.display = '';
  if(HOSTATE === 'loading'){
    host.innerHTML = `<div class="hhdr"><span class="t">Handover readiness</span>
      <span class="n">running the readiness check…</span></div>`; return;
  }
  if(HOSTATE === 'failed'){
    host.innerHTML = `<div class="hhdr"><span class="t">Handover readiness</span>
      <span class="n">unavailable — ${esc(((HO||{}).readiness||{}).__error__ || 'check the CLI config')}</span>
      <button class="hclear" id="horetry">retry</button></div>`;
    const b = document.getElementById('horetry');
    if(b) b.addEventListener('click', ()=>loadHandover(true));
    return;
  }

  const chip = (n, label, kind, id) => n
    ? `<button class="hchip ${kind}${HOLIST === id ? ' on' : ''}" data-l="${esc(id)}"
        title="click to list these rows">${n} ${esc(label)}</button>` : '';

  // ---- per cycle month: the headline, its bar, and what makes it up ----
  const cards = hoProj().map(p => {
    const rows = hoMine().filter(r => r.month === p.month);
    const zero = rows.filter(hoZero).length, nodue = rows.filter(hoNoDue).length;
    // the CLI reports only the bar from the checkpoint in force, which can be silent about
    // a cycle whose bar still applies, so fall back to the planner's per-cycle resolution
    const pc = (((INITS||{}).bars||{}).perCycle||{})[p.month] || null;
    const bar = p.bar != null ? p.bar : (pc ? pc.bar : null);
    const over = bar != null && p.avg >= bar;
    const allGreen = !!(pc && pc.allGreen);
    const when = pc ? ` (${pc.passed ? 'was due' : 'due'} ${pc.date})` : '';
    const verdict = bar == null ? 'no bar set'
      : over ? (allGreen && p.pct_green < 100
          ? `above ${bar}, but that checkpoint wants every row green${when}`
          : `above the bar of ${bar}${when}`)
        : `below the bar of ${bar}${when}`;
    const cls = bar == null ? '' : over ? (allGreen && p.pct_green < 100 ? 'warn' : 'good') : 'bad';
    const t = hoTrend(p.project, p.month);
    const trend = t
      ? `<div class="htrend">since ${esc(t.from.date)}: ${t.dAvg >= 0 ? '+' : ''}${t.dAvg} avg
         · ${t.dRows >= 0 ? '+' : ''}${t.dRows} rows
         <span class="hwhy">${t.dRows !== 0 ? 'the denominator moved, so compare the counts' : ''}</span></div>`
      : `<div class="htrend">first snapshot today — a trend needs a second day</div>`;
    return `<div class="hcard">
      <div class="hhead">${esc(p.project)} · ${esc(p.month)}<span class="hrows">${p.rows} rows</span></div>
      <div class="hscore ${cls}">${p.avg}<small>/10</small></div>
      <div class="hbar"><i class="${cls}" style="width:${Math.min(100,(p.avg||0)*10)}%"></i></div>
      <div class="hverdict ${cls}">${p.pct_green}% green · ${esc(verdict)}</div>
      <div class="hcounts">${rows.filter(r=>r.status==='OK').length} OK
        · ${p.missing_budget} missing budget · ${p.missing_epic} missing epic</div>
      <div class="hchips">
        ${chip(p.missing_epic, 'no epic', 'bad', `missingEpic:${p.month}`)}
        ${chip(p.missing_budget, 'no budget', 'warn', `missingBudget:${p.month}`)}
        ${chip(zero, 'budgeted 0', 'warn', `zero:${p.month}`)}
        ${chip(nodue, 'no due date', 'warn', `nodue:${p.month}`)}
      </div>${trend}</div>`;
  }).join('');

  // ---- EM acceptance: gated on the INITIATIVE's target dates, not the epic ----
  const a = (HO && HO.acceptance) || {};
  const acc = a.__error__ ? `<div class="hcard"><div class="hhead">EM acceptance</div>
      <div class="hverdict bad">unavailable</div></div>`
    : `<div class="hcard">
        <div class="hhead">EM acceptance<span class="hrows">${a.total} initiatives</span></div>
        <div class="hscore ${a.missingEither ? (a.accepted ? 'warn' : 'bad') : 'good'}">${a.accepted}<small>/${a.total}</small></div>
        <div class="hbar"><i class="${a.missingEither ? (a.accepted ? 'warn' : 'bad') : 'good'}"
          style="width:${a.total ? Math.round(100*a.accepted/a.total) : 0}%"></i></div>
        <div class="hverdict ${a.missingEither ? 'warn' : 'good'}">${a.missingEither} missing a target date</div>
        <div class="hcounts">you are Tech DRI · separate from the handover score</div>
        <div class="hchips">
          ${chip(a.missingGoLive, 'no go-live', 'warn', 'accGoLive:')}
          ${chip(a.missingHandover, 'no handover', 'warn', 'accHandover:')}
        </div></div>`;

  // ---- Tech DRI exposure: other teams' rows on your initiatives ----
  const ex = {};
  hoRows().filter(r => !r.mine).forEach(r => {
    (ex[r.team] = ex[r.team] || []).push(r);
  });
  const exTeams = Object.entries(ex)
    .map(([team, rs]) => ({team, rows: rs.length,
      avg: Math.round(rs.reduce((t,x)=>t+x.score,0) / rs.length * 100) / 100,
      bad: rs.filter(x=>x.score < 10).length}))
    .sort((a,b) => a.avg - b.avg);
  const exposure = exTeams.length ? `<div class="hexp">
      <div class="hexph">Tech DRI exposure
        <span class="n">${hoRows().filter(r=>!r.mine).length} rows across ${exTeams.length} teams ·
        not in your score, but you are the resolution owner</span></div>
      <div class="hteams">${exTeams.map(t=>`
        <button class="hteam${HOLIST === 'team:'+t.team ? ' on' : ''}" data-l="team:${esc(t.team)}">
          <b>${esc(t.team)}</b> <span class="${t.avg < 5 ? 'bad' : t.avg < 8 ? 'warn' : 'good'}">${t.avg}</span>
          <small>${t.bad}/${t.rows} to fix</small></button>`).join('')}</div></div>` : '';

  host.innerHTML = `<div class="hhdr">
      <span class="t">Handover readiness</span>
      <span class="n">${esc(((HO||{}).readiness||{}).cycle_id || '')} · from the program team's
        readiness check${((HO||{}).readiness||{}).fetched
          ? ` · ${esc(String(HO.readiness.fetched).replace('T',' ').slice(0,16))}` : ''}</span>
      <button class="hclear" id="horeload">↻ recheck</button>
    </div>
    <div class="hcards">${cards}${acc}</div>
    ${exposure}
    <div id="holist"></div>
    <div class="hnote">A budget of 0 scores 10 — presence is checked, not value. A due date
      is not scored at all, but the SOP treats it as the dependency acceptance signal, so a
      row can score 10 and still be unaccepted. The denominator moves as initiatives join and
      leave the cycle, so read the counts, not just the average.</div>`;

  renderHoList();
  const rl = document.getElementById('horeload');
  if(rl) rl.addEventListener('click', ()=>loadHandover(true));
  host.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click', ()=>{
    HOLIST = HOLIST === b.dataset.l ? null : b.dataset.l;
    renderHandover();
  }));
}

function renderHoList(){
  const host = document.getElementById('holist');
  if(!host || !HOLIST) return;
  const [kind, arg] = HOLIST.split(':');
  let rows = [], title = '', note = '';

  if(kind === 'team'){
    rows = hoRows().filter(r => r.team === arg && r.score < 10).sort((a,b)=>a.score-b.score);
    title = `${arg} · rows to fix on your initiatives`;
    note = 'These do not count in your score. You are the resolution owner.';
  } else if(kind === 'accGoLive' || kind === 'accHandover'){
    const want = kind === 'accGoLive' ? 'Target Go-Live' : 'Target Handover';
    const a = (HO && HO.acceptance) || {};
    const list = (a.rows || []).filter(r => (r.missing || []).includes(want));
    host.innerHTML = `<div class="holist"><div class="holh">${esc(want)} not set
        <span class="n">${list.length} initiative${list.length===1?'':'s'} · EM acceptance, not the handover score</span></div>
      ${list.map(r=>`<div class="hor">
        <a class="k" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.key)}</a>
        <span class="s">${esc(r.summary)}</span>
        <span class="m">${esc((r.months||[]).join(', '))}</span>
        <span class="g">${esc(r.missing.join(' + '))} missing</span></div>`).join('')}</div>`;
    return;
  } else {
    const month = arg;
    const base = hoMine().filter(r => r.month === month);
    if(kind === 'missingEpic'){ rows = base.filter(r=>r.status === 'Missing epic');
      title = `No delivery epic · ${month}`; note = 'Scores 1 until one is created and linked.'; }
    if(kind === 'missingBudget'){ rows = base.filter(r=>r.status === 'Missing budget');
      title = `Epic but no budget · ${month}`; note = 'Scores 3. Filling the budget is +7 per row, the cheapest move.'; }
    if(kind === 'zero'){ rows = base.filter(hoZero);
      title = `Budgeted 0 · ${month}`; note = 'Scores 10 because presence is checked, not value. Nothing is committed.'; }
    if(kind === 'nodue'){ rows = base.filter(hoNoDue);
      title = `No due date · ${month}`; note = 'Scores 10. The SOP treats a missing target date as an unaccepted dependency.'; }
    rows.sort((a,b)=> a.score - b.score || a.initiative.localeCompare(b.initiative));
  }

  host.innerHTML = `<div class="holist"><div class="holh">${esc(title)}
      <span class="n">${rows.length} row${rows.length===1?'':'s'} · ${esc(note)}</span></div>
    ${rows.map(r=>`<div class="hor">
      <span class="sc s${r.score}">${r.score}</span>
      <a class="k" href="${esc(jiraUrl(r.initiative))}" target="_blank" rel="noopener">${esc(r.initiative)}</a>
      <span class="s">${esc(r.initiative_summary || '')}</span>
      <span class="m">${esc(r.team)} · ${esc(r.month)}</span>
      <span class="g">${esc((r.epics||[]).join(', ') || r.status)}${
        r.note ? ` · ${esc(r.note)}` : ''}</span></div>`).join('')}</div>`;
}

function renderSchedule(){
  const host = document.getElementById('sched');
  if(!host) return;
  if(!INITS || !ST.months.length){ host.innerHTML=''; host.style.display='none'; return; }
  host.style.display='';
  const days = schDays();
  if(!days.length){
    host.innerHTML = `<div class="schhead" id="schToggle"><span>\u25b8</span>
      <span class="t">Schedule</span><span class="n">loading the team calendar\u2026</span></div>`;
    return;
  }
  const rs = schRows(days);
  const open = !!ST.schOpen;
  const late = rs.filter(r=>r.late).length, over = rs.filter(r=>r.over>0).length;
  const note = !rs.length ? 'nothing planned in these months'
    : `${rs.length} planned · ${late} past the epic due date · ${over} spill past the window`;
  let head = `<div class="schhead" id="schToggle"><span>${open?'▾':'▸'}</span>
    <span class="t">Schedule</span><span class="n">${esc(note)}</span></div>`;
  if(!open || !rs.length){ host.innerHTML = head; wireSched(); return; }

  let band = '';
  ST.months.forEach(ym=>{ const n = days.filter(d=>d.ym===ym).length;
    const c = CAPS[ym];
    if(n) band += `<th class="mo" colspan="${n}">${esc(c && c.cycle ? c.cycle : monthLabel(ym))}</th>`; });
  const dh = days.map(d=>`<th class="gd ${d.weekend?'we':''} ${d.holiday?'hol':''}"
      title="${esc(d.date)}${d.holiday?' · '+esc(d.holiday.occasion||'holiday'):''}">${esc(d.date.slice(8))}<small>${esc(d.dow[0])}</small></th>`).join('');
  const body = rs.map(r=>`<tr data-k="${esc(r.it.key)}">${schNameCell(r)}${schCells(r, days)}</tr>`).join('');

  host.innerHTML = head + `<div class="schwrap"><table class="sch" id="schtab">
    <thead><tr><th class="sname" rowspan="2">Initiative</th>${band}</tr><tr>${dh}</tr></thead>
    <tbody>${body}</tbody></table></div>
    <div class="note" style="color:var(--hint);font-size:11.5px;margin:0 14px 10px">
      Bar length = planned SP ÷ (devs × team SP per working day), over real working days.
      Drag a bar sideways to move its start day; ⟲ puts it back. Leave is a team-wide
      average, so an individual's leave does not yet shorten their own bar.</div>`;
  wireSched(days);
}
// The two halves of a schedule row, kept separate so a drag can repaint one row in place
// instead of re-rendering (and re-sorting) the whole table under the cursor.
function schCells(r, days){
  const k = r.it.key;
  return days.map((d,i)=>{
    let inner = '';
    if(r.start>=0 && i>=r.start && i<=r.end && d.working){
      const e = (i===r.start&&i===r.end)?'one':i===r.start?'s':i===r.end?'e':'';
      inner += `<div class="sbar ${e} ${r.late?'late':''}"
                 title="${esc(k)} · ${esc(String(r.sp))} SP · ${headsFor(k)} dev · ${
                   esc(days[r.start].date)} → ${esc(r.endDate)}&#10;drag sideways to move the start day"></div>`;
    }
    if(r.due && d.date===r.due) inner += `<div class="sdue" title="epic due ${esc(r.due)}"></div>`;
    return `<td class="sc ${d.weekend?'we':''} ${d.holiday?'hol':''}" data-i="${i}">${inner}</td>`;
  }).join('');
}
function schNameCell(r){
  const k = r.it.key;
  const flag = r.late ? `<span class="sflag" title="ends ${esc(r.endDate)}, due ${esc(r.due)}">past due</span>`
             : r.over>0 ? `<span class="sflag">${esc(String(r.over))} SP spills</span>` : '';
  const pin = r.pinned
    ? `<button class="spin" data-k="${esc(k)}" title="Start day moved to ${esc(r.pinIso)} — click to put it back where the budget says">⟲</button>`
    : r.pinLost
    ? `<button class="spin" data-k="${esc(k)}" title="Start day was moved to ${esc(r.pinIso)}, which is outside the months you are viewing — the bar is back on its default. Click to drop the moved date.">⟲ ${esc(r.pinIso)}</button>`
    : '';
  return `<td class="sname"><span class="s"><b>${esc(k)}</b> ${esc(r.it.summary)}</span>
    <span class="heads"><button data-k="${esc(k)}" data-s="-1">−</button><b>${headsFor(k)}</b><button data-k="${esc(k)}" data-s="1">+</button></span>${flag}${pin}</td>`;
}
// A dropped start day snaps forward to the next working day, so the stored date is one the
// bar actually begins on. Without this the pin tooltip and the ⟲ title could name a Sunday
// the layout had already skipped past.
function schSnap(i, days){
  for(let j=Math.max(0,i); j<days.length; j++) if(days[j].working) return j;
  for(let j=Math.min(i,days.length-1); j>=0; j--) if(days[j].working) return j;
  return -1;
}
// Where a drop lands. Separate from the pointer handling so it is testable without a layout
// engine: jsdom has no elementFromPoint and no pointer capture, and a test that reimplemented
// this instead would pass with the real path broken.
function schCommitStart(key, at, auto, days){
  const snapped = schSnap(at, days);
  if(snapped < 0){ renderSchedule(); return; }
  ST.schStart = ST.schStart || {};
  // Dropping a bar back on its own default CLEARS the pin rather than freezing today's date.
  // Freezing would quietly stop the bar tracking the budget: retag the initiative to another
  // month and it would still sit on the old start, looking like the planner was wrong.
  if(snapped === auto) delete ST.schStart[key];
  else ST.schStart[key] = days[snapped].date;
  save(); renderSchedule();
}
function wireSched(days){
  const t = document.getElementById('schToggle');
  if(t) t.addEventListener('click', ()=>{ ST.schOpen = !ST.schOpen; save(); renderSchedule(); });
  document.querySelectorAll('#sched .heads button').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    const k = b.dataset.k;
    ST.heads = ST.heads || {};
    ST.heads[k] = Math.max(1, Math.min(9, headsFor(k) + (+b.dataset.s)));
    save(); renderSchedule();
  }));
  document.querySelectorAll('#sched .spin').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    if(ST.schStart) delete ST.schStart[b.dataset.k];
    save(); renderSchedule();
  }));
  if(days) wireSchedDrag(days);
}

// ---- drag a bar sideways to move its start day ----------------------------------
// Pointer events, not HTML5 drag-and-drop: the bar is a div per day cell, so a native drag
// would lose its source element the moment the row repaints. The cursor is tracked against
// the day COLUMN under it (elementFromPoint -> td[data-i]) rather than against pixels, so
// the grid, not an assumed column width, decides which day you are on.
function wireSchedDrag(days){
  const tab = document.getElementById('schtab');
  if(!tab) return;
  const mns = ST.months.map(monthName);
  let drag = null;

  const colAt = (x,y)=>{
    const el = document.elementFromPoint ? document.elementFromPoint(x,y) : null;
    const td = el && el.closest ? el.closest('td.sc') : null;
    return td ? +td.dataset.i : -1;
  };

  tab.addEventListener('pointerdown', e=>{
    const bar = e.target.closest && e.target.closest('.sbar');
    if(!bar || e.button) return;
    const tr = bar.closest('tr'), key = tr && tr.dataset.k;
    const it = key && (INITS.initiatives||[]).find(i=>i.key===key);
    const r = it && schRow(it, days, mns);
    if(!r || r.start < 0) return;
    e.preventDefault();
    drag = {tr, key, r, grab: colAt(e.clientX, e.clientY), start: r.start, at: r.start};
    tr.classList.add('sdrag');
    // capture on the TABLE: the bar under the cursor is destroyed by the first repaint,
    // so capturing on the bar itself would drop the pointer after one move.
    try{ tab.setPointerCapture(e.pointerId); }catch(_){}
  });

  tab.addEventListener('pointermove', e=>{
    if(!drag) return;
    const c = colAt(e.clientX, e.clientY);
    if(c < 0 || drag.grab < 0) return;
    const want = Math.max(0, Math.min(days.length-1, drag.start + (c - drag.grab)));
    if(want === drag.at) return;
    drag.at = want;
    // repaint only the dragged row, so the table does not re-sort out from under the cursor
    const lay = schLayout(drag.r.sp, headsFor(drag.key), days, want);
    const endDate = lay.end >= 0 ? days[lay.end].date : '';
    const live = Object.assign({}, drag.r, lay, {endDate, pinned:true,
      late: !!(drag.r.due && endDate && endDate > drag.r.due)});
    drag.live = live;
    [...drag.tr.querySelectorAll('td.sc')].forEach(td=>td.remove());
    drag.tr.insertAdjacentHTML('beforeend', schCells(live, days));
  });

  const finish = e=>{
    if(!drag) return;
    const d = drag; drag = null;
    d.tr.classList.remove('sdrag');
    try{ tab.releasePointerCapture(e.pointerId); }catch(_){}
    if(d.at === d.start) renderSchedule();                 // click, or dragged back
    else schCommitStart(d.key, d.at, d.r.auto, days);
  };
  tab.addEventListener('pointerup', finish);
  tab.addEventListener('pointercancel', finish);
}

/* ---------------- handover readiness ------------------------------------------
   Rules: ~/engg-cycle-planning/handover-score-rules.md (SOP v2 + CONFIG-7, verified
   against live data). The three things that are easy to get wrong:

   SCOPE. A row is initiative x tagged team x cycle month. Your HEADLINE score counts only
   rows for your OWN pod, across every initiative tagging you - not just the ones you are
   Tech DRI on. A partner pod failing to budget does NOT lower your score; that is their
   row. You are measured on your pod and accountable for the rest, and those are different
   numbers, so they are shown separately.

   ZERO COUNTS AS FILLED. The budget check is presence, not value, so an explicit 0 scores
   10. Four green rows can represent zero committed effort.

   DUE DATE IS NOT SCORED, BUT IS THE ACCEPTANCE SIGNAL. "A tagged team with no linked
   epic, or an epic with no target date, counts as a missing/unaccepted dependency." So a
   row can score 10 and still be formally unaccepted. Both are shown.                     */
const READY_OK = 'OK', READY_NO_BUDGET = 'Missing budget', READY_NO_EPIC = 'Missing epic';
function scoreRow(hasEpic, budgetSet){
  if(!hasEpic)    return {score:1,  status:READY_NO_EPIC};
  if(!budgetSet)  return {score:3,  status:READY_NO_BUDGET};
  return {score:10, status:READY_OK};
}
// Cancelled epics are excluded from "linked"; Done epics still count.
const liveEpic = e => !!e && String(e.status || '').toLowerCase() !== 'cancelled';

function readiness(it){
  const mons = ST.months.filter(ym=>(it.cycles||[]).includes(cycleTag(ym)));
  if(!mons.length) return null;
  const epic = liveEpic(it.epic) ? it.epic : null;

  // what you are MEASURED on: your own pod's row per cycle month
  const own = mons.map(ym=>{
    const mn = monthName(ym), tag = cycleTag(ym);
    const filed = +((it.budgets||{})[mn]) || 0;
    const set = ((it.budgetsSet||{})[mn]) === true;
    return Object.assign({tag, mn, filed, zero: !!epic && set && filed <= 0}, scoreRow(!!epic, set));
  });
  const worst = own.reduce((a,b)=> b.score < a.score ? b : a);
  const avg = Math.round(own.reduce((t,r)=>t+r.score,0) / own.length * 10) / 10;

  // what you are ACCOUNTABLE for as Tech DRI: the other tagged pods' rows. Not in your
  // headline average, but the SOP names the Tech DRI as resolution owner.
  const others = [];
  if(ME.name && it.engDri === ME.name){
    (DEPS[it.key] || []).forEach(d=>{
      const theirEpic = d.epic && String(d.epicStatus || '').toLowerCase() !== 'cancelled';
      mons.forEach(ym=>{
        const tag = cycleTag(ym);
        const v = +((d.months||{})[tag]) || 0;
        const vs = ((d.monthsSet||{})[tag]) === true;
        others.push(Object.assign({tag, pod: d.pod, filed: v, zero: vs && v <= 0,
                                   unaccepted: !!theirEpic && !d.epicDue},
                                  scoreRow(!!theirEpic, vs)));
      });
    });
  }
  // acceptance is the epic's due date, and is NOT part of the score
  const unaccepted = !!epic && !epic.dueDate;
  return {own, others, worst, avg, unaccepted,
          zeros: own.filter(x=>x.zero),
          reversed: !!(it.epic && it.epic.linkReversed)};
}

function readyBadge(it){
  if(!ME.name) return '';
  const r = readiness(it);
  if(!r) return '';
  const isDri = it.engDri === ME.name;

  if(r.reversed){
    return `<span class="rdy rev" title="${esc('Epic is linked the wrong way round, so JPD does not treat it as the delivery epic. Reverse-linked epics score nothing until relinked (epic implements initiative).')}">&#9888;</span>`;
  }
  // partner-pod rows only load for your own DRI initiatives, and only matter there
  const pending = isDri && depsState !== 'ready';

  const lines = [`YOUR SCORE (what you are measured on)`];
  r.own.forEach(x=> lines.push(`  ${x.tag}: ${x.status === READY_OK
      ? `${x.score}/10${x.zero ? ' \u2014 but budgeted 0 SP, nothing committed' : ` (${x.filed} SP)`}`
      : `${x.score}/10 \u2014 ${x.status}`}`));
  if(r.unaccepted)
    lines.push(`  ACCEPTANCE: epic has no due date, so it is formally an unaccepted dependency (not scored)`);

  if(isDri){
    if(pending) lines.push('', 'Checking the other tagged pods\u2026');
    else {
      const gaps = r.others.filter(x=>x.status !== READY_OK || x.zero || x.unaccepted);
      if(gaps.length){
        lines.push('', `OTHER PODS (not in your score \u2014 you own resolution as Tech DRI)`);
        gaps.slice(0, 8).forEach(x=> lines.push(`  ${x.tag} \u00b7 ${x.pod}: ${
          x.status !== READY_OK ? x.status
          : x.zero ? 'budgeted 0 SP' : 'epic has no due date (unaccepted)'}`));
      } else if(r.others.length) lines.push('', 'Other tagged pods: all ready.');
    }
  }

  // Colour tracks YOUR row, because that is the number in the bar. An otherwise-green row
  // that is unaccepted or budgeted zero is not shown as a clean tick.
  const soft = r.unaccepted || r.zeros.length;
  const cls = r.worst.score === 1 ? 'bad' : r.worst.score === 3 ? 'warn' : soft ? 'warn' : 'ok';
  const glyph = r.worst.score === 1 ? '&#10007;' : (r.worst.score === 3 || soft) ? '&#9888;' : '&#10003;';
  const head = r.worst.score === 10
    ? (r.zeros.length ? `Scores ${r.avg}/10 but budgeted 0 SP`
       : r.unaccepted ? `Scores ${r.avg}/10 but not formally accepted`
       : `Ready \u00b7 ${r.avg}/10`)
    : `${r.worst.status} \u00b7 ${r.avg}/10`;
  return `<span class="rdy ${cls}" title="${esc(head + '\n\n' + lines.join('\n'))}">${glyph}</span>`;
}

function renderBoard(){
  if(!INITS){ board.innerHTML='<div class="state">Loading initiatives…</div>'; return; }
  const err = INITS.error || INITS.__error__;
  if(err){ board.innerHTML=`<div class="state">initiatives failed: ${esc(err)}</div>`; return; }
  if(!Array.isArray(INITS.initiatives)){ board.innerHTML='<div class="state">no initiatives in response</div>'; return; }
  const selMn = ST.months.map(monthName);
  const mheads = ST.months.map(ym=>`<th class="mcol">${monthLabel(ym)}</th>`).join('');
  const xcols = activeCols();
  const xheads = xcols.map(c=>`<th class="xcol">${c.label}</th>`).join('');
  const span = 5 + ST.months.length + xcols.length;
  const vis = visibleInits();
  const offKeys = revealedKeys();
  const needDetail = [];
  const buildRow = (it,idx)=>{
    const offCycle = !!(offKeys && offKeys.has(it.key));
    const mcells = ST.months.map(ym=>{
      const mn = monthName(ym); const c = cell(it.key, mn);
      // No tick box: a month is planned iff it carries a number. Typing plans it, clearing
      // the box unplans it. An empty cell still shows what Jira holds as a ghost placeholder,
      // so the filed budget is visible without touching the plan.
      const jira = +((it.budgets||{})[mn]) || 0;
      const ghost = jira ? ` placeholder="${jira}" title="Jira holds ${jira} SP — type to plan it"` : '';
      return `<td class="mcol"><span class="mcell">
        <input type="number" min="0" step="0.5" data-k="${esc(it.key)}" data-m="${esc(mn)}" value="${c.on?(c.sp??''):''}"${ghost}>
        <span class="sync"></span>
      </span></td>`;
    }).join('');
    const open = ST.initOpen[it.key];
    const d = DETAILS[it.key];
    let detailRow = '';
    if(open){
      // ST.initOpen is persisted but DETAILS is not, so an open row can survive a reload or a
      // filter change with nothing fetched. Kick the fetch off from the render, not just the click.
      if(!d) needDetail.push(it.key);
      const inner = !d ? `Loading ${esc(it.key)}…`
        : (d.__error__ || d.error ? `<span class="noepic">failed: ${esc(d.__error__||d.error)}</span>
             <button class="linkbtn retry" data-k="${esc(it.key)}">retry</button>`
          : `${d.impact?`<h4>Impact</h4><p class="impact">${esc(d.impact)}</p>`:''}
             <h4>Description</h4>${richHtml(d.descriptionRich, d.descriptionText)}`);
      detailRow = `<tr class="detail" data-k="${esc(it.key)}"><td colspan="${span}">${inner}</td></tr>`;
    }
    const act = it.epic
      ? `<button class="subbtn" data-k="${esc(it.key)}" title="Submit this epic's budget to Jira">⤴ Submit</button>`
      : `<span class="noepic" title="Link an epic before submitting">no epic</span>`;
    // fields promoted to their own column are dropped from the summary sub-line (no duplication)
    const showPri  = it.orgPriority && !ST.cols.includes('orgPri');
    const showEng  = it.engDri  && !ST.cols.includes('engDri');
    const showProd = it.prodDri && !ST.cols.includes('prodDri');
    const xcells = xcols.map(c=>{
      // read-only when the column has no Jira field behind it, or the row has no epic to write to
      const ik = EDITABLE[c.id] ? issueKeyFor(it, c.id) : '';
      const attrs = ik
        ? `class="xcol editable" data-col="${c.id}" data-issue="${ik}" data-label="${esc(c.label)}"`
          + ` title="click to edit ${esc(c.label)} on ${ik}"`
        : 'class="xcol"';
      return `<td ${attrs}>${c.render(it)}</td>`;
    }).join('');
    return `<tr class="row${isArchived(it)?' archived':''}${offCycle?' offcycle':''}" draggable="true" data-k="${esc(it.key)}">
      <td class="rank"><span class="handle">⠿</span> ${idx+1}</td>
      <td class="key"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.key)}</a></td>
      <td class="summ-toggle" data-k="${esc(it.key)}"><div class="nm"><span class="caretline">${open?'▾':'▸'}</span>${esc(it.summary)}${isArchived(it)?`<span class="archtag" title="Archived${it.archivedOn?' on '+esc(it.archivedOn):''} — excluded from capacity and submit">archived</span>`:''}${offCycle?`<span class="offtag" title="Planning Cycle in Jira is ${esc((it.cycles||[]).join(', ')||'unset')} — not in the months you are viewing, so its SP are excluded from every capacity total">${esc((it.cycles||[]).join(', ')||'no cycle')}</span>`:''}</div>${showPri?`<span class="pri">${esc(it.orgPriority)}</span>`:''}${(showEng||showProd)?`<div class="dri">${showEng?`<b>Eng</b> ${esc(it.engDri)}`:''}${showEng&&showProd?' · ':''}${showProd?`<b>Prod</b> ${esc(it.prodDri)}`:''}</div>`:''}</td>
      <td>${readyBadge(it)}${it.epic
        ? `<span class="epic"><a href="${esc(it.epic.url)}" target="_blank" rel="noopener">${esc(it.epic.key)}</a>`
          + `<button class="unlinkbtn" data-k="${esc(it.key)}" data-epic="${esc(it.epic.key)}"`
          + ` title="Unlink ${esc(it.epic.key)} from ${esc(it.key)} (the epic itself is kept)">✕</button></span>`
        : `<button class="linkbtn" data-k="${esc(it.key)}">＋ link epic</button>`}</td>
      ${xcells}
      ${mcells}
      <td class="act">${act}</td>
    </tr>${detailRow}`;
  };
  // One heading before the first revealed row. visibleInits() guarantees they are contiguous
  // and last, so a single separator bands the whole group.
  let banded = false;
  const offCount = offKeys ? vis.filter(it=>offKeys.has(it.key)).length : 0;
  const rows = vis.map((it,idx)=>{
    let sep = '';
    if(offKeys && !banded && offKeys.has(it.key)){
      banded = true;
      const n = vis.length - idx;
      // Deliberately NOT "excluded from submit": plannedFor() drops them from capacity, but
      // gatherEpicBudgets() does not, so a draft left here still goes to Jira on Submit.
      // That asymmetry is the reason "Clear their draft plans" exists.
      sep = `<tr class="offsep"><td colspan="${span}">▾ ${n} off-cycle initiative${n===1?'':'s'}
        — not tagged ${esc(ST.months.map(cycleTag).join(' / '))} in Jira
        <span class="sub">· shown because they still carry a draft plan or a budget filed on their epic ·
        their SP are excluded from every capacity total, but a draft left here is still submitted</span></td></tr>`;
    }
    return sep + buildRow(it, idx);
  }).join('');
  const empty = ST.driMe ? 'No initiatives where you are the Tech DRI in this view.'
    : (ST.showAll ? 'No initiatives for the selected pod(s).'
    : 'No initiatives in the selected month(s). Click “Show all” to add some to the cycle.');
  board.innerHTML = `<div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Init</th><th>Summary</th><th>Epic</th>${xheads}${mheads}<th class="act"></th></tr></thead>
    <tbody id="tb">${rows||`<tr><td colspan="${span}" class="state">${empty}</td></tr>`}</tbody>
  </table></div>
  <div class="note" style="color:var(--hint);font-size:12px;margin:12px 4px 4px">
    Showing ${offKeys ? vis.filter(it=>!offKeys.has(it.key)).length : vis.length} of ${orderedInits().length} open initiatives for ${esc(podsNow().join(', ') || 'your pod')}${ST.showAll?'':' · in the selected month(s)'}${ST.driMe?' · Tech DRI = you':''}${offKeys&&offCount?` · plus ${offCount} off-cycle, listed at the bottom`:''}<span id="pendnote"></span>.</div>
  ${strandedNote()}`;
  wireBoard();
  refreshPending();
  showDataAge();                    // the span is recreated by this render, so refill it
  renderSchedule();                 // bars share the board's filters and plan numbers
  renderHandover();                 // published score; its own data, its own filters
  needDetail.forEach(loadDetail);   // no-ops for keys already in flight
}

function strandedNote(){
  const st = strandedInits();
  if(!st.length) return '';
  const mns = ST.months.map(monthName).join('/');
  const filed = st.filter(it=>ST.months.some(ym=>(+((it.budgets||{})[monthName(ym)])||0) > 0));
  const what = filed.length
    ? `${filed.length} with a budget already filed in Jira for ${esc(mns)}`
    : `planned here in an earlier draft`;
  return `<div class="stranded">
    ${st.length} initiative${st.length===1?'':'s'} hidden — tagged for another planning cycle, ${what}.
    <button class="slink" id="revealStranded">${REVEAL?'Hide them again':'Show them at the bottom'}</button>
    <button class="slink" id="clearStranded">Clear their draft plans</button></div>`;
}

function showDataAge(){
  const el = document.getElementById('dataage');
  if(!el || !INITS || !INITS.generated) return;
  const today = new Date().toISOString().slice(0,10);
  const stale = INITS.generated !== today;
  el.innerHTML = ` · <span style="color:${stale?'var(--warn)':'var(--hint)'}"
    title="${stale?'Click Reload from Jira to refresh':'built today'}">Jira data: ${esc(INITS.generated)}${stale?' — stale':''}</span>`;
}
function rerender(){ renderStrip(); renderBoard(); }   // renderBoard draws the lane

// Greedy capacity pack: pour each initiative's Est. SP into the selected months
// left-to-right (rank order), filling each month to its effective-SP capacity.
function autoPlan(){
  OVERFLOW = {};
  const sized = it => (+ST.est[it.key] || 0) > 0;
  // Start from full capacity, then RESERVE what non-sized initiatives already hold
  // (their existing/epic budgets) — auto-plan only fills the leftover, and only
  // touches the initiatives you've given an Est. SP (never wipes the others).
  const rem = {}; ST.months.forEach(ym=>{ rem[ym] = CAPS[ym] ? CAPS[ym].teamSP : 0; });
  orderedInits().forEach(it=>{
    if(sized(it)) return;
    ST.months.forEach(ym=>{ const c = ST.plan[it.key]?.[monthName(ym)]; if(c && c.on) rem[ym] -= (+c.sp||0); });
  });
  orderedInits().filter(sized).forEach(it=>{        // clear only the sized rows before re-packing
    ST.months.forEach(ym=>{ const c = cell(it.key, monthName(ym)); c.on = false; c.sp = 0; });
  });
  orderedInits().filter(sized).forEach(it=>{
    let sp = +ST.est[it.key] || 0;
    for(const ym of ST.months){
      if(sp <= 0) break;
      const put = Math.min(sp, Math.max(0, rem[ym]));
      if(put > 0){
        const c = cell(it.key, monthName(ym));
        c.on = true; c.sp = Math.round(put*10)/10;
        rem[ym] -= put; sp -= put;
      }
    }
    if(sp > 0.01) OVERFLOW[it.key] = Math.round(sp*10)/10;
  });
  save(); rerender();
}

function renderGantt(){
  const g = document.getElementById('gantt'); if(!g) return;
  if(!INITS || !Array.isArray(INITS.initiatives)){ g.innerHTML=''; return; }
  const rows = orderedInits().filter(it => (+ST.est[it.key]||0) > 0 || ST.months.some(ym=>ST.plan[it.key]?.[monthName(ym)]?.on));
  if(!rows.length){ g.innerHTML = '<div class="state">Set Est. SP on initiatives, then Auto-plan.</div>'; return; }
  const gh = ST.months.map(ym=>`<th>${monthLabel(ym)}</th>`).join('');
  const body = rows.map(it=>{
    const cells = ST.months.map(ym=>{
      const c = ST.plan[it.key]?.[monthName(ym)];
      const v = (c && c.on) ? (+c.sp||0) : 0;
      const hot = !!OVERFLOW[it.key];
      return `<td><div class="gcell ${v>0?'fill':''} ${v>0&&hot?'hot':''}">${v>0?`<span class="gsp">${v}</span>`:''}</div></td>`;
    }).join('');
    const spill = OVERFLOW[it.key] ? `<span class="gspill" title="doesn't fit the window"> +${OVERFLOW[it.key]}⚠</span>` : '';
    return `<tr><td class="gname"><span class="k">${esc(it.key)}</span>${esc(it.summary)}${spill}</td>${cells}</tr>`;
  }).join('');
  g.innerHTML = `<table class="gtable"><thead><tr><th class="gname">Initiative</th>${gh}</tr></thead><tbody>${body}</tbody></table>`;
}

// ---- board interactions ----
function wireBoard(){
  board.querySelectorAll('.mcell input[type=number]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const c = cell(inp.dataset.k, inp.dataset.m);
      const raw = inp.value.trim();
      // grouped view can show the same initiative under several pods — keep its twins in step
      board.querySelectorAll(`.mcell input[type=number][data-k="${inp.dataset.k}"][data-m="${inp.dataset.m}"]`)
           .forEach(o=>{ if(o !== inp) o.value = inp.value; });
      c.on = raw !== '';                         // empty = not planned this month
      c.sp = c.on ? (parseFloat(raw) || 0) : 0;  // "0" is a real plan: it clears Jira's budget
      save(); renderStrip(); refreshPending();   // live totals without full re-render (keep focus)
    });
  });
  board.querySelectorAll('.estsp').forEach(inp=>inp.addEventListener('input', ()=>{
    ST.est[inp.dataset.k] = parseFloat(inp.value)||0; save();
  }));
  // due date renders as a live date input (the right control for a date), but writes
  // through the same /api/set-field contract as every other column
  board.querySelectorAll('input.duedate').forEach(inp=>{
    inp.addEventListener('change', e=>{
      e.stopPropagation();
      setField(inp.dataset.epic, 'epicDue', inp.value, 'Epic due date');
    });
    inp.addEventListener('click', e=>e.stopPropagation());   // don't trigger cell edit mode
  });
  board.querySelectorAll('td.xcol.editable').forEach(td=>td.addEventListener('click', e=>{
    if(e.target.closest('input, select, .usermenu')) return;
    beginEdit(td);
  }));
  const rv = document.getElementById('revealStranded');
  if(rv) rv.addEventListener('click', ()=>{
    REVEAL = !REVEAL; renderBoard();
    // the rows land at the bottom of a long table, so take the eye there.
    // guarded on the method: jsdom does not implement scrollIntoView, and the reveal itself
    // must not depend on a scroll succeeding.
    const sep = REVEAL && document.querySelector('tr.offsep');
    if(sep && sep.scrollIntoView) sep.scrollIntoView({behavior:'smooth', block:'center'});
  });
  const cs = document.getElementById('clearStranded');
  if(cs) cs.addEventListener('click', ()=>{
    // only clears the LOCAL draft — a budget filed on the epic in Jira is left alone
    const mns = ST.months.map(monthName), undo = [];
    strandedInits().forEach(it=>mns.forEach(mn=>{
      const c = ST.plan[it.key]?.[mn];
      if(c && c.on){ undo.push([it.key, mn, c.sp||0]); c.on=false; c.sp=0; }
    }));
    if(!undo.length){ toast('Nothing to clear — those rows carry no local draft.', 'ok'); return; }
    save(); renderBoard(); refreshPending();
    toast(`Cleared ${undo.length} draft entr${undo.length===1?'y':'ies'} on off-cycle initiatives`, 'ok',
          {label:'Undo', fn:()=>{ undo.forEach(([k,mn,sp])=>{
              ST.plan[k][mn].on=true; ST.plan[k][mn].sp=sp; });
            save(); renderBoard(); refreshPending(); }});
  });
  board.querySelectorAll('.linkbtn:not(.retry)').forEach(b=>b.addEventListener('click', ()=>linkEpic(b.dataset.k)));
  board.querySelectorAll('.unlinkbtn').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); unlinkEpic(b.dataset.k, b.dataset.epic);
  }));
  board.querySelectorAll('.linkbtn.retry').forEach(b=>b.addEventListener('click', ()=>{
    delete DETAILS[b.dataset.k]; loadDetail(b.dataset.k);
  }));
  board.querySelectorAll('.subbtn').forEach(b=>b.addEventListener('click', ()=>submitOne(b.dataset.k)));
  board.querySelectorAll('.summ-toggle').forEach(td=>td.addEventListener('click', ()=>{
    const k=td.dataset.k; ST.initOpen[k]=!ST.initOpen[k]; save();
    if(ST.initOpen[k] && !DETAILS[k]) loadDetail(k); else renderBoard();
  }));
  // drag to reorder
  let dragK=null;
  board.querySelectorAll('tr.row').forEach(tr=>{
    tr.addEventListener('dragstart', e=>{ dragK=tr.dataset.k; tr.classList.add('drag'); });
    tr.addEventListener('dragend', ()=>{ tr.classList.remove('drag'); board.querySelectorAll('tr.over').forEach(r=>r.classList.remove('over')); });
    tr.addEventListener('dragover', e=>{ e.preventDefault(); tr.classList.add('over'); });
    tr.addEventListener('dragleave', ()=> tr.classList.remove('over'));
    tr.addEventListener('drop', e=>{
      e.preventDefault(); tr.classList.remove('over');
      const tgt=tr.dataset.k; if(!dragK||dragK===tgt) return;
      const arr=ST.order.slice();
      arr.splice(arr.indexOf(dragK),1);
      arr.splice(arr.indexOf(tgt),0,dragK);
      ST.order=arr; save(); rerender();
    });
  });
}

// ---- filters (multi-select dropdowns) ----
function wireDropdown(id, onOpen){
  const dd=document.getElementById(id);
  dd.querySelector('button').addEventListener('click', e=>{
    document.querySelectorAll('.dd').forEach(d=>{ if(d!==dd) d.classList.remove('open'); });
    if(!dd.classList.contains('open')) onOpen();
    dd.classList.toggle('open');

// ---- data loading ----
function winQS(ym){
  const w = (ST.win||{})[ym];
  return w && w.start && w.end
    ? `&start=${encodeURIComponent(w.start)}&end=${encodeURIComponent(w.end)}` : '';

// Counterpart-pod readiness for initiatives you are Tech DRI on. Loaded separately and
// late: it walks every tagged pod's epics across projects, so it is much slower than the
// board, and the board must never wait for it.
let depsState = 'idle';   // idle | loading | ready | failed
async function loadDeps(){
  if(depsState === 'loading' || depsState === 'ready' || !ME.name || !ST.months.length) return;
  depsState = 'loading'; renderBoard();
  const q = new URLSearchParams({dri:'me', months: ST.months.join(',')});
  try{
    const d = await (await fetch('/api/dependencies?'+q)).json();
    if(!d || !Array.isArray(d.rows)) throw new Error(d && (d.__error__ || d.error) || 'bad payload');
    const by = {};
    d.rows.forEach(r=>{ (by[r.key] = by[r.key] || []).push(r); });
    DEPS = by; depsState = 'ready';
  }catch(e){
    depsState = 'failed';
    toast('Could not check partner pods, so readiness is incomplete: ' + e.message, 'warn');
  }
  renderBoard();
}

async function loadCaps(){
  await Promise.all(ST.months.filter(ym=>!(ym in CAPS)).map(async ym=>{
    try{ const d=await (await fetch(`/api/month?ym=${ym}${winQS(ym)}`)).json(); CAPS[ym]=d.error?null:d; }
    catch(e){ CAPS[ym]=null; }
  }));
  renderStrip();
  renderSchedule();   // the lane needs the calendar, which only exists once caps land
}
async function loadDetail(key){
  if(LOADING.has(key)) return;          // one in-flight fetch per initiative
  LOADING.add(key);
  try{ DETAILS[key] = await (await fetch('/api/initiative?key='+encodeURIComponent(key))).json(); }
  catch(e){ DETAILS[key] = {__error__: e.message}; }
  finally{ LOADING.delete(key); }

// A pod can be RENAMED in Jira (TEAM - Old Pod Name -> TEAM - New Pod Name). The
// old option then matches nothing, so the filter silently returns an empty board and reads
// as the planner being broken. Drop stored pod names the project no longer offers; if that
// empties the selection, fall back to null = the configured default pod.
// ST.plan/order/est/heads/schStart are keyed by INITIATIVE key, which a pod rename does not
// touch, so nothing here can lose a plan.
function prunePods(){
  if(!ST.pods || !PODS.length) return;
  const live = ST.pods.filter(p=>PODS.includes(p));
  if(live.length === ST.pods.length) return;
  const gone = ST.pods.filter(p=>!PODS.includes(p));
  ST.pods = live.length ? live : null;
  save();
  toast(`Pod renamed in Jira — dropped ${gone.map(p=>'“'+p+'”').join(', ')} from your filter.`
        + (live.length ? '' : ' Showing your configured pod.') + ' Your plan is untouched.', 'warn');
  loadInitiatives(false);
}
async function loadInitiatives(fresh){
  const btn = document.getElementById('recalc');
  if(btn){ btn.disabled = true; btn.textContent = fresh ? '↻ Reloading…' : '↻ Reload from Jira'; }
  board.innerHTML='<div class="state">'+(fresh?'Reloading from Jira…':'Loading initiatives…')+'</div>';
  const qs = [];
  if(ST.pods) qs.push(`pods=${encodeURIComponent(ST.pods.join(','))}`);
  if(ST.archived) qs.push('archived=1');
  if(fresh) qs.push('fresh=1');
  const q = qs.join('&');
  const was = INITS && INITS.generated;
  try{ INITS = await (await fetch('/api/initiatives'+(q?'?'+q:''))).json(); }
  catch(e){ INITS={error:e.message}; }
  if(btn){ btn.disabled = false; btn.textContent = '↻ Reload from Jira'; }
  // a reload that finishes in a second with no confirmation reads as "nothing happened"
  if(fresh){
    if(INITS.error || INITS.__error__) toast('Reload failed: '+(INITS.error||INITS.__error__), 'bad');
    else toast(`Reloaded from Jira — ${(INITS.initiatives||[]).length} initiatives`
               + (was && was !== INITS.generated ? ` (was ${was})` : ''), 'ok');
  }
  showDataAge();
  syncPodBtn();
  try{ seedPlan(); rerender(); }
  catch(e){ board.innerHTML=`<div class="state">render error: ${esc(e.message)}. Try “Show all” or reload.</div>`; console.error(e); }
}

// ---- commit to Jira ----
async function post(path, body){
  return (await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
}
function gatherEpicBudgets(){
  // {epicKey:{Month:sp}} summed across initiatives sharing an epic, selected months only, assigned rows
  const selMn = ST.months.map(monthName), eb = {};
  orderedInits().forEach(it=>{
    if(!it.epic || isArchived(it)) return;   // never file a budget for an archived idea
    selMn.forEach(mn=>{
      const c = ST.plan[it.key]?.[mn];
      if(c && c.on){ (eb[it.epic.key] = eb[it.epic.key] || {}); eb[it.epic.key][mn] = (eb[it.epic.key][mn]||0) + (+c.sp||0); }
    });
  });
  return eb;
}
// Fold what Jira just accepted back into the in-memory epic budgets, so the row flips to
// "✓ in Jira" immediately instead of staying pending until the next "Reload from Jira".
function applyDiffsLocally(res){
  const ok = new Set((res.applied||[]).filter(a=>a.ok).map(a=>a.epic));
  (res.diffs||[]).forEach(d=>{
    if(!ok.has(d.epic)) return;
    INITS.initiatives.forEach(it=>{
      if(it.epic && it.epic.key===d.epic){ it.budgets = it.budgets || {}; it.budgets[d.month] = d.to; }
    });
  });
}
// One decision, one click. The old flow asked up to three confirm()s in a row, including a
// binary "OK = link · Cancel = create" — the picker below shows every candidate at once and
// makes "create a new epic" an explicit choice rather than the fall-through of a Cancel.
function pickEpic(initKey, summary, matches){
  return new Promise(resolve=>{
    const rows = matches.map((m,i)=>`<button class="pick" data-i="${i}">
        <span class="pk">${esc(m.key)}</span>
        <span class="ps">${esc(m.summary)}</span>
        ${m.exact?'<span class="pbadge">exact</span>':''}
        ${m.status?`<span class="pst">${esc(m.status)}</span>`:''}
      </button>`).join('');
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>Link an epic to ${esc(initKey)}</h3>
      <p class="msub">${esc(summary)}</p>
      ${matches.length ? `<div class="plist">${rows}</div>`
                       : '<p class="msub none">No similar epic found on the board.</p>'}
      <button class="pick create" data-i="new">＋ Create a new epic “${esc(summary)}”</button>
      <div class="mfoot"><span class="hint">Esc to cancel</span><button class="mcancel">Cancel</button></div>
    </div>`;
    const done = v => { document.removeEventListener('keydown', onKey); back.remove(); resolve(v); };
    const onKey = e => { if(e.key === 'Escape'){ e.preventDefault(); done(null); } };
    back.querySelectorAll('.pick').forEach(b=>b.addEventListener('click', ()=>done(
      b.dataset.i === 'new' ? {mode:'create'} : {mode:'link', epicKey:matches[+b.dataset.i].key})));
    back.querySelector('.mcancel').addEventListener('click', ()=>done(null));
    back.addEventListener('click', e=>{ if(e.target === back) done(null); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    back.querySelector('.pick').focus();
  });
}
// Unlink removes ONLY the issue link. The epic and any budgets already written to it stay
// in Jira, which is why this is safe to offer as a one-click action with an Undo.
async function unlinkEpic(key, epicKey){
  try{
    const r = await post('/api/unlink-epic', {initiative:key, epicKey});
    if(r.__error__){ toast('Unlink failed: '+r.__error__, 'bad'); return; }
    const it = INITS.initiatives.find(i=>i.key===key);
    if(it){ it.epic = null; it.budgets = {}; }
    renderBoard();
    toast(`Unlinked ${r.epic.key} from ${key} — the epic and its budgets are untouched`, 'ok',
          {label:'Re-link', fn:()=>relinkEpic(key, r.epic.key)});
  }catch(e){ toast('Error: '+e.message, 'bad'); }
}
async function relinkEpic(key, epicKey){
  try{
    const res = await post('/api/link-epic', {initiative:key, mode:'link', epicKey});
    if(res.__error__){ toast('Re-link failed: '+res.__error__, 'bad'); return; }
    const it = INITS.initiatives.find(i=>i.key===key);
    if(it) it.epic = res.epic;
    renderBoard();
    toast(`Re-linked ${epicKey} to ${key}. Reload from Jira to pull its budgets back.`, 'ok');
  }catch(e){ toast('Error: '+e.message, 'bad'); }
}
async function linkEpic(key){
  const it = INITS.initiatives.find(i=>i.key===key); if(!it) return;
  try{
    const pv = await post('/api/link-epic', {initiative:key, mode:'preview'});
    if(pv.__error__){ toast('Epic lookup failed: '+pv.__error__, 'bad'); return; }
    if(pv.status==='already_linked'){
      it.epic = pv.epic; renderBoard();
      toast(`${key} is already linked to ${pv.epic.key}.`, 'ok'); return;
    }
    const matches = pv.matches || [];
    // With no candidate epic there is nothing to choose between — a one-button dialog is
    // just a confirm(). Create straight away and let the toast carry the way out.
    let choice = {mode:'create'};
    if(matches.length){
      choice = await pickEpic(key, pv.initiativeSummary, matches);
      if(!choice) return;
    }
    const res = await post('/api/link-epic', {initiative:key, mode:choice.mode, epicKey:choice.epicKey});
    if(res.__error__){ toast('Link failed: '+res.__error__, 'bad'); return; }
    it.epic = res.epic; renderBoard();
    const made = res.status === 'created';
    toast(`${made?'Created and linked':'Linked'} ${res.epic.key} to ${key}`, 'ok',
          // unlink is the honest undo here: a created epic cannot be deleted, but it can be detached
          {label: made ? 'Undo (unlink)' : 'Unlink', fn: ()=>unlinkEpic(key, res.epic.key)});
  }catch(e){ toast('Error: '+e.message, 'bad'); }
}
// One click = one write. No confirm dialog: the button already names the exact change, and
// every successful write comes back with an Undo that restores the previous Jira values.
async function writeBudgets(epicBudgets, label){
  const months = ST.months.map(monthName);
  document.querySelectorAll('.subbtn, #submit').forEach(b=>b.disabled = true);
  try{
    const res = await post('/api/submit-budgets', {epicBudgets, months, dryRun:false});
    if(res.__error__){ toast('Submit failed: '+res.__error__, 'bad'); return; }
    applyDiffsLocally(res); renderBoard();
    if(!(res.diffs||[]).length){ toast(`${label} already up to date in Jira.`, 'ok'); return; }
    const bad = (res.applied||[]).filter(a=>!a.ok);
    if(bad.length){ toast(`${label} failed: ${bad.map(b=>b.epic+' — '+b.error).join('; ')}`, 'bad'); return; }
    const skipped = orderedInits().filter(it=>!it.epic && months.some(mn=>ST.plan[it.key]?.[mn]?.on));
    const warn = skipped.length ? ` · ${skipped.length} initiative(s) skipped (no epic)` : '';
    toast(`Updated ${label} in Jira — ${res.diffs.length} change(s)${warn}`,
          skipped.length ? 'warn' : 'ok', {label:'Undo', fn:()=>undoWrite(res, label)});
  }catch(e){ toast('Error: '+e.message, 'bad'); }
  finally{ refreshPending(); }
}
// Restore the pre-write Jira values. The local plan is deliberately left alone, so the row
// goes back to "pending" — undo reverses Jira, not your planning.
async function undoWrite(res, label){
  const ok = new Set((res.applied||[]).filter(a=>a.ok).map(a=>a.epic));
  const eb = {};
  (res.diffs||[]).forEach(d=>{ if(ok.has(d.epic)) (eb[d.epic] = eb[d.epic]||{})[d.month] = d.from; });
  if(!Object.keys(eb).length) return;
  try{
    const months = [...new Set((res.diffs||[]).map(d=>d.month))];
    const r = await post('/api/submit-budgets', {epicBudgets:eb, months, dryRun:false});
    if(r.__error__){ toast('Undo failed: '+r.__error__, 'bad'); return; }
    applyDiffsLocally(r); renderBoard(); refreshPending();
    toast(`Reverted ${label} in Jira — your plan is unchanged, so it shows as pending again.`, 'ok');
  }catch(e){ toast('Undo error: '+e.message, 'bad'); }
}
// ---- inline column editing ----
// Every column backed by a Jira field is editable in place. The server decides what may
// actually be written (via /editmeta, so screen + permission aware) and hands back the
// control kind and its options; nothing about specific fields is hardcoded here.
async function setField(issueKey, col, value, label){
  const cells = [...board.querySelectorAll(`[data-col="${col}"][data-issue="${issueKey}"]`)];
  cells.forEach(c=>c.classList.add('saving'));
  try{
    const r = await post('/api/set-field', {key:issueKey, column:col, value});
    if(r.__error__){ toast(`${issueKey} ${label}: ${r.__error__}`, 'bad'); return false; }
    applyFieldLocally(issueKey, col, r.display);
    FMETA.delete(`${issueKey}|${col}`);          // options/current value are now stale
    renderBoard();
    if(r.unchanged){ toast(`${issueKey} ${label} unchanged.`, 'ok'); return true; }
    const shown = r.display || 'cleared';
    toast(`${issueKey} ${label} → ${shown}`, 'ok',
          r.undoable ? {label:'Undo', fn:()=>setField(issueKey, col, r.from, label)} : null);
    return true;
  }catch(e){ toast('Error: '+e.message, 'bad'); return false; }
  finally{ cells.forEach(c=>c.classList.remove('saving')); }
}
// mirror the write into the in-memory rows so the cell repaints without a Jira refetch
function applyFieldLocally(issueKey, col, display){
  const m = COL_MODEL[col]; if(!m) return;
  const val = m.list ? String(display||'').split(',').map(s=>s.trim()).filter(Boolean) : (display||'');
  INITS.initiatives.forEach(it=>{
    if(m.scope==='init'  && it.key===issueKey) it[m.attr] = val;
    if(m.scope==='epic'  && it.epic && it.epic.key===issueKey) it.epic[m.attr] = val;
  });
}
function issueKeyFor(it, col){
  const m = COL_MODEL[col]; if(!m) return '';
  return m.scope==='init' ? it.key : (it.epic ? it.epic.key : '');
}

async function fieldMeta(issueKey, col){
  const ck = `${issueKey}|${col}`;
  if(FMETA.has(ck)) return FMETA.get(ck);
  const r = await post('/api/field-meta', {key:issueKey, columns:[col]});
  const meta = r.__error__ ? {editable:false, why:r.__error__} : (r.fields||{})[col] || {editable:false};
  FMETA.set(ck, meta);
  return meta;
}

let EDITING = null;   // the <td> currently showing a control
async function beginEdit(td){
  if(EDITING === td) return;
  const col = td.dataset.col, issueKey = td.dataset.issue, label = td.dataset.label;
  if(!issueKey) return;
  if(EDITING) renderBoard();                    // close any other open editor
  EDITING = td;
  const html = td.innerHTML;
  td.innerHTML = '<span class="hint">…</span>';
  const meta = await fieldMeta(issueKey, col);
  if(!meta.editable){
    td.innerHTML = html; EDITING = null;
    toast(`${label} is not editable on ${issueKey}${meta.why?` — ${meta.why}`:''}`, 'warn');
    return;
  }
  td.innerHTML = controlFor(meta, col);
  const ctl = td.querySelector('select, input');
  if(!ctl){ td.innerHTML = html; EDITING = null; return; }
  ctl.focus();
  if(ctl.tagName === 'SELECT' && meta.kind !== 'multi') ctl.size = 0;

  let done = false;
  const cancel = ()=>{ if(done) return; done = true; EDITING = null; renderBoard(); };
  const commit = async ()=>{
    if(done) return; done = true; EDITING = null;
    const v = readControl(td, meta);
    const ok = await setField(issueKey, col, v, label);
    if(!ok) renderBoard();
  };
  ctl.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
    if(e.key === 'Enter' && meta.kind !== 'multi'){ e.preventDefault(); commit(); }
  });
  const isUser = meta.kind === 'user' || meta.kind === 'users';
  ctl.addEventListener('change', ()=>{ if(!isUser) commit(); });
  // A user cell commits only on an actual pick: blur-committing an unresolved name would
  // send an empty accountId and silently clear the assignee.
  ctl.addEventListener('blur', ()=>setTimeout(()=>{
    if(done) return;
    isUser ? cancel() : commit();
  }, 120));
  if(isUser){ wireUserPicker(td, ctl); ctl.addEventListener('commitpick', commit); }
}
function controlFor(meta, col){
  const opts = meta.options || [];
  const cur = meta.value;
  const sel = v => (Array.isArray(cur) ? cur.map(String).includes(String(v)) : String(cur)===String(v));
  if(meta.kind === 'transition')
    return `<select class="inline"><option value="">— move to —</option>${
      opts.map(o=>`<option value="${esc(o.id)}">${esc(o.label)}</option>`).join('')}</select>`;
  if(meta.kind === 'select')
    return `<select class="inline"><option value="">— none —</option>${
      opts.map(o=>`<option value="${esc(o.id)}" ${sel(o.id)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  if(meta.kind === 'multi')
    return `<select class="inline" multiple size="${Math.min(6, Math.max(3, opts.length))}">${
      opts.map(o=>`<option value="${esc(o.id)}" ${sel(o.id)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  if(meta.kind === 'labels')
    return `<input class="inline" type="text" value="${esc((cur||[]).join(', '))}" placeholder="comma,separated">`;
  if(meta.kind === 'user' || meta.kind === 'users')
    return `<input class="inline userpick" type="text" placeholder="type a name…" autocomplete="off">
            <div class="usermenu"></div>`;
  if(meta.kind === 'date')  return `<input class="inline" type="date" value="${esc(cur||'')}">`;
  if(meta.kind === 'number')return `<input class="inline" type="number" step="0.5" value="${esc(cur??'')}">`;
  return `<input class="inline" type="text" value="${esc(cur??'')}">`;
}
function readControl(td, meta){
  const ctl = td.querySelector('select, input');
  if(meta.kind === 'multi') return [...ctl.selectedOptions].map(o=>o.value);
  if(meta.kind === 'labels') return ctl.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(meta.kind === 'user')  return ctl.dataset.accountid || '';
  if(meta.kind === 'users') return ctl.dataset.accountid ? [ctl.dataset.accountid] : [];
  return ctl.value;
}
// Jira user pickers need an accountId, not a name — resolve it through a typeahead.
function wireUserPicker(td, inp){
  const menu = td.querySelector('.usermenu');
  let t;
  inp.addEventListener('input', ()=>{
    inp.dataset.accountid = '';
    clearTimeout(t);
    const q = inp.value.trim();
    if(q.length < 2){ menu.innerHTML=''; return; }
    t = setTimeout(async ()=>{
      const r = await (await fetch('/api/user-search?q='+encodeURIComponent(q))).json();
      menu.innerHTML = (r.users||[]).map(u=>
        `<div class="uopt" data-id="${esc(u.accountId)}">${esc(u.label)}<small>${esc(u.email||'')}</small></div>`
      ).join('') || '<div class="uopt none">no match</div>';
      menu.querySelectorAll('.uopt[data-id]').forEach(d=>d.addEventListener('mousedown', e=>{
        e.preventDefault();
        inp.value = d.firstChild.textContent;
        inp.dataset.accountid = d.dataset.id;
        menu.innerHTML = '';
        inp.dispatchEvent(new Event('commitpick'));
      }));
    }, 250);
  });
}

async function submitOne(key){

  if(!mb || !Object.keys(mb).length){ toast(`Nothing assigned for ${ek} in the selected month(s).`, 'warn'); return; }
  await writeBudgets({[ek]: mb}, ek);

async function submitBudgets(){
  const eb = gatherEpicBudgets();
  if(!Object.keys(eb).length){ toast('Nothing to submit — no linked epic has a budget in the selected months.', 'warn'); return; }
  const pend = pendingDiffs();
  if(!Object.keys(pend).length){ toast('Already up to date — nothing to write.', 'ok'); return; }
  // only send the epics that actually differ, so the toast count matches the button count
  const only = {}; Object.keys(pend).forEach(ek=>{ only[ek] = eb[ek]; });
  await writeBudgets(only, `${Object.keys(only).length} epic(s)`);
}

async function boot(){
  wireDropdown('ddPods', renderPodMenu);
  wireDropdown('ddMonths', renderMonthMenu);
  wireDropdown('ddCols', renderColMenu);
  syncColBtn();
  document.getElementById('recalc').addEventListener('click', ()=> loadInitiatives(true));
  document.getElementById('submit').addEventListener('click', submitBudgets);
  const driBtn = document.getElementById('dri');
  const syncViewBtns = ()=>{
    driBtn.textContent = ST.driMe ? `Tech DRI: ${ME.name || 'me'}` : 'Tech DRI: anyone';
    driBtn.style.borderColor = ST.driMe ? 'var(--accent)' : '';
  };
  driBtn.addEventListener('click', ()=>{
    if(!ME.name){ toast('Could not identify you from Jira — filter unavailable.', 'warn'); return; }
    ST.driMe = !ST.driMe; save(); syncViewBtns(); renderBoard();
  });
  syncViewBtns();
  // Named so the re-render is testable: the board renders before this resolves, and both
  // the Tech DRI filter and the readiness badge key off ME, so it must always redraw.
  applyIdentity = d => { if(d && !d.__error__){ ME = d; syncViewBtns(); renderBoard();
    loadDeps(); } };
  fetch('/api/me').then(r=>r.json()).then(applyIdentity).catch(()=>{});
  const tgl=document.getElementById('toggleAll');
  const syncTgl=()=>{ tgl.textContent = ST.showAll ? 'Planned only' : 'Show all'; };
  tgl.addEventListener('click', ()=>{ ST.showAll=!ST.showAll; save(); syncTgl(); renderBoard(); });
  syncTgl();
  const arch=document.getElementById('toggleArch');
  const syncArch=()=>{ arch.textContent = ST.archived ? 'Archived: shown' : 'Archived: hidden';
                       arch.style.borderColor = ST.archived ? 'var(--warn)' : ''; };
  // archived rows are a different row set from the server, so this refetches rather than re-renders
  arch.addEventListener('click', ()=>{ ST.archived=!ST.archived; save(); syncArch(); loadInitiatives(false); });
  syncArch();
  document.getElementById('ddMonths').querySelector('button').textContent = `Months (${ST.months.length})`;
  // The stored plan has to be in hand BEFORE the initiatives arrive: syncOrder() appends
  // anything it has not seen to the end of the rank, so adopting the server copy after
  // that would leave this browser's guess at the order baked in underneath it.
  syncPlan().then(()=>{ loadInitiatives(false); })
            .catch(()=>{ loadInitiatives(false); });
  window.addEventListener('focus', refreshPlan);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshPlan(); });
  loadHandover(false);              // slow: runs the program team's readiness CLI
  loadCaps();
  fetch('/api/pods').then(r=>r.json()).then(d=>{ PODS = d.pods || []; prunePods(); })
                    .catch(()=>{ PODS = []; });
  // which columns are backed by a Jira field at all; per-issue permissions resolve on click
  fetch('/api/planner-fields').then(r=>r.json())
    .then(d=>{ EDITABLE = d.fields || {}; renderBoard(); })
    .catch(()=>{ EDITABLE = {}; });
}
boot();
</script>

</html>
