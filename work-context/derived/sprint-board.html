<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint Board — who does what, when</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  /* Same tokens as the v2 planner's capacity grid — one visual language for "the team's
     days", so a person reading both pages is not learning two colour schemes. */
  :root{
    --bg:#f3f6fa; --surface:#ffffff; --surface2:#eef2f8; --border:#e4e9f2;
    --text:#15202e; --muted:#5b6675; --hint:#9aa6b4;
    --accent:#3a55d9; --accent-2:#2c41b8; --accent-soft:rgba(58,85,217,.07);
    --avail:#e9f1e8; --leave:#f6e9ec; --leave-t:#a23b4e; --wfh:#f6efdd; --wfh-t:#866113;
    --onc:#e7eefa; --onc-t:#2b57a8; --hol:#eceaf9; --hol-t:#4742ab; --we:#eef1f5;
    --info:#2b57a8; --danger:#b23a4a; --danger-bg:#f8edef; --warn:#866113; --ok:#3b6b3f;
    --sp-bg:#e4eede;
    /* Task tints. Same pastel family as the capacity cells, so a bar sits ON the calendar
       instead of shouting over it. Each task keeps its own hue, stable across repaints. */
    --t1:#d6e3f7; --t1-t:#24497f;  --t2:#d7e7d2; --t2-t:#345e38;
    --t3:#f0e2bf; --t3-t:#75540f;  --t4:#ded9f3; --t4-t:#3e3a96;
    --t5:#f4d8de; --t5-t:#8e3344;  --t6:#cbe5e3; --t6-t:#1a5553;
    --shadow:0 1px 2px rgba(20,32,46,.04),0 2px 6px rgba(20,32,46,.05); --radius:14px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#171f2a; --surface2:#1e2835; --border:#2a3543;
    --text:#e6ecf3; --muted:#97a3b2; --hint:#697483;
    --accent:#7e8df2; --accent-2:#6f7eea; --accent-soft:rgba(126,141,242,.15);
    --avail:#1b2a17; --leave:#3a1e24; --leave-t:#f0a3b0; --wfh:#352a13; --wfh-t:#e8c074;
    --onc:#162840; --onc-t:#8fb4ea; --hol:#221f4a; --hol-t:#b3adf2; --we:#1e2835;
    --danger:#f0a3b0; --danger-bg:#3a1e24; --warn:#e8c074; --ok:#9fce7e; --sp-bg:#23311a;
    --t1:#24405f; --t1-t:#b6d0f7;  --t2:#28412a; --t2-t:#add88c;
    --t3:#4a3b1b; --t3-t:#f0cd85;  --t4:#322d63; --t4-t:#c6c0f9;
    --t5:#542c35; --t5-t:#f5b2bd;  --t6:#1d423f; --t6-t:#9bdcd7;
    --shadow:0 1px 2px rgba(0,0,0,.32); } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Hanken Grotesk',-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.45;}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 20px 70px;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  h1{font-size:20px;font-weight:700;margin:0;}
  .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0;max-width:640px;}
  .filters{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
  .dd{position:relative;}
  .dd>button,.btn{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;}
  .dd>button{min-width:160px;text-align:left;}
  .dd>button:hover,.btn:hover{border-color:var(--accent);}
  .btn.warn{border-color:var(--leave-t);color:var(--leave-t);background:var(--leave)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .dd .menu{display:none;position:absolute;z-index:40;right:0;margin-top:4px;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:8px;
    min-width:280px;max-height:340px;overflow:auto;}
  .dd.open .menu{display:block;}
  .dd .menu label{display:flex;gap:8px;align-items:center;padding:5px 7px;border-radius:7px;
    font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .dd .menu label:hover{background:var(--surface2);}
  .dd .menu .sm{color:var(--hint);font-size:11px;margin-left:auto;}
  .dlab{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--border);border-radius:10px;padding:5px 10px;background:var(--surface);}
  .dlab input{font:inherit;font-size:12px;border:0;background:none;color:var(--text);outline:none;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px;}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 18px;}
  .metric .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);}
  .metric .v{font:700 26px/1.15 'IBM Plex Mono',monospace;margin-top:5px;}
  .metric .v.over{color:var(--danger);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-bottom:14px;}
  .gwrap{overflow-x:auto;}
  table.g{width:100%;table-layout:fixed;border-collapse:collapse;}
  .g td,.g th{border:1px solid var(--border);text-align:center;padding:0;}
  .g .nm{text-align:left;padding:9px 13px;white-space:nowrap;font-size:13px;font-weight:500;
    width:21%;min-width:180px;background:var(--surface);position:sticky;left:0;z-index:3;}
  .g .cell{height:40px;font-size:12px;font-weight:600;position:relative;}
  .g thead th{background:var(--surface2);}
  .g .dh{font:500 11px/1.2 'IBM Plex Mono',monospace;color:var(--text);padding:5px 2px;min-width:34px;}
  .g .dh small{display:block;font-size:9px;color:var(--muted);font-weight:400;}
  .g .dh.hol{color:var(--hol-t);}
  .g .net{width:62px;min-width:56px;padding:0 5px;font:600 12px/1 'IBM Plex Mono',monospace;
    background:var(--avail);}
  /* The numbers are mono so they line up; the headings are not, because "Capacity" in
     12px mono is wider than the column it names and ran into the one beside it. */
  .g thead th.net{font:600 11px/1.2 'Hanken Grotesk',sans-serif;padding:6px 5px;
    white-space:nowrap;color:var(--muted);letter-spacing:.01em;}
  .g .net.cap{color:var(--muted);}
  .g .net.sp{background:var(--sp-bg);}
  .g .net.load.over{background:var(--danger-bg);color:var(--danger);}
  .c-avail{background:var(--avail);} .c-L{background:var(--leave);color:var(--leave-t);}
  .c-W{background:var(--wfh);color:var(--wfh-t);} .c-O{background:var(--onc);color:var(--onc-t);}
  .c-H{background:var(--hol);color:var(--hol-t);} .c-WE{background:var(--we);}
  /* A day you can plan on. The hover affordance is what tells you the grid is editable. */
  .g .cell.open{cursor:text;}
  .g .cell.open:hover{outline:2px solid var(--accent);outline-offset:-2px;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:11px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(20,32,46,.06);}

  .bar{position:absolute;top:4px;bottom:4px;border-radius:6px;
    background:var(--t1);color:var(--t1-t);border:1px solid color-mix(in srgb,var(--t1-t) 28%,transparent);
    border-left:3px solid var(--t1-t);
    font:600 10px/1.15 'Hanken Grotesk',sans-serif;display:flex;align-items:stretch;
    gap:4px;padding:0 6px 0 5px;cursor:grab;overflow:hidden;white-space:nowrap;z-index:2;
    touch-action:none;}
  .bar.c2{background:var(--t2);color:var(--t2-t);border-color:color-mix(in srgb,var(--t2-t) 28%,transparent);border-left-color:var(--t2-t);}
  .bar.c3{background:var(--t3);color:var(--t3-t);border-color:color-mix(in srgb,var(--t3-t) 28%,transparent);border-left-color:var(--t3-t);}
  .bar.c4{background:var(--t4);color:var(--t4-t);border-color:color-mix(in srgb,var(--t4-t) 28%,transparent);border-left-color:var(--t4-t);}
  .bar.c5{background:var(--t5);color:var(--t5-t);border-color:color-mix(in srgb,var(--t5-t) 28%,transparent);border-left-color:var(--t5-t);}
  .bar.c6{background:var(--t6);color:var(--t6-t);border-color:color-mix(in srgb,var(--t6-t) 28%,transparent);border-left-color:var(--t6-t);}
  /* Short enough to feel like the tile snapped rather than slid, long enough that the
     eye follows it to the next cell. */
  .bar{transition:left .085s cubic-bezier(.2,.8,.3,1), width .085s cubic-bezier(.2,.8,.3,1);}
  /* Not while it is held. An animated width lags the hand by its own duration, which is
     what reads as flicker when you are dragging the edge itself. */
  .bar.drag{transition:none;}
  @media (prefers-reduced-motion: reduce){ .bar{transition:none;} }
  .bar:hover{filter:brightness(.985);}
  /* Selected tiles have to read as a set at a glance, on any of the six tints. */
  .bar.sel{box-shadow:0 0 0 2px var(--accent), 0 2px 8px rgba(20,32,46,.18);}
  .bar.sel::after{content:'';position:absolute;inset:0;border-radius:5px;
    background:var(--accent);opacity:.10;pointer-events:none;}
  .bar.drag{cursor:grabbing;box-shadow:0 3px 12px rgba(20,32,46,.22);z-index:6;}
  /* Work that does not fit before the window ends is the one thing worth shouting about. */
  .bar.spill{background:var(--danger-bg);color:var(--danger);
    border-color:color-mix(in srgb,var(--danger) 40%,transparent);
    border-left-color:var(--danger);border-style:dashed;border-left-style:solid;}
  .bar .lblw{flex:1 1 auto;overflow:hidden;min-width:0;align-self:stretch;display:flex;
    align-items:center;}
  /* On a one-day bar the ✕ was taking half the width, which is what forced "Chequ / e".
     It appears on hover, over the text, so the name gets the whole cell. */
  .bar .x{position:absolute;right:2px;top:1px;bottom:1px;display:none;align-items:center;
    padding:0 3px 0 7px;background:inherit;border-radius:4px;cursor:pointer;font-weight:400;
    opacity:.85;}
  .bar:hover .x{display:flex;}
  .bar .lbl{display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.15;
    max-height:100%;}
  .bar .eff{flex:0 0 auto;font:700 10px/1 'IBM Plex Mono',monospace;opacity:.75;
    padding:1px 3px;border-radius:4px;cursor:text;}
  .bar .eff:hover{background:rgba(255,255,255,.55);opacity:1;}
  .effin{width:34px;border:1px solid var(--accent);border-radius:4px;background:var(--surface);
    color:var(--text);outline:none;padding:0 3px;text-align:right;
    font:700 10px/1.4 'IBM Plex Mono',monospace;}
  .bar .grip{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;}
  .bar .x:hover{opacity:1;}
  .backlog{min-height:46px;border:1px dashed var(--border);border-radius:10px;padding:8px;}
  .backlog.hot{border-color:var(--accent);background:var(--accent-soft);}
  .cat + .cat{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
  .cat{border-radius:8px;padding:4px 6px;}
  .cat.into{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
  .cath{font:700 11px/1 'Hanken Grotesk',sans-serif;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:6px;
    align-items:center;}
  .cath .n{font-weight:500;color:var(--hint);text-transform:none;letter-spacing:0;}
  .catx{margin-left:auto;border:0;background:none;color:var(--hint);cursor:pointer;
    font-size:11px;padding:0 2px;}
  .catx:hover{color:var(--danger);}
  .rows{display:flex;flex-direction:column;gap:2px;}
  .row.note{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
    background:var(--surface2);border:1px solid transparent;cursor:grab;font-size:13px;}
  .row.note:hover{border-color:var(--border);}
  .row.note .grab{color:var(--hint);font-size:11px;letter-spacing:-2px;}
  .row.note .rt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:1px 3px;border-radius:4px;}
  .row.note .sp{color:var(--muted);font:600 11px 'IBM Plex Mono',monospace;cursor:text;
    padding:1px 3px;border-radius:4px;min-width:30px;text-align:right;}
  .row.note .rt{cursor:text;}
  .row.note .rt:hover,.row.note .sp:hover{background:var(--surface);
    box-shadow:inset 0 0 0 1px var(--border);}
  .rowin{border:1px solid var(--accent);border-radius:5px;background:var(--surface);
    color:var(--text);outline:none;padding:1px 5px;width:100%;
    font:500 13px 'Hanken Grotesk',sans-serif;}
  .rowin.days{width:52px;text-align:right;font:600 11px 'IBM Plex Mono',monospace;}
  .row.note .x{color:var(--hint);cursor:pointer;font-size:11px;opacity:0;}
  .row.note:hover .x{opacity:1;}
  .row.note .x:hover{color:var(--danger);}
  .addrow input,.addcat input{width:100%;border:0;border-bottom:1px dashed var(--border);
    background:none;color:var(--text);outline:none;padding:5px 8px;
    font:500 13px 'Hanken Grotesk',sans-serif;}
  .addrow input::placeholder,.addcat input::placeholder{color:var(--hint);}
  .addrow input:focus,.addcat input:focus{border-bottom-color:var(--accent);}
  .addrow{margin-top:3px;}
  .addcat{margin-top:12px;border-top:1px solid var(--border);padding-top:8px;}
  .addcat input{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  .cellin{position:absolute;inset:3px;z-index:7;border:1px solid var(--accent);border-radius:5px;
    font:600 11px/1 'Hanken Grotesk',sans-serif;padding:0 5px;background:var(--surface);
    color:var(--text);outline:none;width:calc(100% - 6px);}

  .tray{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow:auto;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--border);
    background:var(--surface2);border-radius:8px;padding:4px 8px;cursor:grab;user-select:none;}
  .chip:hover{border-color:var(--accent);}
  .chip b{font:500 11px/1.4 'IBM Plex Mono',monospace;}
  .chip .sp{color:var(--hint);}
  .chip.done{opacity:.5;text-decoration:line-through;}
  .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
  .ph h2{font-size:13px;font-weight:650;margin:0;}
  .ph .n{font-size:11.5px;color:var(--hint);}
  .state{padding:18px 4px;color:var(--muted);font-size:13px;}
  @media (max-width:760px){ .wrap{padding:16px 12px 60px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Sprint Board</h1>
      <div class="sub">Click any available day to create a task and type its name. Drag a bar
        to move it, its right edge to lengthen it, onto another row to reassign. Scratch only
        — nothing here is written to Jira.</div>
    </div>
    <div class="filters">
      <div class="dd" id="ddSprints"><button type="button">Sprint</button><div class="menu"></div></div>
      <div class="dd" id="ddProjects"><button type="button">Projects</button><div class="menu"></div></div>
      <label class="dlab">From <input type="date" id="fromD"></label>
      <label class="dlab">To <input type="date" id="toD"></label>
      <button class="btn" id="clearWin" title="Back to planning a real sprint">Use sprint</button>
      <button class="btn primary" id="saveBtn">Save</button>
      <button class="btn" id="pushBtn"
        title="Preview this board as a Jira sprint. Writes nothing until you publish there."
        >→ Push to Jira</button>
      <button class="btn" id="effBtn" title="Plan in story points instead of calendar days"
        >Plan in: days</button>
      <button class="btn" id="leaveBtn"
        title="Mark leave the team never posted. While this is on, clicking a day cycles leave → WFH → present → clear instead of adding a task."
        >🌴 Mark leave</button>
      <button class="btn" id="reload">↻ Reload</button>
    </div>
  </div>

  <div id="cards"></div>
  <div class="card" id="boardP"><div class="state">Pick a sprint.</div></div>
  <div class="card" id="backP"><div class="state">—</div></div>
  <div class="card" id="trayP"><div class="state">—</div></div>
</div>

<script src="/leave-editor.js"></script>
<script src="/drag-scroll.js"></script>
<script>
'use strict';
const LSKEY = 'sprintBoard_v1';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1 = v => (v==null||isNaN(v)) ? '—' : (Math.round(v*10)/10).toString();

// A day splits into four. Everything the planner stores - a start, a length, a total -
// is a whole number of quarters, so the arithmetic is done on quarters and converted back
// rather than left to floating point, where 0.1+0.2 days would drift a bar off the grid.
const STEP = 0.25;
const EPS = 1e-6;
const snapQ = v => Math.round((+v || 0) / STEP) * STEP;
// 0.25 → "0.25", 1 → "1", 1.5 → "1.5". n1() would round a quarter day to 0.3.
const nq = v => (v==null||isNaN(v)) ? '—'
  : (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,'') || '0';
let ST = (()=>{ try{ return JSON.parse(localStorage.getItem(LSKEY))||{}; }catch(e){ return {}; } })();
ST.sprints = ST.sprints || []; ST.projects = ST.projects || [];
ST.from = ST.from || ''; ST.to = ST.to || '';
const save = ()=> localStorage.setItem(LSKEY, JSON.stringify(ST));
let SPRINTS=[], PROJECTS=[], D=null, TASKS=[], DIRTY=false;
let SAVING=false, SAVE_ERR='', SAVED_AT='';
const AUTOSAVE_MS = 5000;   // the board saves itself; the button says what happened

const uid = () => 't' + Math.random().toString(36).slice(2, 9);
// A person cannot work a weekend, a public holiday, their leave, or an on-call day.
// WFH ('W') is a working day and deliberately stays plannable.
const offFor = (p,i) => ['WE','H','L','O'].includes((p.statuses||[])[i]);
// Marking leave is a MODE on this page, not the default gesture: a plain click already
// adds a task here, and one click cannot mean two things.
let LEAVE = false;
const clsOf = s => s==="WE"?"c-WE":s==="L"?"c-L":s==="W"?"c-W":s==="O"?"c-O":s==="H"?"c-H":"c-avail";

function wireDD(id,onOpen){
  const dd=document.getElementById(id);
  dd.querySelector('button').addEventListener('click',e=>{
    e.stopPropagation();
    document.querySelectorAll('.dd').forEach(d=>{ if(d!==dd) d.classList.remove('open'); });
    const open=!dd.classList.contains('open'); if(open) onOpen();
    dd.classList.toggle('open',open);
  });
}
document.addEventListener('click',e=>{ if(!e.target.closest('.dd'))
  document.querySelectorAll('.dd').forEach(d=>d.classList.remove('open')); });

function renderSprintMenu(){
  const dd=document.getElementById('ddSprints');
  dd.querySelector('.menu').innerHTML = SPRINTS.map(s=>
    `<label><input type="radio" name="sp" value="${s.id}" ${ST.sprints.includes(s.id)?'checked':''}>
      ${esc(s.name)}<span class="sm">${esc(s.start)} → ${esc(s.end)}${s.state==='active'?' · active':''}</span></label>`
  ).join('')||'<div class="state">no sprints</div>';
  dd.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
    switchTo(()=>{ ST.sprints=[+cb.value]; save(); });
  }));
}
function renderProjectMenu(){
  const dd=document.getElementById('ddProjects');
  dd.querySelector('.menu').innerHTML = PROJECTS.map(p=>
    `<label><input type="checkbox" value="${esc(p.key)}" ${ST.projects.includes(p.key)?'checked':''}>
      ${esc(p.key)}<span class="sm">${esc(p.name)}</span></label>`).join('')||'<div class="state">none</div>';
  dd.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
    ST.projects=[...dd.querySelectorAll('input:checked')].map(x=>x.value); save(); syncBtns(); load();
  }));
}
function syncBtns(){
  const picked=SPRINTS.filter(s=>ST.sprints.includes(s.id));
  const win = ST.from && ST.to;
  document.getElementById('ddSprints').querySelector('button').textContent =
    win ? 'date range' : (picked.length?picked[0].name:'Sprint');
  document.getElementById('clearWin').style.display = win ? '' : 'none';
  document.getElementById('ddProjects').querySelector('button').textContent =
    ST.projects.length===1?ST.projects[0]:(ST.projects.length?ST.projects.length+' projects':'Projects');
  const sb=document.getElementById('saveBtn');
  sb.textContent = saveLabel();
  sb.classList.toggle('primary', DIRTY && !SAVING);
  sb.classList.toggle('warn', !!SAVE_ERR);
  sb.title = SAVE_ERR ? 'Last autosave failed: ' + SAVE_ERR + ' - click to retry'
                      : 'Saves by itself every 5 seconds';
}

// The button is the only place autosave is visible, so it has to say which of the four
// states you are in - otherwise a failing save looks exactly like a saved one.
function saveLabel(){
  if(SAVING) return 'Saving…';
  if(SAVE_ERR) return 'Save failed ·';
  if(DIRTY) return 'Save ·';
  return SAVED_AT ? 'Saved ' + SAVED_AT : 'Saved';
}
function markDirty(){ DIRTY=true; syncBtns(); }

// ---- layout ---------------------------------------------------------------
// A bar occupies `days` WORKING days for its owner, so it steps over that person's leave,
// on-call and holidays. Five days of work across two days of leave really is seven days on
// the calendar, and a planner that hides that is a spreadsheet with colours.
// Spans are in FRACTIONAL day-index space: {from: 2.5, to: 3.75} is half past day two to
// three-quarters through day three. A span never crosses a day the owner is not working,
// which is what keeps "five days of work over two days of leave is seven days on the
// calendar" true at quarter-day resolution too.
function layout(task){
  const p = (D.people||[]).find(x=>x.canonical===task.who);
  const n = (D.days||[]).length;
  if(!p) return null;
  const at = posOf(task);
  if(at === null) return null;          // scheduled, but not in the window on screen
  let i = Math.floor(at);
  let frac = snapQ(at - i);
  if(i >= n) return null;
  // A task dropped on a day off starts at the next day its owner actually works.
  while(i < n && offFor(p, i)){ i++; frac = 0; }
  const spans = [];
  let left = Math.max(STEP, snapQ(task.days));
  let cur = null;
  while(i < n && left > EPS){
    if(offFor(p, i)){ if(cur){ spans.push(cur); cur = null; } i++; frac = 0; continue; }
    const room = 1 - frac;
    const take = Math.min(room, left);
    if(!cur) cur = {from: i + frac, to: i + frac + take};
    else cur.to += take;
    left -= take;
    if(take >= room - EPS){ i++; frac = 0; } else { frac += take; }
  }
  if(cur) spans.push(cur);
  return {spans, unplaced: left < EPS ? 0 : snapQ(left),
          end: spans.length ? spans[spans.length-1].to : at};
}

// Working-day length between two fractional positions, used when a resize asks "how long
// is this bar now?" - days off in the middle do not add to the estimate.
function workLen(p, from, to){
  if(to <= from) return 0;
  let n = 0;
  for(let i = Math.floor(from); i < Math.ceil(to); i++){
    if(offFor(p, i)) continue;
    const a = Math.max(from, i), b = Math.min(to, i + 1);
    if(b > a) n += b - a;
  }
  return n;
}
const loadOf = c => TASKS.filter(t=>t.who===c).reduce((a,t)=>a+(+t.sp||0),0);
// Backlog work is OUT of the sprint: it holds no days, draws no bar and moves no number.
// It is kept with the plan so it can come back, not so it can quietly count.
// A scheduled task carries the DAY it happens on, not an index into whatever window is
// on screen. That is what lets two overlapping windows show the same planned work, and
// what stops a plan looking empty because a different sprint is selected.
const dayIdx = date => (D && D.days ? D.days.findIndex(d=>d.date === date) : -1);
const dateAt = i => ((D && D.days && D.days[i]) ? D.days[i].date : '');

// Where this task sits in the CURRENT window, or null when it falls outside it.
function posOf(t){
  if(!t || !t.who || !t.date) return null;
  const i = dayIdx(t.date);
  if(i < 0) return null;
  return i + (snapQ(t.off) || 0);
}

const onBoard = () => TASKS.filter(t=>t.who && t.date);
// Only what is actually in view counts against the capacity shown beside it.
const inWindow = () => onBoard().filter(t=>posOf(t) !== null);
// What a person can actually absorb, in days of task work. NOT their calendar days: a
// senior at 0.55 has seven working days and four days of delivery in them, because the
// rest goes on review, design and other people. Planning seven days into that is how a
// sprint is overcommitted while every number on screen looks fine.
// Planning in EFFORT instead of in calendar days.
//
// Two points of work for someone at 0.5 efficiency occupies FOUR days on the board and
// still costs two against their capacity. Planning in days conflates those two numbers,
// which is how a senior's sprint looks full at four days of work and is actually empty.
let EFFORT = false;

const effOf = p => { const e = +((p||{}).eff); return e > 0 ? e : 1; };

// What a tile costs. An older tile carries no effort of its own, so its length is read as
// a span and converted - its size on the board does not change, and the number it
// contributes stops being a calendar day pretending to be work.
function effortOf(t, p){
  const sp = +t.sp;
  if(sp > 0) return sp;
  return snapQ((+t.days || 0) * effOf(p));
}

// How long that effort takes on the calendar.
function spanOf(sp, p){
  return Math.max(STEP, snapQ((+sp || 0) / effOf(p)));
}

// Typing an effort sets the tile's length from it, rather than the other way round.
function setEffort(id, value, people){
  const t = TASKS.find(x => x.id === id);
  if(!t) return null;
  const raw = parseFloat(String(value).replace(/[^0-9.]/g, ''));
  if(!isFinite(raw)) return null;
  const p = (people || []).find(x => x.canonical === t.who);
  const sp = Math.max(STEP, Math.min(60, snapQ(raw)));
  const days = spanOf(sp, p);
  if(Math.abs(sp - (+t.sp || 0)) < EPS && Math.abs(days - t.days) < EPS) return null;
  t.sp = sp;
  t.days = days;
  markDirty();
  return t;
}

const capOf = p => {
  const net = +p.net || 0;
  const eff = +p.eff;
  return (p.sp !== undefined && p.sp !== null) ? +p.sp
       : (eff > 0 ? Math.round(net * eff * 100) / 100 : net);
};

// What this person has been given. In effort mode that is the work; otherwise it is the
// days the tiles occupy, which is what the board has always counted.
function daysOf(c){
  const p = (D.people||[]).find(x=>x.canonical===c);
  return snapQ(inWindow().filter(t=>t.who===c)
    .reduce((a,t)=>a + (EFFORT ? effortOf(t, p) : (+t.days||0)), 0));
}

// A tile is in the backlog exactly when nobody owns it. There is no separate "parked"
// state: taking work out of the sprint is the same move as never having scheduled it -
// one concept instead of two, and one place to look for anything not in flight.
const CAT_NONE = 'Unsorted';
let CATS = [];

const backlog = () => TASKS.filter(t=>!t.who);

// Group the backlog the way it gets written down: headings, each with its tasks under it.
// Every heading that exists is listed, even an empty one - that is the point of making a
// heading before there is anything to put in it.
function byCategory(tasks, cats){
  const out = [];
  const find = name => {
    let g = out.find(x => x.cat.toLowerCase() === name.toLowerCase());
    if(!g){ g = {cat: name, tasks: []}; out.push(g); }
    return g;
  };
  (cats || []).forEach(c => find(String(c || '').trim() || CAT_NONE));
  (tasks || []).forEach(t => find((t.cat || '').trim() || CAT_NONE).tasks.push(t));
  return out;
}

// A heading is made once and kept, with or without anything under it, so a list can be
// set up before there is any work to put in it.
function addCategory(name){
  const n = String(name || '').trim().slice(0, 60);
  if(!n) return null;
  if(CATS.some(c => c.toLowerCase() === n.toLowerCase())) return null;
  CATS.push(n);
  markDirty();
  return n;
}

// Only when it is empty: a heading with work under it is deleted by moving the work first,
// which is a deliberate act rather than an accident of clicking the wrong ✕.
function removeCategory(name){
  const i = CATS.findIndex(c => c.toLowerCase() === String(name || '').toLowerCase());
  if(i < 0) return false;
  if(TASKS.some(t => (t.cat || '').toLowerCase() === String(name).toLowerCase())) return false;
  CATS.splice(i, 1);
  markDirty();
  return true;
}

// Drop a task on another heading and it moves there. Dropping a SCHEDULED task on a
// heading takes it off the board as well: dragging it into a list is saying it is not in
// the sprint any more, and leaving it both scheduled and filed away would be neither.
// Effort in days. Typed rather than dragged, because "1.5" is quicker to say than it is
// to mime with a mouse, and a backlog row has no bar to drag yet.
function setDays(id, value){
  const t = TASKS.find(x => x.id === id);
  if(!t) return null;
  const raw = parseFloat(String(value).replace(/[^0-9.]/g, ''));
  if(!isFinite(raw)) return null;
  const d = Math.max(STEP, Math.min(60, snapQ(raw)));
  if(Math.abs(d - t.days) < EPS) return null;
  t.days = d;
  markDirty();
  return t;
}

function recategorise(id, cat){
  const t = TASKS.find(x => x.id === id);
  const c = String(cat || '').trim();
  if(!t || !c) return null;
  if((t.cat || '') === c && !t.who) return null;
  t.cat = c;
  t.who = '';
  t.date = '';
  t.off = 0;
  addCategory(c);
  markDirty();
  return t;
}

function addNote(title, cat){
  const t = String(title || '').trim();
  if(!t) return null;
  const c = String(cat || '').trim() || CAT_NONE;
  addCategory(c);
  const note = {id:uid(), key:'', title:t, cat:c, who:'', date:'', off:0, days:1, sp:0,
                adhoc:true, tint:nextTint(TASKS)};
  TASKS.push(note);
  markDirty();
  return note;
}

// Take a task off the board. It keeps its name, length and category, so putting it back
// is one drag - and while it is off, it costs nobody any days.
function shelveTask(id){
  const t = TASKS.find(x=>x.id === id);
  if(!t || !t.who) return null;
  t.who = '';
  t.date = '';
  t.off = 0;
  markDirty();
  return t;
}

function placeTask(id, who, dayIndex){
  const t = TASKS.find(x=>x.id === id);
  if(!t) return null;
  const at = Math.max(0, snapQ(dayIndex) || 0);
  const date = dateAt(Math.floor(at));
  if(!date) return null;               // no such day in this window: nothing to pin it to
  if(who) t.who = who;
  t.date = date;
  t.off = snapQ(at - Math.floor(at));
  markDirty();
  return t;
}

function renderCards(){
  const ppl = D.people||[];
  const netDays = ppl.reduce((a,p)=>a+(+p.net||0),0);
  const cap = Math.round(ppl.reduce((a,p)=>a+capOf(p),0)*100)/100;
  const planned = snapQ(ppl.reduce((a,p)=>a+daysOf(p.canonical),0));
  const wd = (D.days||[]).filter(d=>!d.weekend && !d.holiday).length;
  // Against CAPACITY, not calendar days. Dividing by the calendar flatters every senior
  // on the team and reads under 100% while the sprint is already overcommitted.
  const util = cap ? Math.round(planned/cap*100) : 0;
  document.getElementById('cards').innerHTML = `<div class="cards">
    <div class="metric"><div class="l">Working days</div><div class="v">${wd}</div></div>
    <div class="metric"><div class="l">Team days</div><div class="v">${netDays}</div></div>
    <div class="metric" title="team days at each person's efficiency">
      <div class="l">Capacity</div><div class="v">${nq(cap)}</div></div>
    <div class="metric"><div class="l">Planned days</div>
      <div class="v ${planned>cap+EPS?'over':''}">${nq(planned)}</div></div>
    <div class="metric"><div class="l">Utilisation</div>
      <div class="v ${util>100?'over':''}">${util}%</div></div>
  </div>`;
}

function wireLeave(){
  if(!LEAVE) return;
  LeaveEditor.wire(document.getElementById('boardP'), {
    by: 'board',
    // The board has no toast of its own, and inventing one for this is more surface than
    // the message deserves: the button is right there and already says what mode it is in.
    toast: (msg, kind)=>{
      const b = document.getElementById('leaveBtn');
      if(!b) return;
      b.textContent = (kind === 'bad' ? '⚠ ' : '🌴 ') + msg;
      clearTimeout(b._t);
      b._t = setTimeout(()=>{
        b.textContent = LEAVE ? '🌴 Marking leave — click a day' : '🌴 Mark leave';
      }, 4000);
    },
    // Capacity is computed server side and cached per window, so the only honest way to
    // show the new numbers is to fetch them again.
    onChange: ()=> load(),
  });
}

      return `<td class="cell ${clsOf(s)}${off?'':' open'} ${

    }).join('');
    return `<tr data-w="${esc(p.canonical)}">
      <td class="nm" title="efficiency ${esc(p.eff)}">${esc(p.name)}<br>
        <span style="color:var(--muted);font-size:10px">${esc(p.role||'')}</span></td>
      ${cells}<td class="net">${net}d</td>
      <td class="net cap" title="${esc(net)} working days at ${esc(p.eff)} efficiency">${
        nq(cap)}d</td>
