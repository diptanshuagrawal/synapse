  }).join('');
  document.getElementById('boardP').innerHTML = `
    <div class="ph"><h2>${esc((D.sprints||[]).map(s=>s.name).join(' + '))}</h2>
      <span class="n">${esc(D.window.start)} → ${esc(D.window.end)} · ${people.length} people
        · click a tile to pick it, ⌘/shift-click for more, ← → to move them
        · <b class="selN">${SEL.size ? SEL.size + ' selected' : ''}</b></span></div>
    <div class="gwrap"><table class="g">
      <thead><tr><th class="nm">Person</th>${head}
        <th class="net" title="working days left in this window">Days</th>
        <th class="net cap" title="what those days deliver at this person's efficiency">Capacity</th>
        <th class="net load" title="task days planned onto this person">Planned</th></tr></thead>
      <tbody>${rows||`<tr><td class="state">no people</td></tr>`}</tbody></table></div>
    <div class="legend">
      <span><i class="sw c-avail"></i>available</span><span><i class="sw c-W"></i>WFH (counts)</span>
      <span><i class="sw c-O"></i>on-call</span><span><i class="sw c-L"></i>leave</span>
      <span><i class="sw c-H"></i>holiday</span><span><i class="sw c-WE"></i>weekend</span>
      <span style="color:var(--hint)">· click an available day to add a task · drag to move ·
      right edge to lengthen · ✕ to delete</span></div>`;
  paintBars(); wireCells(); wireLeave();
}

// ---- selection ------------------------------------------------------------------
// Picking up several tiles at once and nudging them along. A day slips and everything
// after it has to move; doing that one bar at a time is how a plan stops being kept up.
let SEL = new Set();
let SEL_ANCHOR = '';
let DRAGGING = '';       // the tile under the pointer, so a repaint keeps it looking held

// Every quarter-day this person actually works, in order. Moving "one day" means one of
// their working days, not one square of calendar - the same rule the bars are drawn by.
function slots(p, n){
  const out = [];
  for(let i = 0; i < n; i++){
    if(offFor(p, i)) continue;
    for(let q = 0; q < 4; q++) out.push(snapQ(i + q * STEP));
  }
  return out;
}

// A pointer sitting on a quarter boundary used to flip the tile between two cells on
// every stray pixel - the shiver. A move only counts once the pointer is clearly past
// the next notch, and the tile then LATCHES there and stays put until the next one.
const LATCH = 0.62;      // how far into the next quarter the pointer has to get
function latch(from, want){
  const d = want - from;
  if(Math.abs(d) < LATCH) return from;
  return from + (d > 0 ? Math.floor(d + (1 - LATCH)) : Math.ceil(d - (1 - LATCH)));
}

// Where the pointer is, in this person's working quarters, as a fraction - so the dead
// zone can be measured against it rather than against a value already rounded off.
function slotPos(s, pos){
  if(!s.length) return 0;
  if(pos <= s[0]) return 0;
  for(let i = 0; i < s.length - 1; i++){
    if(pos >= s[i] && pos < s[i + 1]){
      const span = s[i + 1] - s[i];
      return i + (span > 0 ? Math.min(1, (pos - s[i]) / span) : 0);
    }
  }
  return s.length - 1;
}

function slotIndex(s, pos){
  for(let i = 0; i < s.length; i++) if(Math.abs(s[i] - pos) < EPS) return i;
  for(let i = 0; i < s.length; i++) if(s[i] > pos) return i;
  return s.length - 1;
}

// How far a whole selection can move together. Clamping each bar on its own would squash
// them against the edge and lose the spacing the plan is made of, so the one that runs
// out of room first decides for all of them.
function shiftBy(tasks, dq, people, n){
  if(!tasks.length || !dq) return 0;
  let room = Math.abs(dq);
  for(const t of tasks){
    const p = (people || []).find(x => x.canonical === t.who);
    if(!p) return 0;
    const s = slots(p, n);
    const at = slotIndex(s, posOf(t));
    room = Math.min(room, dq > 0 ? (s.length - 1 - at) : at);
  }
  return (dq > 0 ? 1 : -1) * room;
}

// Person ids are slugs, but don't lean on CSS.escape being there: it is missing in the test
// DOM, and a selector that throws takes the whole repaint down with it.
const cssEsc = v => (window.CSS && CSS.escape) ? CSS.escape(String(v))
                                               : String(v).replace(/["\\]/g, '\\$&');

// One hue per task, derived from its id so it survives a repaint, a reload and a drag.
// Six tints, because beyond that they stop being distinguishable at 10px.
const BAR_TINTS = 6;

// Chosen when the task is created and stored with it, so it survives a reload and a drag.
// Least-used wins, which is what stops seven tasks landing on four colours.
function nextTint(tasks){
  const n = new Array(BAR_TINTS + 1).fill(0);
  (tasks || []).forEach(t => { const c = +t.tint; if(c >= 1 && c <= BAR_TINTS) n[c]++; });
  let best = 1;
  for(let i = 2; i <= BAR_TINTS; i++) if(n[i] < n[best]) best = i;
  return best;
}

// Older saved plans and ticket-backed bars have no stored tint, so fall back to the id.
function tintFor(id){
  const s = String(id || '');
  let h = 0;
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return (h % BAR_TINTS) + 1;
}

// Splitting a label across the segments of a bar.
//
// Two rules, and the second is the one that matters. First, text WRAPS inside a segment,
// so this cannot be done by shifting pixels: each segment is handed as much text as
// actually fits and passes the remainder on. Second, a segment takes as FEW lines as it
// can: filling the narrow first cell with three cramped lines while the wide cell beside
// it sits empty is worse than one line in each. So the pack is tried at one line per
// segment, then two, and the first height that holds the whole name wins.
//
// `fits` is a predicate per segment, which is what keeps this testable without a browser:
// the page backs it with a real measurement, the tests with a character count.
// How much of `rest` this one segment can take.
function packOne(rest, fit, strict){
  if(!rest) return {chunk: '', rest: ''};
  if(fit(rest)) return {chunk: rest, rest: ''};
  let lo = 0, hi = rest.length;
  while(lo < hi){
    const mid = Math.ceil((lo + hi) / 2);
    if(fit(rest.slice(0, mid))) lo = mid; else hi = mid - 1;
  }
  if(lo <= 0) return {chunk: '', rest};   // segment too small for even one character
  let n = lo;
  // Break on a word, so a day boundary does not fall mid-word ("instrum" / "ent").
  // In the strict pass any word boundary will do, even a wasteful one; it is only when no
  // line count can place the whole name on whole words that a mid-word break is allowed,
  // and then only if the boundary would not waste over half the segment.
  const sp = rest.lastIndexOf(' ', n);
  if(sp > 0 && (strict || sp >= n / 2)) n = sp;
  return {chunk: rest.slice(0, n), rest: rest.slice(n).replace(/^\s+/, '')};
}

function packChunks(text, fits, strict){
  const out = [];
  let rest = String(text == null ? '' : text);
  for(let i = 0; i < fits.length; i++){
    const r = packOne(rest, fits[i], strict);
    out.push(r.chunk);
    rest = r.rest;
  }
  return {out, rest};
}

// Ran out of bar before running out of name: say so on the last segment rather than
// stopping mid-word as though that were the whole title.
function markCut(out, fits){
  const last = fits.length - 1;
  if(last < 0) return out;
  const fit = fits[last];
  let t = out[last];
  while(t.length && !fit(t + '…')) t = t.slice(0, -1);
  out[last] = t + '…';
  return out;
}

// Within a line budget that works, every segment takes the FEWEST lines it can while the
// remainder still fits in the segments after it. Without this a narrow first cell that
// happens to hold the whole name keeps it, stacked, with the wide cell beside it empty -
// which is the thing that looks wrong on the board.
function spreadChunks(text, fitsFor, budget, strict){
  const preds = fitsFor(budget);
  const out = [];
  let rest = String(text == null ? '' : text);
  for(let i = 0; i < preds.length; i++){
    const tail = preds.slice(i + 1);
    let taken = null;
    for(let lines = 1; lines <= budget; lines++){
      const r = packOne(rest, fitsFor(lines)[i], strict);
      if(!r.rest || !packChunks(r.rest, tail, strict).rest){ taken = r; break; }
    }
    if(!taken) taken = packOne(rest, preds[i], strict);
    out.push(taken.chunk);
    rest = taken.rest;
  }
  return {out, rest};
}

function flowChunks(text, fitsFor, maxLines){
  const top = Math.max(1, maxLines || 1);
  // Pass one: whole words only, fewest lines first. Pass two: the same search, now
  // allowing a mid-word break, for names no arrangement of whole words can hold.
  for(const strict of [true, false]){
    for(let lines = 1; lines <= top; lines++){
      if(packChunks(text, fitsFor(lines), strict).rest) continue;
      const spread = spreadChunks(text, fitsFor, lines, strict);
      if(!spread.rest) return spread.out;
      return packChunks(text, fitsFor(lines), strict).out;
    }
  }
  return markCut(packChunks(text, fitsFor(top), false).out, fitsFor(top));
}

// True when the text does not overflow the box it was put in - in BOTH directions, and
// within the line budget being tried. Height alone is not enough: a word longer than the
// line can run out of the side while the height still looks fine.
function labelFits(lbl, box, lines, lineH){
  const cap = Math.min(box.clientHeight, Math.round(lines * lineH));
  return lbl.scrollHeight <= cap + 1
      && lbl.scrollWidth <= box.clientWidth + 1;
}

function flowLabel(boxes, text){
  const els = Array.from(boxes || []);
  if(!els.length) return;
  const lbls = els.map(b => b.querySelector('.lbl'));
  const first = lbls.find(Boolean);
  const lineH = first ? (parseFloat(getComputedStyle(first).lineHeight) || 12) : 12;
  const maxLines = Math.max(1, Math.floor(els[0].clientHeight / lineH));
  const fitsFor = lines => els.map((box, i) => str => {
    const lbl = lbls[i];
    if(!lbl) return true;
    lbl.textContent = str;
    return labelFits(lbl, box, lines, lineH);
  });
  const parts = flowChunks(text, fitsFor, maxLines);
  lbls.forEach((lbl, i) => { if(lbl) lbl.textContent = parts[i] || ''; });
}

function selectedTasks(){
  return TASKS.filter(t => SEL.has(t.id) && posOf(t) !== null);
}

// Move every selected tile by `dq` quarter-days of its owner's working time.
function shiftSelection(dq){
  const picked = selectedTasks();
  const n = (D.days || []).length;
  const step = shiftBy(picked, dq, D.people || [], n);
  if(!step) return 0;
  picked.forEach(t => {
    const p = (D.people || []).find(x => x.canonical === t.who);
    const s = slots(p, n);
    const pos = s[Math.max(0, Math.min(s.length - 1, slotIndex(s, posOf(t)) + step))];
    t.date = dateAt(Math.floor(pos));
    t.off = snapQ(pos - Math.floor(pos));
  });
  markDirty();
  return step;
}

function selectTask(id, mode){
  if(mode === 'toggle'){
    if(SEL.has(id)) SEL.delete(id); else SEL.add(id);
    SEL_ANCHOR = id;
    return;
  }
  if(mode === 'range' && SEL_ANCHOR){
    // A range means "this run of work", so it is taken along ONE person's row in the
    // order the bars sit on the calendar, not in whatever order they were created.
    const a = TASKS.find(t => t.id === SEL_ANCHOR);
    const b = TASKS.find(t => t.id === id);
    if(a && b && a.who === b.who){
      const row = TASKS.filter(t => t.who === a.who && posOf(t) !== null)
                       .sort((x, y) => posOf(x) - posOf(y));
      const i = row.findIndex(t => t.id === a.id), j = row.findIndex(t => t.id === b.id);
      if(i >= 0 && j >= 0){
        row.slice(Math.min(i, j), Math.max(i, j) + 1).forEach(t => SEL.add(t.id));
        return;
      }
    }
  }
  SEL = new Set([id]);
  SEL_ANCHOR = id;
}

function clearSel(){ SEL = new Set(); SEL_ANCHOR = ''; }

// Selection changes the ring, not the layout, so it is painted in place. Repainting the
// whole board for a click replaced the very element a double-click was landing on, which
// broke rename - the kind of thing that only shows up when a person uses it.
function paintSel(){
  document.querySelectorAll('#boardP .bar').forEach(b=>{
    b.classList.toggle('sel', SEL.has(b.dataset.id));
  });
  const n = document.querySelector('#boardP .ph .n .selN');
  if(n) n.textContent = SEL.size ? SEL.size + ' selected' : '';
}

// Redraw ONE task. Dragging used to rebuild every bar on the board for every change,
// which threw away the grip under the cursor several times a second - the flicker you can
// feel but a synthetic wobble never notices, because it has no cursor to lose.
function drawTask(t){
  document.querySelectorAll(`#boardP .bar[data-id="${cssEsc(t.id)}"]`).forEach(b=>b.remove());
  const who = (D.people||[]).find(x=>x.canonical===t.who);
  const lay = layout(t);
  if(lay){
    lay.spans.forEach((sp,idx)=>{
      // A span starts inside a cell, not at its edge: the bar hangs off the cell its
      // quarter falls in, offset by the rest of that quarter.
      const cell = Math.floor(sp.from + EPS);
      const off = sp.from - cell;
      const td = document.querySelector(
        `#boardP td.cell[data-w="${cssEsc(t.who)}"][data-i="${cell}"]`);
      if(!td) return;
      const w = sp.to - sp.from;
      const el = document.createElement('div');
      const tint = (+t.tint >= 1 && +t.tint <= BAR_TINTS) ? +t.tint : tintFor(t.id);
      el.className = 'bar' + (tint > 1 ? ' c' + tint : '') + (lay.unplaced ? ' spill' : '')
                   + (SEL.has(t.id) ? ' sel' : '')
                   + (DRAGGING === t.id ? ' drag' : '');
      // Cells are separated by a 1px border, so a bar covering `w` days of grid has to
      // span the borders it crosses as well as the cells themselves.
      const crossed = Math.max(0, Math.ceil(off + w) - 1);
      el.style.left = off ? `calc(${off} * 100% + 1px)` : '1px';
      el.style.width = `calc(${w} * 100% + ${crossed}px - 2px)`;
      el.dataset.id = t.id;
      el.title = `${t.key?t.key+' · ':''}${t.title}\n${
        EFFORT ? nq(effortOf(t, who)) + ' effort over ' : ''}${nq(t.days)} working day(s)${
        t.key?'':' · double-click to rename'}${
        lay.unplaced?` · ${nq(lay.unplaced)} day(s) do not fit before the sprint ends`:''}`;
      // Every segment carries the WHOLE label. A weekend splits the bar, not the words:
      // the continuation segments shift the same text left by however much already showed,
      // so "Cheque instruction" reads on across the gap instead of turning into an ellipsis.
      el.innerHTML = `<span class="lblw"><span class="lbl"></span></span>`
        + (idx===0 && EFFORT
            ? `<span class="eff" data-e="${t.id}" title="effort · click to change">${
                 nq(effortOf(t, who))}</span>` : '')
        + (idx===0 ? `<span class="x" data-x="${t.id}">✕</span>` : '')
        + (idx===lay.spans.length-1 ? '<span class="grip"></span>' : '');
      td.appendChild(el);
    });
    flowLabel(document.querySelectorAll(`#boardP .bar[data-id="${cssEsc(t.id)}"] .lblw`),
              t.key ? t.key + ' · ' + t.title : t.title);
  }
  wireBar(document.querySelectorAll(`#boardP .bar[data-id="${cssEsc(t.id)}"]`));
}

function paintBars(){
  document.querySelectorAll('#boardP .bar').forEach(b=>b.remove());
  onBoard().forEach(drawTask);
}

// Move a tile that is ALREADY on screen without rebuilding it: set two style properties
// and nothing else. Recreating the element meant re-splitting its label on every step,
// and that measurement forces a layout each time - a dozen of them per frame while the
// hand is moving, which is what the flicker actually was. Returns false when the shape
// changed (a weekend split it, or it moved to another person), and the caller redraws.
function nudgeTask(t){
  const els = Array.from(document.querySelectorAll(`#boardP .bar[data-id="${cssEsc(t.id)}"]`));
  const lay = layout(t);
  if(!lay || !els.length || lay.spans.length !== els.length) return false;
  const geo = [];
  for(let i = 0; i < lay.spans.length; i++){
    const sp = lay.spans[i];
    const cell = Math.floor(sp.from + EPS);
    const td = els[i].parentElement;
    if(!td || +td.dataset.i !== cell || td.dataset.w !== t.who) return false;
    const off = sp.from - cell, w = sp.to - sp.from;
    geo.push([off, w, Math.max(0, Math.ceil(off + w) - 1)]);
  }
  // Every read is done before any write, so the browser lays out once rather than once
  // per bar.
  els.forEach((el, i) => {
    const [off, w, crossed] = geo[i];
    el.style.left = off ? `calc(${off} * 100% + 1px)` : '1px';
    el.style.width = `calc(${w} * 100% + ${crossed}px - 2px)`;
    el.classList.toggle('spill', !!lay.unplaced);
  });
  els[0].title = `${t.key ? t.key + ' · ' : ''}${t.title}\n${nq(t.days)} working day(s)${
    t.key ? '' : ' · double-click to rename'}${
    lay.unplaced ? ` · ${nq(lay.unplaced)} day(s) do not fit before the sprint ends` : ''}`;
  return true;
}

// During a drag: nudge if the shape allows, redraw only if it does not.
function liveTask(t){ if(!nudgeTask(t)) drawTask(t); }

function renderBacklog(){
  const groups = byCategory(backlog(), CATS);
  const n = backlog().length;
  // The plan is one list across every sprint and window, so work scheduled on days this
  // window does not cover still exists. Say how much, rather than letting it look lost.
  const elsewhere = onBoard().length - inWindow().length;
  document.getElementById('backP').innerHTML = `
    <div class="ph"><h2>Backlog</h2>
      <span class="n">${n ? n + ' waiting' : 'nothing yet'} in ${groups.length}
        categor${groups.length===1?'y':'ies'}${elsewhere ? ' · ' + elsewhere +
          ' scheduled outside this window' : ''}
        · drag a task onto a day to schedule it, drag it back to take it out</span></div>
    <div id="back" class="backlog">${groups.map((g,gi)=>`
      <div class="cat" data-cat="${esc(g.cat)}">
        <div class="cath">${esc(g.cat)}<span class="n">${g.tasks.length}</span>
          ${g.tasks.length ? '' :
            `<button class="catx" data-delcat="${esc(g.cat)}" title="remove this empty heading"
             type="button">✕</button>`}</div>
        <div class="rows">${g.tasks.map(t=>
          `<div class="row note" draggable="true" data-id="${esc(t.id)}"
            title="${esc(t.title)} · ${nq(t.days)} day(s) · drag onto a day to schedule it">
            <span class="grab">⠿</span>
            <span class="rt">${t.key?`<b>${esc(t.key)}</b> `:''}${esc(t.title)}</span>
            <span class="sp">${nq(t.days)}d</span>
            <span class="x" data-x="${esc(t.id)}" title="delete">✕</span></div>`).join('')}</div>
        <form class="addrow" data-addto="${esc(g.cat)}">
          <input placeholder="add to ${esc(g.cat)}…" autocomplete="off" data-ci="${gi}">
        </form>
      </div>`).join('')}
      <form class="addcat" id="addcat">
        <input id="catIn" placeholder="+ new category" autocomplete="off">
      </form>
    </div>`;

  // One input per heading: make the heading once, then keep typing under it. The box keeps
  // focus after each line, so a list comes out as fast as it would in a text file.
  document.querySelectorAll('#back .addrow').forEach(f=>f.addEventListener('submit', e=>{
    e.preventDefault();
    const box = f.querySelector('input');
    if(!addNote(box.value, f.dataset.addto)) return;
    const at = box.dataset.ci;
    renderBacklog();
    const again = document.querySelector(`#back .addrow input[data-ci="${at}"]`);
    if(again) again.focus();
  }));
  document.getElementById('addcat').addEventListener('submit', e=>{
    e.preventDefault();
    const box = document.getElementById('catIn');
    if(!addCategory(box.value)) { box.value = ''; return; }
    renderBacklog();
    const made = document.querySelectorAll('#back .addrow input');
    if(made.length) made[made.length-1].focus();
  });
  document.querySelectorAll('#back .catx').forEach(b=>b.addEventListener('click', e=>{
    e.preventDefault();
    if(removeCategory(b.dataset.delcat)) renderBacklog();
  }));
  // A heading accepts a drop. Without preventDefault on BOTH dragover and drop the
  // browser treats the add box as a text field and pastes the drag payload into it.
  document.querySelectorAll('#back .cat').forEach(box=>{
    const over = e=>{
      e.preventDefault();
      document.querySelectorAll('#back .cat.into').forEach(x=>x.classList.remove('into'));
      box.classList.add('into');
    };
    box.addEventListener('dragover', over);
    box.addEventListener('dragenter', over);
    box.addEventListener('dragleave', ()=>box.classList.remove('into'));
    box.addEventListener('drop', e=>{
      e.preventDefault();
      box.classList.remove('into');
      let payload; try{ payload = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
      if(!payload || payload.from !== 'backlog') return;
      if(!recategorise(payload.id, box.dataset.cat)) return;
      renderCards(); renderBacklog(); renderTray(); renderBoard();
    });
  });
  // Click the name to rename, click the days to re-estimate. The row is draggable, so
  // the editor has to turn that off while it is open or the browser starts a drag the
  // moment you try to select text.
  document.querySelectorAll('#back .row.note .rt, #back .row.note .sp').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      openRowEditor(el.closest('.row.note'), el.classList.contains('sp') ? 'days' : 'title');
    });
  });
  document.querySelectorAll('#back .row.note').forEach(c=>{
    c.addEventListener('dragstart', e=>{
      if(c.querySelector('input.rowin')){ e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', JSON.stringify({from:'backlog', id:c.dataset.id}));
    });
    c.querySelectorAll('.x').forEach(x=>x.addEventListener('click', e=>{
      e.stopPropagation();
      TASKS = TASKS.filter(t=>t.id !== x.dataset.x);
      markDirty(); renderBacklog(); renderCards();
    }));
  });
}

function renderTray(){
  const placed = new Set(TASKS.map(t=>t.key).filter(Boolean));
  const free = (D.tickets||[]).filter(t=>!placed.has(t.key) && !t.cancelled);
  document.getElementById('trayP').innerHTML = `
    <div class="ph"><h2>Sprint tickets not yet placed</h2>
      <span class="n">${free.length} of ${(D.tickets||[]).length} · drag one onto a day</span></div>
    <div class="tray" id="tray">${free.map(t=>
      `<span class="chip${t.done?' done':''}" draggable="true" data-k="${esc(t.key)}"
        title="${esc(t.summary)}${t.assignee?' · '+esc(t.assignee):''}">
        <b>${esc(t.key)}</b> ${esc(t.summary.slice(0,32))}<span class="sp">${n1(t.sp)}</span></span>`
      ).join('') || '<span class="state">everything is placed</span>'}</div>`;
  document.querySelectorAll('#tray .chip').forEach(c=>c.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', JSON.stringify({from:'tray', key:c.dataset.k}));
  }));
}

// ---- interaction ----------------------------------------------------------
// The pointer is over the backlog. Bars are dragged with pointer events, not HTML5
// drag-and-drop, so the list cannot just listen for a drop - the drag has to ask.
function overBacklog(x, y){
  const el = document.elementFromPoint(x, y);
  return !!(el && el.closest && el.closest('#back'));
}

// Which heading the pointer is over, if any, so a bar dropped on one is filed there
// rather than just dropped back wherever it came from.
function catAt(x, y){
  const el = document.elementFromPoint(x, y);
  const cat = el && el.closest ? el.closest('#back .cat') : null;
  return cat ? cat.dataset.cat : '';
}

// Where the pointer is, to the nearest quarter day. `i` stays the whole-cell index for
// anything that only cares which day it is; `pos` is the fractional position used by the
// drag and the resize.
// Which quarter of a cell a drop landed in, so a note can be dropped at half past a day.
function quarterAt(x, td){
  const r = td.getBoundingClientRect();
  if(!r.width) return 0;
  return snapQ(Math.min(0.75, Math.max(0, (x - r.left) / r.width)));
}

// Which cell a pixel falls in, given the row's first cell and the uniform column width.
// Pure, because the rule it encodes is the one that was wrong: it must keep counting past
// the end of a bar rather than saturating at the cell the bar happens to start in.
function cellIndexAt(x, left, width, count){
  if(!(width > 0) || !count) return -1;
  const i = Math.floor((x - left) / width);
  return Math.max(0, Math.min(count - 1, i));
}

function cellAt(x,y){
  const el = document.elementFromPoint(x,y);
  const tr = el && el.closest ? el.closest('#boardP tr[data-w]') : null;
  if(!tr) return null;
  const cells = tr.querySelectorAll('td.cell');
  if(!cells.length) return null;
  // The WHICH-CELL question is answered by geometry, not by what the hit test landed on.
  // A bar is absolutely positioned over every cell it spans, so as soon as it grows under
  // the pointer, asking the hit element for its cell returns the one the bar STARTS in -
  // and the offset inside it clamps at the far edge. Dragging right then reads as the
  // length collapsing, which is why the tile jumped backwards while the hand went
  // forwards. The row is all the hit test is needed for.
  const first = cells[0].getBoundingClientRect();
  if(!first.width) return null;
  const i = cellIndexAt(x, first.left, first.width, cells.length);
  if(i < 0) return null;
  const r = cells[i].getBoundingClientRect();
  const within = r.width ? Math.min(0.999, Math.max(0, (x - r.left) / r.width)) : 0;
  // `raw` is the pointer where it actually is. `pos` is it rounded to the grid. A drag
  // needs the raw one: measuring a dead zone against an already-rounded value means a
  // two-pixel wobble across a boundary reads as a whole quarter, which IS the shiver.
  return {who: tr.dataset.w, i, raw: i + within,
          pos: i + snapQ(within), within: snapQ(within)};
}

// Click an available day, type a name, Enter. The whole point is that adding a task costs
// one click and no dialog — a modal here would make the grid feel like a form.
// The commit path, named so a test can drive the SAME code the Enter key runs. Hiding it
// inside the keydown closure is how the first version shipped with Enter doing nothing:
// the editor opened, the input cleared, and no task was created, and nothing could catch it.
function addTaskAt(who, dayIndex, title, extra){
  const t = String(title || '').trim();
  if(!who || !t) return null;
  const at = Math.max(0, snapQ(dayIndex) || 0);
  const task = Object.assign({id:uid(), key:'', title:t, who, date:dateAt(Math.floor(at)),
                              off:snapQ(at - Math.floor(at)), days:1, sp:0,
                              adhoc:true, tint:nextTint(TASKS)}, extra || {});
  TASKS.push(task);
  markDirty();
  return task;
}

// Renaming is its own named step for the same reason creating is: the only way to be sure
// the shipped path works is for a test to call exactly what the keyboard calls.
const DOUBLE_TAP_MS = 400;
let LAST_TAP = null;
function isDoubleTap(id, now){
  const t = now === undefined ? Date.now() : now;
  const yes = !!LAST_TAP && LAST_TAP.id === id && (t - LAST_TAP.t) <= DOUBLE_TAP_MS;
  LAST_TAP = yes ? null : {id, t};   // a third tap starts a fresh pair, not another rename
  return yes;
}

// Opens the rename editor over a bar. Returns false for a ticket-backed bar: it is
// labelled by its Jira key, so renaming it here would change nothing you can see.
function startRename(bar){
  const t = TASKS.find(x => x.id === bar.dataset.id);
  if(!t || t.key) return false;
  const cell = bar.closest('td.cell');
  if(!cell) return false;
  openEditor(cell, t);
  return true;
}

function renameTask(id, title){
  const t = TASKS.find(x=>x.id === id);
  const v = String(title || '').trim();
  if(!t || !v || v === t.title) return null;
  t.title = v;
  markDirty();
  return t;
}

// One editor for both fields. Named and separate from the click handler for the same
// reason every other commit path here is: a test has to be able to drive what the mouse
// drives, not a copy of it.
function openEffort(bar, chip){
  if(bar.querySelector('input.effin')) return null;
  const t = TASKS.find(x => x.id === bar.dataset.id);
  if(!t) return null;
  const was = chip.textContent;
  const inp = document.createElement('input');
  inp.className = 'effin';
  inp.value = was;
  chip.textContent = '';
  chip.appendChild(inp);
  inp.focus(); inp.select();
  bar.draggable = false;
  let closed = false;
  const close = ok=>{
    if(closed) return;
    closed = true;
    inp.removeEventListener('blur', onBlur);
    const changed = ok && setEffort(t.id, inp.value, D.people || []);
    // The person's Planned cell lives in the table, not in the bars, so repainting only
    // the tiles left the row saying one thing and the card above it another.
    if(changed){ renderCards(); renderBoard(); }
    else { chip.textContent = was; }
  };
  const onBlur = ()=>close(true);
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key === 'Escape'){ close(false); return; }
    if(e.key === 'Enter'){ e.preventDefault(); close(true); }
  });
  inp.addEventListener('blur', onBlur);
  return inp;
}

function openRowEditor(row, field){
  if(!row || row.querySelector('input.rowin')) return null;
  const t = TASKS.find(x => x.id === row.dataset.id);
  if(!t) return null;
  const slot = row.querySelector(field === 'days' ? '.sp' : '.rt');
  if(!slot) return null;
  const was = slot.innerHTML;
  const inp = document.createElement('input');
  inp.className = 'rowin' + (field === 'days' ? ' days' : '');
  inp.value = field === 'days' ? nq(t.days) : t.title;
  row.draggable = false;
  slot.innerHTML = '';
  slot.appendChild(inp);
  inp.focus();
  inp.select();
  let closed = false;
  const close = ok=>{
    if(closed) return;
    closed = true;
    inp.removeEventListener('blur', onBlur);
    const changed = ok && (field === 'days' ? setDays(t.id, inp.value)
                                            : renameTask(t.id, inp.value));
    row.draggable = true;
    if(changed){ renderBacklog(); renderCards(); }
    else { slot.innerHTML = was; }
  };
  const onBlur = ()=>close(true);
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key === 'Escape'){ close(false); return; }
    if(e.key === 'Enter'){ e.preventDefault(); close(true); }
  });
  inp.addEventListener('blur', onBlur);
  return inp;
}

function openEditor(td, task){
  if(td.querySelector('.cellin')) return;
  const inp = document.createElement('input');
  inp.className = 'cellin';
  inp.placeholder = 'task name…';
  if(task) inp.value = task.title || '';
  td.appendChild(inp);
  inp.focus();
  if(task) inp.select();   // rename starts with the old name selected, so typing replaces it
  // Removing a focused input fires blur, which calls close() again from INSIDE the first
  // remove(), and the second remove() throws NotFoundError - taking the rest of the Enter
  // handler down with it, so the task was never created. Close once, and only once.
  let closed = false;
  const close = ()=>{
    if(closed) return;
    closed = true;
    inp.removeEventListener('blur', close);
    if(inp.parentNode) inp.remove();
  };
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key === 'Escape'){ close(); return; }
    if(e.key !== 'Enter') return;
    // Commit first, close second: a throw on the way out must not lose what was typed.
    const done = task ? renameTask(task.id, inp.value)
                      : addTaskAt(td.dataset.w, td.dataset.i, inp.value);
    close();
    if(done){ renderCards(); renderBoard(); }
  });
  inp.addEventListener('blur', close);
  inp.addEventListener('pointerdown', e=>e.stopPropagation());
}

function wireCells(){
  document.querySelectorAll('#boardP td.cell').forEach(td=>{
    if(td.classList.contains('open')){
      td.addEventListener('click', e=>{
        if(e.target.closest('.bar') || e.target.closest('.cellin')) return;
        openEditor(td);
      });
    }
    td.addEventListener('dragover', e=>e.preventDefault());
    td.addEventListener('drop', e=>{
      e.preventDefault();
      let payload; try{ payload = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
      if(payload && payload.from === 'backlog'){
        const at = +td.dataset.i + (quarterAt(e.clientX, td) || 0);
        if(!placeTask(payload.id, td.dataset.w, at)) return;
        renderCards(); renderBacklog(); renderTray(); renderBoard();
        return;
      }
      if(!payload || payload.from !== 'tray') return;
      const tk = (D.tickets||[]).find(x=>x.key===payload.key);
      if(!tk) return;
      // Default length is the SP floored at one day: an unestimated ticket gets a visible,
      // obviously-wrong bar rather than a zero-width one that cannot be grabbed to fix.
      TASKS.push({id:uid(), key:tk.key, title:tk.summary, who:td.dataset.w,
                  date:dateAt(+td.dataset.i), off:quarterAt(e.clientX, td) || 0,
                  days:Math.max(STEP, snapQ(tk.sp||1)), sp:tk.sp||0, adhoc:false, cat:''});
      markDirty(); renderCards(); renderBacklog(); renderTray(); renderBoard();
    });
  });
}

function wireBars(){ wireBar(document.querySelectorAll('#boardP .bar')); }

function wireBar(bars){
  Array.from(bars).forEach(bar=>{
    // Click the number to type an effort. It sets the tile's LENGTH from that effort,
    // which is the whole point: you say how much work it is, the board says how long it
    // takes this person.
    bar.querySelectorAll('.eff').forEach(c=>{
      c.addEventListener('pointerdown', e=>e.stopPropagation());
      c.addEventListener('click', e=>{ e.stopPropagation(); openEffort(bar, c); });
    });
    bar.querySelectorAll('.x').forEach(x=>x.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      TASKS = TASKS.filter(t=>t.id !== x.dataset.x);
      markDirty(); renderCards(); renderBacklog(); renderTray(); renderBoard();
    }));
    bar.addEventListener('dblclick', e=>{   // keyboard/assistive double-activation
      if(!e.target.closest('.x')) startRename(bar);
    });
    bar.addEventListener('pointerdown', e=>{
      if(e.target.closest('.x')) return;
      const t = TASKS.find(x=>x.id===bar.dataset.id);
      if(!t) return;
      const resize = !!e.target.closest('.grip');
      // A real double-click on a bar never reaches a dblclick listener: the drag below
      // preventDefault()s this pointerdown, which suppresses the compatibility mouse
      // events. So count the taps here, before the drag starts.
      if(!resize && isDoubleTap(t.id) && startRename(bar)) return;
      // Modifier clicks pick tiles rather than dragging them: holding one and dragging
      // would otherwise both extend the selection and move it, which is neither.
      if(!resize && (e.metaKey || e.ctrlKey || e.shiftKey)){
        e.preventDefault();
        selectTask(t.id, (e.metaKey || e.ctrlKey) ? 'toggle' : 'range');
        paintSel();
        return;
      }
      if(!resize && !SEL.has(t.id)){ selectTask(t.id, 'one'); paintSel(); }
      const from = cellAt(e.clientX, e.clientY);
      if(!from) return;
      e.preventDefault();
      const o = {id:t.id, start:posOf(t), grab:from.raw, resize};
      if(o.start === null) return;
      DRAGGING = o.id;
      bar.classList.add('drag');
      const tab = document.querySelector('#boardP table.g');
      try{ tab.setPointerCapture(e.pointerId); }catch(_){}
      // Pointer events arrive far faster than the screen refreshes, and each one used to
      // rebuild every bar on the board - including the one under the cursor, which is why
      // the tile being dragged kept being replaced mid-drag. Keep the last event, act once
      // per frame's worth of time.
      //
      // Deliberately a timer rather than requestAnimationFrame: rAF does not fire in a
      // background tab, and does not fire at all on a machine whose display link is
      // unavailable - the drag would simply freeze. A 16ms timer is close enough to a
      // frame and always runs.
      const FRAME_MS = 16;
      let pending = null, frame = 0;
      const apply = ()=>{
        frame = 0;
        const ev = pending; pending = null;
        if(!ev) return;
        const back = document.getElementById('back');
        if(back) back.classList.toggle('hot', !o.resize && overBacklog(ev.clientX, ev.clientY));
        const c = cellAt(ev.clientX, ev.clientY);
        if(!c) return;
        const t2 = TASKS.find(x=>x.id===o.id); if(!t2) return;
        const p = (D.people||[]).find(x=>x.canonical===t2.who);
        if(o.resize){
          // Length is counted in the owner's WORKING days, so dragging across their leave
          // does not quietly inflate the estimate.
          //
          // The length is simply where the pointer is, measured from the start. Adding a
          // quarter first - which is what this used to do, to compensate for a pointer
          // that had already been rounded down - biased every drag by up to a quarter and
          // made the bar jump a step ahead of the hand.
          const end = Math.max(o.start, c.raw);
          const want = workLen(p, o.start, end) / STEP;
          const q = Math.max(1, Math.round(latch(t2.days / STEP, want)));
          const nd = snapQ(q * STEP);
          if(Math.abs(nd - t2.days) > EPS){
            t2.days = nd;
            // Dragging the edge in effort mode is still saying how much work it is: the
            // length is what changed, so the effort follows from it.
            if(EFFORT) t2.sp = snapQ(nd * effOf(p));
            liveTask(t2); markDirty();
          }
          return;
        }
        const s = slots(p, (D.days||[]).length);
        const here = slotIndex(s, posOf(t2));
        const want = slotPos(s, Math.max(0, o.start + (c.raw - o.grab)));
        const to = Math.max(0, Math.min(s.length - 1, Math.round(latch(here, want))));
        const moved = c.who !== t2.who;
        if(to === here && !moved) return;          // inside the dead zone: hold still
        if(SEL.has(o.id) && SEL.size > 1 && !moved){
          // Dragging one tile of a selection drags the set, keeping their spacing.
          if(shiftSelection(to - here)) selectedTasks().forEach(liveTask);
          return;
        }
        const pos = moved ? snapQ(Math.max(0, o.start + (c.raw - o.grab))) : s[to];
        const nd = dateAt(Math.floor(pos));
        if(!nd) return;
        t2.date = nd; t2.off = snapQ(pos - Math.floor(pos)); t2.who = c.who;
        liveTask(t2); markDirty();
      };
      const move = ev=>{
        pending = ev;
        if(!frame) frame = setTimeout(apply, FRAME_MS);
      };
      const up = ev=>{
        tab.removeEventListener('pointermove', move);
        tab.removeEventListener('pointerup', up);
        tab.removeEventListener('pointercancel', up);
        try{ tab.releasePointerCapture(ev.pointerId); }catch(_){}
        DRAGGING = '';
        if(frame){ clearTimeout(frame); frame = 0; }
        pending = null;
        document.querySelectorAll('.bar.drag').forEach(b=>b.classList.remove('drag'));
        // Let go over the backlog and the task leaves the sprint, keeping its name,
        // length and category so putting it back is one drag.
        const back = document.getElementById('back');
        if(back) back.classList.remove('hot');
        if(!o.resize && overBacklog(ev.clientX, ev.clientY) && shelveTask(o.id)){
          const into = catAt(ev.clientX, ev.clientY);
          if(into) recategorise(o.id, into);
          renderCards(); renderBacklog(); renderTray(); renderBoard();
          return;
        }
        renderCards(); renderBoard();
      };
      tab.addEventListener('pointermove', move);
      tab.addEventListener('pointerup', up);
      tab.addEventListener('pointercancel', up);
    });
  });
}

// Autosave decides whether a save should happen at all; doSave just does it. Keeping the
// decision separate is what makes it testable without waiting five seconds.
function shouldAutosave(){
  if(!DIRTY || SAVING) return false;
  // Mid-drag the numbers are still moving, and the editor may hold a name not yet committed.
  if(document.querySelector('#boardP .bar.drag')) return false;
  if(document.querySelector('#boardP .cellin')) return false;
  // Mid-sentence in any backlog box: saving now would store the half of the list that
  // exists and leave the line being typed out of it.
  const typing = document.activeElement;
  if(typing && typing.closest && typing.closest('#back') && typing.value
     && typing.value.trim()) return false;
  return true;
}

async function doSave(opts){
  const auto = !!(opts && opts.auto);
  if(SAVING) return false;
  // Snapshot what is being sent: edits made DURING the request must stay unsaved, not be
  // silently marked clean by a response that never carried them.
  const sent = JSON.stringify([TASKS, CATS]);
  SAVING = true; syncBtns();
  let r = null, err = '';
  try{
    r = await (await fetch('/api/sprint-board', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sprints: (ST.from&&ST.to)?[]:ST.sprints, tasks: TASKS,
                            cats: CATS, effort: EFFORT,
                            from: ST.from, to: ST.to})})).json();
  }catch(e){ err = e.message || 'network error'; }
  SAVING = false;
  if(r && r.ok){
    SAVE_ERR = '';
    SAVED_AT = new Date().toTimeString().slice(0,5);
    if(JSON.stringify([TASKS, CATS]) === sent) DIRTY = false;
    syncBtns();
    return true;
  }
  SAVE_ERR = err || (r && (r.__error__ || r.error)) || 'unknown';
  syncBtns();
  // A manual click says so out loud; autosave stays quiet and leaves it on the button,
  // because a popup every five seconds is worse than the failure.
  if(!auto) alert('Save failed: ' + SAVE_ERR);
  return false;
}

// Every sprint selection and every date window has its OWN plan, so switching is a
// different plan, not a filter over one. Save what is on screen before loading the next,
// or an edit made in the last few seconds would vanish with no way back.
async function switchTo(change){
  // Wait for a save already in flight rather than skipping: an edit made while it was
  // running is not in it, and loading the next plan over the top would lose that edit.
  for(let i = 0; i < 100 && SAVING; i++) await new Promise(r=>setTimeout(r, 20));
  if(DIRTY) await doSave({auto:true});
  change();
  syncBtns();
  load();
}

async function load(){
  if(!ST.sprints.length && !(ST.from && ST.to)){
    document.getElementById('boardP').innerHTML=
      '<div class="state">Pick a sprint, or set a From and To date to plan a cycle Jira has not created yet.</div>';
    document.getElementById('trayP').innerHTML='<div class="state">—</div>';
    document.getElementById('backP').innerHTML='<div class="state">—</div>';
    document.getElementById('cards').innerHTML='';
    return;
  }
  document.getElementById('boardP').innerHTML='<div class="state">Loading…</div>';
  const win = ST.from && ST.to;
  const qs = win ? [`from=${ST.from}`, `to=${ST.to}`] : [`sprints=${ST.sprints.join(',')}`];
  if(ST.projects.length) qs.push(`projects=${encodeURIComponent(ST.projects.join(','))}`);
  try{ D = await (await fetch('/api/sprint-board?'+qs.join('&'))).json(); }
  catch(e){ D={__error__:e.message}; }
  const err = D && (D.__error__||D.error);
  if(err){ document.getElementById('boardP').innerHTML=`<div class="state">Failed: ${esc(err)}</div>`; return; }
  EFFORT = !!((D.plan||{}).effort);
  // Headings saved on their own, plus any that only exist on a task (an older plan).
  CATS = ((D.plan||{}).cats||[]).slice();
  ((D.plan||{}).tasks||[]).forEach(t=>{
    const c = (t.cat||'').trim();
    if(c && !CATS.some(x=>x.toLowerCase()===c.toLowerCase())) CATS.push(c);
  });
  TASKS = ((D.plan||{}).tasks||[]).map(t=>{
    const n = Object.assign({}, t);
    // Plans saved while "parked" was its own state: parked work is simply work nobody
    // owns yet, so drop the flag and let it land in the backlog.
    if(n.parked){ n.who = ''; }
    delete n.parked;
    return n;
  });
  DIRTY = false;
  try{ renderCards(); renderBoard(); renderTray(); renderBacklog(); syncBtns(); }
  catch(e){ document.getElementById('boardP').innerHTML=
    `<div class="state">render error: ${esc(e.message)}</div>`; console.error(e); }
}

async function boot(){
  wireDD('ddSprints', renderSprintMenu);
  wireDD('ddProjects', renderProjectMenu);
  const effBtn = document.getElementById('effBtn');
  const syncEff = ()=>{
    effBtn.textContent = EFFORT ? 'Plan in: effort' : 'Plan in: days';
    effBtn.classList.toggle('primary', EFFORT);
    effBtn.title = EFFORT
      ? 'A tile\'s length is its effort spread over the days that effort really takes'
      : 'A tile\'s length is days on the calendar';
  };
  effBtn.addEventListener('click', ()=>{
    EFFORT = !EFFORT;
    markDirty();
    syncEff(); renderCards(); renderBoard(); renderBacklog();
  });
  syncEff();
  document.getElementById('reload').addEventListener('click', load);
  // Leave mode. The board is redrawn on toggle because the cells themselves change: in
  // leave mode they carry LeaveEditor's attributes instead of the board's own title.
  const lvBtn = document.getElementById('leaveBtn');
  lvBtn.addEventListener('click', ()=>{
    LEAVE = !LEAVE;
    lvBtn.classList.toggle('primary', LEAVE);
    lvBtn.textContent = LEAVE ? '🌴 Marking leave — click a day' : '🌴 Mark leave';
    renderBoard();
  });
  document.getElementById('saveBtn').addEventListener('click', doSave);
  // Date mode plans a window Jira has no sprint for, so there are no tickets to place —
  // only capacity and what you type. The sprint picker stays, so you can switch back.
  const fd=document.getElementById('fromD'), td2=document.getElementById('toD');
  fd.value=ST.from; td2.value=ST.to;
  const onWin=()=>{
    if(fd.value && td2.value && td2.value < fd.value){
      alert('To date is before From date.');
      return;
    }
    switchTo(()=>{ ST.from=fd.value; ST.to=td2.value; save(); });
  };
  fd.addEventListener('change', onWin); td2.addEventListener('change', onWin);
  document.getElementById('clearWin').addEventListener('click', ()=>{
    switchTo(()=>{ ST.from=''; ST.to=''; fd.value=''; td2.value=''; save(); }); });
  // Arrows nudge whatever is selected. A plain arrow is one WORKING day for that person;
  // with Shift it is a quarter, because that is the grid the board plans on.
  document.addEventListener('keydown', e=>{
    if(!SEL.size) return;
    const el = document.activeElement;
    if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
    if(e.key === 'Escape'){ clearSel(); paintSel(); return; }
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const dq = (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 4);
    if(shiftSelection(dq)){ renderCards(); paintBars(); }
  });
  // Clicking the grid away from a tile drops the selection, the way it does anywhere else.
  document.addEventListener('pointerdown', e=>{
    if(!SEL.size) return;
    if(e.target.closest && (e.target.closest('.bar') || e.target.closest('#back'))) return;
    clearSel(); paintSel();
  });
  // The push page plans the same cycle this board is on, so hand it the same window and
  // save first: it reads the STORED plan, and an unsaved tile would simply not be there.
  document.getElementById('pushBtn').addEventListener('click', async ()=>{
    if(DIRTY) await doSave({});
    const q = (ST.from && ST.to) ? `?from=${ST.from}&to=${ST.to}`
            : (ST.sprints||[]).length ? `?sprints=${ST.sprints.join(',')}` : '';
    location.href = '/jira-push' + q;
  });
  window.addEventListener('beforeunload', e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
  setInterval(()=>{ if(shouldAutosave()) doSave({auto:true}); }, AUTOSAVE_MS);
  const [s,p] = await Promise.all([
    fetch('/api/sprints').then(r=>r.json()).catch(()=>({sprints:[]})),
    fetch('/api/projects').then(r=>r.json()).catch(()=>({projects:[]}))]);
  SPRINTS=s.sprints||[]; PROJECTS=p.projects||[];
  if(!ST.sprints.length && !(ST.from && ST.to)){
    const act = SPRINTS.find(x=>x.state==='active')||SPRINTS[0];
    if(act){ ST.sprints=[act.id]; save(); }
  }
  syncBtns(); load();
}
boot();
</script>
