[pytest]
# Unit + integration tests for the ingest / derive pipeline.
# Scope is deliberately the project root only — the sklearn/scipy/numpy test
# suites that ship inside .venv must NOT be collected.
testpaths = tests
norecursedirs = .venv raw index state logs derived __pycache__ .git
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    db: test touches a temp SQLite events.db (never the real one)
    integration: exercises a full ingest store -> read round trip
