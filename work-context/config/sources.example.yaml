# Generic org-identity template. COMMITTED + published — no real identifiers.
# Copy to sources.yaml and fill in real values (sources.yaml is gitignored).
# Per-key env overrides: JIRA_DOMAIN, ATLASSIAN_EMAIL, JIRA_PROJECT_KEYS,
# GITHUB_ORG, GITHUB_REPOS.
org:
  email_domain: "example.com"
  owner_email: "owner@example.com"
  owner_handle: "owner"
atlassian:
  host: "your-org.atlassian.net"
jira:
  project_keys: ["EX"]
github:
  org: "example-org"
  repos:
    - "example-org/service-a"
    - "example-org/service-b"
  handle_prefixes: ["example-", "org-"]
  matterai_bot: "matterai-example[bot]"
  # PR-review bot summary marker (Claude Code Review posts as github-actions[bot];
  # match by this body marker, not the actor, which is overloaded with CI noise).
  claude_review_marker: "<!-- add-pr-comment:claude-review-summary -->"
  codegraph_repos: ["service-a", "service-c", "service-b"]
teams:
  home: "home-team"
  coowner: "payments-team"
  title: "Your Team"          # human display name (page titles / mastheads)
slack:
  workspace: "example"
  mom_channels: ["C0EXAMPLE"]
  standup_channel: "C0EXAMPLE"   # daily-standup routine target (env override: STANDUP_CHANNEL)
  rollup_channel: "C0EXAMPLE"    # rollup-classify run-summary target (env override: ROLLUP_CHANNEL)
  leave_plan_channel: "C0EXAMPLE"  # leave-plan-reminder routine target (env override: LEAVE_PLAN_CHANNEL)
  leave_plan_subteam: "S0EXAMPLE"  # subteam (user-group) the reminder pings (env override: LEAVE_PLAN_SUBTEAM)
  mcp_server: "example-mcp-id"   # Slack MCP server id, the hash in mcp__<id>__slack_* (env override: SLACK_MCP_SERVER)
launchd:
  prefix: "com.example"
match:
  tokens: ["ex"]
recurring:
  prefixes: []
