name: tests

# Server-side mirror of the pre-push test gate (.githooks/pre-push). Runs the
# hermetic ingest/derive suite on every push + PR to main. Unlike the local
# hook, this cannot be skipped with --no-verify / SKIP_TESTS, so it's the
# backstop for anything pushed from a clone without the hooks installed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-context
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: work-context/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (+ coverage floor)
        run: python -m pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=40
